      // than losing what somebody typed -- and only when the box still holds what was sent.
      // Two submits can overlap -- the round trip is short but it is not instant, and typing
      // again during it is ordinary -- and the earlier one's clear would otherwise wipe the
      // text of the later one. Measured in a real browser: send, type again within 150 ms,
      // send, and the second message was written and then erased before it could be read.
      if (await sendText(text) && message.value === text) {
        message.value = "";
        sizeComposer();
      }
    });

    // The stop is `/stop`, sent down the same route as everything else the page says: the REPL is
    // what decides what a line means, and a second verb for stopping would be a second thing to
    // keep in step with it. Nothing is typed into the box, so a half-written message survives being
    // interrupted -- which is the moment it most needs to.
    document.getElementById("stop").addEventListener("click", async (e) => {
      // One click is one stop. The button goes away when the turn ends, but that is a round trip
      // away, and a second click inside that window would send a `/stop` that arrives after nothing
      // is running -- where a bare line is an unknown command rather than an interrupt.
      e.target.disabled = true;
      await sendText("/stop");
    });

    // The pickers send the terminal's own commands, like everything else the page says: `/provider
    // <name>` and `/model <name>` are what a person would type, and the REPL is what decides what
    // they mean. `change` rather than `input`, because `input` fires on some browsers while the
    // list is merely being browsed -- which would switch the model on the way past an option.
    //
    // A send that is refused puts the control back to what is in force, from the state it was
    // drawn from: nothing else would, since the next frame only arrives if something changed.
    document.getElementById("pick-provider").addEventListener("change", async (e) => {
      if (!(await sendText("/provider " + e.target.value))) showState(doc);
    });
    document.getElementById("pick-model").addEventListener("change", async (e) => {
      if (!(await sendText("/model " + e.target.value))) showState(doc);
    });

    // With `?debug=1`, the page reports itself to `<FLINT_HOME>/web.log` every few seconds: how many
    // frames arrived, how many became blocks, and what the last one was. The hint line shows the
    // same thing, but the hint belongs to whoever is looking at the screen -- and this question was
    // asked four times over a console nobody could read from anywhere else.
    // Written by default, and that is a correction rather than a preference: the first version put
    // this behind `?debug=1`, and the bug it was built for was then reported again without a single
    // line of it -- a diagnostic that has to be switched on is one nobody switches on. The file is
    // the record; `?debug=1` only decides whether the same numbers are also shown on screen, which
    // is a display choice rather than a fact worth keeping.
    postLog("page opened · " + feedTrace(0, 0, "boot"));
    // Only when something has changed since the last line, so an idle page is silent and a stream
    // cannot write faster than the interval.
    let loggedTrace = "";
    setInterval(() => {
      const now = feedTrace(feedReceived, doc.blocks.length, feedLast);
      if (now === loggedTrace) return;
      loggedTrace = now;
      postLog(now);
    }, 3000);

    try {
      postLog("boot · painting");
      paint(doc);
      postLog("boot · painted");
      paintSessions();
      postLog("boot · sidebar drawn");
      readSessions().catch((e) => postLog("sessions failed: " + describe(e)));
      postLog("boot · sessions asked for");
      // The run's jobs, before the feed has said anything. A page opened while a long build is
      // running must show it: the `jobs` frame at connect may already have been sent, but the page
      // booting does not depend on having caught it.
      readJobs().catch((e) => postLog("jobs failed: " + describe(e)));
    } catch (e) {
      // The boot had no error surface at all: a throw here skipped the sidebar, the sessions and
      // the feed together, and the only thing that arrived was "page opened" -- which is exactly
      // what the log showed. A page that cannot start has to be able to say where it stopped.
      postLog("boot failed: " + describe(e));
      setHint("this page cannot start: " + describe(e));
    }
    follow().catch((e) => {
      doc.blocks = [
        { kind: "damage", text: "cannot follow this flint: " + e.message },
      ];
      paint(doc);
    });
  } else {
    // A file opened from disk: a session somebody dropped on the page, or an export, which is this
    // same page with the conversation welded into it. Nothing is fetched either way -- `file:` is what
    // `servedByFlint` is false for -- and the drop zone stays visible, because a reader of an exported
    // conversation dropping their own session on it is a reasonable thing to do next.
    const island = document.getElementById("session");
    const carried = islandLines(island);
    if (carried) {
      applyText(doc, carried);
    } else if (island) {
      // Present and unreadable is a broken export rather than an empty conversation, and the
      // difference matters: one is a file to send back, the other is a page with nothing in it.
      doc.blocks = [{ kind: "damage", text: "this export's conversation cannot be read" }];
      setHint("this export is damaged: its conversation is not readable");
    }
    paint(doc);
  }
}

// For the Node test in scripts/web-view-test.js, and for the page's own console.
if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    newDoc, applyLine, applyText, applyEvent, tokenFromSearch, servedByFlint, sseFrames,
    islandLines,
    sessionsFrom, messageBody, resumeLine, streamingAnswer, carryStreaming, setStreamingAnswer,
    paint, feedTrouble, tokenRefused, feedTrace, debugFeed, applyState, showState, fillSelect,
    showToggles, showCommands, showActions, sessionRow, formLine,
    addressParts, asUrl, asPath, bytesLabel, previewNote, linkNodes, renderBlock, fileRoute,
    // `POST /open`'s half of the panel: the body the route takes, and the frame's own write guard,
    // which is what decides whether the control is offered at all. Exported because both are pure --
    // one takes a path, the other reads a frame -- so the Node harness can check them without a
    // browser, which is the only way the readonly case is checked without turning a live run's guard
    // on in the middle of a turn.
    openBody, readonlyOn,
    jobsFrom, durationLabel, jobWhen, jobIsLive,
    // The position this tab was reading from: exported so the Node harness can check the three cases
    // -- a gap, a different conversation, and a position past the end -- against the real functions
    // rather than against the page's text.
    SEEN_KEY, remembered, remember, notePosition,
    // The `/say --to` picker: `describePeer` and `fillPeerSelect` are pure enough to check in the
    // sandbox, which is where the label/value split and the broadcast default are held.
    describePeer, fillPeerSelect,
  };
}
</script>
