    // Clipped. The label kept a prefix of the first line and said there was more of this question:
    // either the line went on past the label, or there are lines after it.
    const head = label.slice(0, -4);
    return first.slice(0, head.length) === head && (first.length > head.length || lines > 1);
  }
  // Whole: the run kept all of it, so the turn has to be exactly that one line.
  return first === label && lines === 1;
}

/// Which answers carry a branch button: block index to the line that button sends and the question it
/// cuts in front of.
///
/// The frame's `/fork` row is this conversation's own questions -- `values` their numbers, `labels`
/// their first lines -- and the page has drawn those questions, so this pairs the two lists **from the
/// end**. From the end because that is where they agree: a `/compact` drops a prefix of the questions
/// and keeps every one after it, so the run's list is a suffix of what the page drew, and the newest
/// question is never the one that went. Pairing from the front would be a page deciding for itself how
/// much of the file the run has folded away, which is a fact about the run's history and not about the
/// text on screen.
///
/// Three rules, and each of them is about not lying:
///
/// * A pairing is believed only when the turn's own text is the question the label names, **and** it
///   is the only turn there that does. Without that check the page would be assuming its last N
///   questions are the run's N -- false after a fold, and false after an `/import` of a folded
///   conversation -- and it would hang the button on the wrong answer. With it, a page that has lost
///   the thread draws no buttons, which is the honest drawing.
/// * The frame's first value is skipped. It cuts in front of the question the run has held the
///   longest, and nothing the run still holds comes before it: what the page drew there is a fold's
///   tail (or nothing at all), and a button on that answer would promise a branch that does not
///   contain it.
/// * A turn in flight puts the two lists one question apart -- the frame is built between turns, so
///   the run does not know the question being asked yet -- and the check above then refuses every
///   pairing. That is the honest answer rather than a wrong one: the settings dialog's own list names
///   every question and works while an answer streams.
function branchPoints(doc) {
  const marks = new Map();
  const commands = doc.state && Array.isArray(doc.state.commands) ? doc.state.commands : [];
  const row = commands.find((command) => command && command.send === "/fork");
  if (!row) return marks;
  const values = Array.isArray(row.values) ? row.values : [];
  const labels = Array.isArray(row.labels) ? row.labels : [];
  // One list, and long enough that there is something to cut in front of.
  if (labels.length !== values.length || values.length < 2) return marks;
  const turns = [];
  doc.blocks.forEach((block, at) => {
    if (block.kind === "user") turns.push(at);
  });
  // How many of the drawn turns each label names. A label that names more than one is one this page
  // cannot point at: two questions that read the same are two answers a person could have meant.
  const named = new Map();
  for (const at of turns) {
    for (const label of labels) {
      if (isTheQuestion(doc.blocks[at].text, label)) {
        named.set(label, (named.get(label) || 0) + 1);
      }
    }
  }
  for (let i = 1; i < labels.length; i++) {
    const label = labels[i];
    if (named.get(label) !== 1) continue;
    const question = turns[turns.length - labels.length + i];
    if (question === undefined || !isTheQuestion(doc.blocks[question].text, label)) continue;
    // The answer this cut keeps: the last one above the question, and nothing is marked if a
    // question comes first -- a turn that was steered before it answered has no answer to cut from.
    for (let at = question - 1; at >= 0; at--) {
      if (doc.blocks[at].kind === "user") break;
      if (doc.blocks[at].kind === "assistant") {
        // The line from the frame's own `send` and one of the values it offered, the same composition
        // every other control on this page uses: the page never spells a command name into a cut.
        marks.set(at, { line: row.send + " " + values[i], label });
        break;
      }
    }
  }
  return marks;
}

/// The one control under an answer: cut a new conversation from here.
///
/// The line is composed the way every other line this page sends is -- the frame's own `send` and one
/// of the values it offered -- so the page never spells a command name into a branch. What the button
/// means is what `/fork n` means: the branch keeps everything up to and including this answer and
/// drops what came after, which is how a question gets asked again.
function branchBar(line, label) {
  const bar = el("div", "turn-tools");
  const button = el("button", "branch", "fork from here");
  button.type = "button";
  button.title = "start a new conversation that keeps everything up to and including this answer"
    + (label ? " — cut in front of “" + label + "”" : "");
  button.addEventListener("click", () => sendText(line));
  bar.appendChild(button);
  return bar;
}

/// One block as an element. Pure: it reads the block and builds a node.
///
/// Split out of `paint` so that `paint` can decide *which* blocks to rebuild rather than
/// rebuilding all of them. Everything this returns is text through `textContent`, which is the
/// policy the tests check.
function renderBlock(block, branch) {
  if (block.kind === "tool") return toolBlock(block);
  if (block.kind === "notice") return el("div", "notice " + (block.level || ""), block.text);
  if (block.kind === "damage") {
    const box = el("div", "notice damage");
    box.appendChild(el("b", "", "damaged line — "));
    box.appendChild(document.createTextNode(block.text));
    return box;
  }
  if (block.kind === "system") {
    // Collapsed, and for the same reason the terminal does not print it: the instructions are
    // a few thousand characters that are nearly the same in every session, so expanded they
    // push the actual conversation off the first screen. They are in the document because "what
    // was the model actually told" is one of the questions this page exists to answer -- and
    // that was measured rather than assumed: the first version painted it open, and one
    // screenshot was enough.
    const box = el("details", "system");
    box.open = block.open === true;
    box.appendChild(el("summary", "", "instructions"));
    box.appendChild(el("div", "body", block.text));
    // The block remembers, so even a rebuild -- `load`, which replaces the document -- puts it
    // back the way the reader left it.
    box.addEventListener("toggle", () => { block.open = box.open; });
    return box;
  }
  const turn = el("div", "turn " + block.kind);
  if (block.kind === "user") turn.appendChild(el("div", "who", "you"));
  if (block.kind === "assistant") turn.appendChild(el("div", "who", "flint"));
  if (block.kind === "command") turn.appendChild(el("div", "who", block.input));
  if (block.reasoning) {
    const r = el("details", "reasoning");
    r.open = block.reasoningOpen === true;
    r.appendChild(el("summary", "", "thinking"));
    r.appendChild(el("div", "body", block.reasoning));
    r.addEventListener("toggle", () => { block.reasoningOpen = r.open; });
    turn.appendChild(r);
  }
  // The turn's own words, with the addresses in them: a URL a person can press, and a path that
  // opens beside the conversation. The narrow path rule is the right one here -- see
  // `addressParts` -- because a sentence is where `and/or` and `e.g.` live.
  const body = el("div", "body");
  for (const node of linkNodes(block.text, true)) body.appendChild(node);
  turn.appendChild(body);
  // The branch control, when this answer is one a value cuts from. Handed in rather than looked up
  // here so that `renderBlock` stays a pure function of its arguments.
  if (branch) turn.appendChild(branchBar(branch.line, branch.label));
  return turn;
}

/// The "nothing loaded yet" paragraph, while it is on screen.
let placeholder = null;

/// The nodes currently on screen, parallel to the document's blocks.
///
/// `{ rev, node }`, and the revision is the whole of the comparison: a block whose `rev` has not
/// changed has not changed, so its node is still right and is left alone. Leaving it alone is
/// what keeps a selection, an open `details` and the reader's place on the page.
let painted = [];

function paint(doc) {
  paintTitle(doc);
  const meta = document.getElementById("meta");
  meta.textContent = "";
  const m = doc.meta || {};
  for (const [label, value] of [
    // The state frame carries both of these, with the alternatives beside them on the settings
    // screens -- so with a state, printing them here as well would be the same fact twice, one
    // of the copies unable to be changed. A dropped file has no state frame, and this line is
    // then its only account of which model wrote it.
    ["model", doc.state ? "" : m.model], ["cwd", m.cwd],
    ["provider", doc.state ? "" : m.provider],
    ["id", m.id], ["created", m.created],
  ]) {
    if (value) meta.appendChild(el("span", "", label + " " + value));
  }
  if (doc.usage) {
    const p = doc.usage.prompt_tokens, c = doc.usage.completion_tokens;
    if (p !== undefined || c !== undefined) {
      meta.appendChild(el("span", "", "tokens " + (p || 0) + "+" + (c || 0)));
    }
  }

  const root = document.getElementById("doc");
  // Content and scrolling are two different elements now: `#doc` is the reading column, and the
  // scroll container is the pane it sits in. Reading the scroll state off the content was a real
  // bug for one build -- `#doc` does not scroll, so `scrollTop` was always 0, `scrollHeight` and
  // `clientHeight` were equal, `wasAtBottom` came out true, and writing `scrollTop` on it moved
  // nothing: an answer arriving below the fold left the page looking frozen while the terminal
  // had it. The two names are kept apart on purpose below, because they are not the same node.
  const scroller = document.getElementById("transcript");
  // Read before anything is touched. "Was the reader at the bottom" is the question the page
  // has to answer for itself, and it is answered here because this is the last moment the old
  // layout exists. Measured: with no such handling the transcript stayed pinned at the top
  // while an answer streamed past 55,000 pixels below the fold -- you ask something, and watch
  // the question while the answer arrives out of sight.
  const slack = 40;
  const wasAtBottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - slack;
  const wasAt = scroller.scrollTop;

  if (!doc.blocks.length) {
    root.textContent = "";
    painted = [];
    placeholder = el("p", "empty", "Nothing loaded yet.");
    root.appendChild(placeholder);
  }
  // It is a block nothing owns, so it goes when the first real one arrives.
  if (placeholder && doc.blocks.length) {
    if (placeholder.parentNode === root) root.removeChild(placeholder);
    placeholder = null;
  }

  while (painted.length > doc.blocks.length) {
    const gone = painted.pop();
    if (gone.node.parentNode === root) root.removeChild(gone.node);
  }
  // Which answers carry a branch button, recomputed from this frame's blocks and this state. Part of
  // the comparison below rather than a property of a block: the value a button sends is a fact about
  // the run's question list, and a fold or a new question can move it without the answer's own text
  // changing a character.
  const branches = branchPoints(doc);
  for (let i = 0; i < doc.blocks.length; i++) {
    const block = doc.blocks[i];
    const existing = painted[i];
    const branch = branches.get(i) || null;
    if (
      existing &&
      existing.rev === block.rev &&
      existing.fork === (branch ? branch.line : null) &&
      existing.node.parentNode === root
    ) {
      continue;
    }
    const node = renderBlock(block, branch);
    if (existing && existing.node.parentNode === root) root.replaceChild(node, existing.node);
    else root.appendChild(node);
    painted[i] = { rev: block.rev, fork: branch ? branch.line : null, node };
  }

  // An answer that is arriving follows the bottom of the page only if the reader was already
  // there: scrolling somebody back down while they are reading further up is the other half of
  // this behaviour, and the half that is easy to forget.
  scroller.scrollTop = wasAtBottom ? scroller.scrollHeight : wasAt;

  const status = document.getElementById("status");
  if (doc.status) {
    status.textContent = "";
    status.appendChild(el("b", "", "flint"));
    status.appendChild(document.createTextNode("  " + doc.status));
    status.hidden = false;
  } else {
    status.hidden = true;
  }

  // The interrupt, offered for exactly as long as there is something to interrupt. It is read from
  // the turn's own boundaries rather than from `doc.status`, which also carries feed trouble: a page
  // that cannot see the feed must not offer a button that would send a stop to nothing.
  const stop = document.getElementById("stop");
  if (stop) stop.hidden = !doc.running;
}

// ---------------------------------------------------------------------------
// Wiring. L1: a dropped file. L2 and L3: `--web` feeds the same model from `/session` and
// takes what is typed here back through `/message`.
// ---------------------------------------------------------------------------

const doc = newDoc();

/// The conversations `/resume` can reach, as the process last described them.
let sessions = [];

/// What the conversation the run is holding is called, out of the last listing.
///
/// Empty until a listing arrives, which is the honest answer for a page opened from a dropped file:
/// there is no process, so there is no list, and the header falls back to what the file itself says.
let currentLabel = "";

/// What the header should call this conversation.
///
/// Two sources, and the order between them is the decision. The session file's own newest `title`
/// event arrives live on the stream and is what a rename moves first; the label comes with the
/// conversation list, where `session::list` chose it in one place: the newest name, else the first
/// thing that was said, else "(empty)". The label is the *fallback* even though it is the fuller
/// answer -- a conversation nobody has named gets its opening words here instead of the product's
/// name -- because `doc.title` is the fact this run is holding, and a page that replaced it with a
/// list it read a moment ago would go backwards after a rename. `flint` is the last resort, for a
/// page with neither: a dropped file that has no title in it yet.
function titleWords(doc, label) {
  return (doc && doc.title) || label || "flint";
}

/// Put that name above the conversation, and keep the whole of it in the tooltip: the line clips
/// with an ellipsis when a name is long, and the tooltip is the copy that is not clipped.
function paintTitle(doc) {
  const title = document.getElementById("title");
  if (!title) return;
  const words = titleWords(doc, currentLabel);
  title.textContent = words;
  title.title = words;
}

/// Whether anything typed here can actually be sent. False for a page opened from disk, which
/// has no listener to post to -- so the composer is simply not there rather than present and
/// failing.
let canSend = false;

// ---------------------------------------------------------------------------
// the sidebar
// ---------------------------------------------------------------------------

/// Repaint the left column.
///
/// A full render rather than a diff, for the same reason the transcript is: the list is tens of
/// rows, and a renderer that is always a function of the state cannot drift from it.
function paintSessions() {
  const list = document.getElementById("sessions");
  if (!list) return;
  list.textContent = "";
  // Which conversation the run is holding, and what to call it in the header. Read before the empty
  // return: a list that came back empty means this run is holding nothing, and the header has to
  // stop claiming a name it no longer has.
  const here = sessions.find((session) => session.current);
  currentLabel = here ? here.label : "";
  paintTitle(doc);
  if (!sessions.length) {
    list.appendChild(el("li", "none", "no conversations yet"));
    return;
  }
  for (const session of sessions) list.appendChild(sessionRow(doc, session));
}

/// The frame's rows that destroy something and take their argument from the list `from` names.
///
/// Shared by the panel's choice lists and the sidebar's per-conversation menu, so the two cannot
/// disagree about what may be sent at another conversation. The frame is the only place that list
/// lives: `/delete` is not a word this file knows, and a command the terminal gains or loses moves
/// both controls with no edit here.
function destroyingRows(doc, from) {
  const commands = doc.state && Array.isArray(doc.state.commands) ? doc.state.commands : [];
  return commands.filter(
    (command) =>
      command &&
      command.class === "danger" &&
      command.from === from &&
      typeof command.send === "string"
  );
}

/// The line a form's answers make, or null when one the frame did not mark optional is missing.
///
/// A pure function because both halves of it matter and neither is visible in a drawing: the order
/// of the answers -- they are the words of the line, so a page that reordered them would send a
/// different command -- and the refusal. The refusal is the one worth having: `send` with no answers
/// is the command's *interactive* form, so a page that sent an empty one would hand the run to a
/// wizard asking questions of a terminal nobody is sitting at.
///
/// An optional answer that is empty ends the line rather than being skipped. A space-separated line
/// cannot leave a hole in the middle, which is why the frame puts the optional answers last; walking
/// past an empty one would silently promote the answer after it into its place.
function formLine(send, fields, values) {
  const answers = [];
  for (let at = 0; at < fields.length; at += 1) {
    const spec = fields[at] || {};
    const answer = String(values[at] == null ? "" : values[at]).trim();
    if (!answer) {
      // Left out where the frame said it may be, and *skipped* rather than stopping the line: an
      // optional answer carrying a flag is a phrase of its own, so `/say [--to <pid>] <text>` composes
      // without the address, while the positional ones the table has always had are last by
      // construction and a `continue` reaches the same place a `break` did.
      if (spec.optional) continue;
      return null;
    }
    // The literal an answer follows, when it is not positional: `/say --to 123 the words`. The frame
    // carries it rather than the page knowing a grammar, which is the same rule as `field` being the
    // input's `type`.
    if (spec.flag) answers.push(spec.flag);
    answers.push(answer);
  }
  return [send].concat(answers).join(" ");
}

/// A picker over the runs that share this directory's mailbox, for `/say --to <pid>`.
///
/// Fetched when the row is drawn, which is the one moment the list is wanted, and read from
/// `GET /peers` — the same `live::peers_here` the terminal's `/say` addresses and its reply describes,
/// so the page cannot offer a pid the terminal would not. The empty option is the default and it
/// *means* the broadcast: `/say <text>` reaches everyone here, which is what this row did before it
/// could address one, and a picker with no way back to that would be a regression wearing a feature's
/// clothes. Nothing is cached: presence is a file somebody else is writing, and a remembered list
/// would be the page's own idea of who is here.
function describePeer(peer) {
  const parts = ["pid " + peer.pid];
  if (peer.model) parts.push(peer.model);
  if (peer.readonly) parts.push("read-only");
  const age = Number(peer.age_secs);
  parts.push(!age ? "here now" : "last said so " + durationLabel(age) + " ago");
  return parts.join(" · ");
}

/// Fill the peer picker, keeping the pid as the value and the description as the label.
///
/// Not the settings' own control, and the difference is the point of the row: what is *sent* is a pid
/// and what is *read* is who that pid is, so a control that makes those the same string cannot express
/// it -- and this one is an answer inside a form rather than a value in force on a screen. The options
/// are removed one at a time because the stub DOM in `scripts/web-view-test.js` has no
/// `textContent = ""`.
function fillPeerSelect(select, peers, note) {
  if (!select) return;
  while (select.firstChild) select.removeChild(select.firstChild);
  const everyone = el("option", "", note || "(everyone here)");
  everyone.value = "";
  everyone.selected = true;
  select.appendChild(everyone);
  for (const peer of peers || []) {
    const option = el("option", "", describePeer(peer));
    option.value = String(peer.pid);
    select.appendChild(option);
  }
  select.value = "";
}

function peerPicker() {
  const select = el("select", "value");
  fillPeerSelect(select, []);
  fetch("/peers", { headers: authHeader() })
    .then((response) => (response.ok ? response.json() : null))
    .then((listing) => {
      const peers = listing && Array.isArray(listing.peers) ? listing.peers : [];
      fillPeerSelect(
        select,
        peers,
        peers.length
          ? "(everyone here)"
          : "(nobody else is here — it waits in the file for the next run)"
      );
    })
    .catch(() => {
      // A listing the page could not read leaves the broadcast, which is the safe half: the message
      // is written for whoever comes next either way, and only the address needs the list.
    });
  return select;
}

/// One conversation, and the actions it has, which are its own row's business rather than the
/// panel's.
///
/// The row opens the conversation, as it always has. The button at its end opens a short list
/// instead, because archiving or removing the conversation you are looking at should not mean
/// finding the command in another panel and picking the number off this list by eye. Two presses, as
/// everywhere: the button opens the list, and the row in it says the whole line -- the frame's own
/// `send` and this row's number -- before it sends it. What the list holds comes from the frame (see
/// `destroyingRows`), and the number is this row's, which is the numbering those commands take.
///
/// The conversation you are in is offered them too. The terminal refuses it and says why ("/new
/// starts a fresh one; then this one can be filed away by its number"), and that answer is better
/// than a page that hides a row because it decided a rule the terminal owns.
function sessionRow(doc, session) {
  const item = el("li", session.current ? "current" : "");
  item.appendChild(el("span", "n", String(session.n)));
  item.appendChild(el("span", "label", session.label));
  // The id is what the row *is*, for anything that wants to check itself against the file.
  item.title = session.id;
  item.addEventListener("click", () => openConversation(session));

  const more = el("button", "more", "\u22ef");
  more.type = "button";
  more.title = "actions for this conversation";
  more.addEventListener("click", (event) => {
    // The row behind it is the conversation, and opening it is not what this press meant.
    if (event && event.stopPropagation) event.stopPropagation();
    // By id, not by number: the numbers under a menu are positions, and the list can shift under it.
    doc.menu = doc.menu && doc.menu.id === session.id ? null : { n: session.n, id: session.id };
    paintSessions();
  });
  item.appendChild(more);

  if (doc.menu && doc.menu.id === session.id) item.appendChild(sessionMenu(doc, session));
  return item;
}

/// The actions a conversation has, as the rows of its menu.
///
/// A node rather than a side effect on `item`, so what is drawn is a function of the document and
/// can be read back without a browser -- the same reason every other drawer here returns its nodes
/// through the DOM it was given.
function sessionMenu(doc, session) {
  const menu = el("div", "menu");
  const actions = destroyingRows(doc, "sessions");
  for (const command of actions) {
    const row = el("button", "row danger");
    row.type = "button";
    row.title = command.help || "";
    row.addEventListener("click", (event) => {
      if (event && event.stopPropagation) event.stopPropagation();
      // The second press, and the line has been on the screen since the menu opened.
      doc.menu = null;
      sendText(command.send + " " + session.n);
    });
    row.appendChild(el("code", "", command.send + " " + session.n));
    row.appendChild(el("span", "", command.help || ""));
    menu.appendChild(row);
  }
  // The name, and only for the conversation the run is *writing*.
  //
  // A field for the frame's own `/name` row, drawn only when the frame has one -- the rule the
  // destructive rows above already follow, for the same reason: which commands a run offers is a fact
  // the frame owns, and a control for a command that is not there sends a line nobody can answer.
  //
  // `/name` names the open conversation -- that is what the terminal's own command means, and this
  // page will not give it a second meaning. Offering it on another row would either rename the wrong
  // conversation or would have to switch to that one first, which is a different action with a
  // visible consequence (the transcript changes under the person) and a second line whose *refusal*
  // -- a session archived in the meantime -- would leave the rename aimed at whatever was open.
  // Click the row to open it, then rename it here.
  const rename = session.current ? frameForm(doc, "/name") : null;
  if (rename) menu.appendChild(nameRow(doc, session, rename));
  // An empty menu is indistinguishable from one that failed to draw, so it says which it is -- and
  // a rename field counts as something to do, which is why this asks the menu rather than the frame.
  if (!menu.children.length) menu.appendChild(el("div", "row", "nothing to do from here"));
  return menu;
}

/// One of the frame's own command rows, when it offers the command and says what it takes.
///
/// The sidebar composes `/resume` and `/new` itself, because those two lines *are* the sidebar -- a
/// number the list is showing, and a button that starts one -- and there is nothing in the frame to
/// read them from. A command that takes answers is different: the frame says which answers it wants
/// and what the answers are for, so the field is drawn from that rather than described a second time
/// here. A second description is one that drifts, which is the argument the panel's rows are built on.
function frameForm(doc, send) {
  const commands = doc.state && Array.isArray(doc.state.commands) ? doc.state.commands : [];
  for (const command of commands) {
    if (!command || command.send !== send) continue;
    const fields = Array.isArray(command.fields) ? command.fields : [];
    if (fields.length === 0) continue;
    return { send: send, fields: fields, help: typeof command.help === "string" ? command.help : "" };
  }
  return null;
}

/// The rename row: the name it is called now, in the frame's own field, and the command that sets it.
///
/// One input per answer the frame names, so this draws a name rather than assuming a name is one word
/// of text, and the button says the command the frame says it sends. The field starts on the label in
/// force -- a rename is usually a correction -- unless that label is this page's own `(empty)`, which
/// is a placeholder for a conversation that has no name rather than a name, and sending it would give
/// the conversation `(empty)` as its actual name.
function nameRow(doc, session, command) {
  const form = el("form", "field");
  const inputs = command.fields.map((spec) => {
    const input = el("input", "value");
    input.type = spec && spec.field === "password" ? "password" : "text";
    input.placeholder = command.help || command.send;
    return input;
  });
  if (inputs.length > 0) inputs[0].value = session.label === "(empty)" ? "" : session.label;
  const submit = el("button", "send", command.send);
  submit.type = "submit";
  // The row behind this field *is* the conversation, and clicking into the field is not a press on
  // it: without this the press that puts the cursor in the field would bubble up and open the
  // conversation -- and for this row that is the conversation already open, so `/resume` would
  // rebuild the transcript under the person half-way through typing a name into it.
  form.addEventListener("click", (event) => {
    if (event && event.stopPropagation) event.stopPropagation();
  });
  form.addEventListener("submit", (event) => {
    if (event && typeof event.preventDefault === "function") event.preventDefault();
    if (event && event.stopPropagation) event.stopPropagation();
    const line = formLine(command.send, command.fields, inputs.map((input) => input.value));
    // An emptied field sends nothing, and the reason is not politeness: `/name` with no text
    // *reports* the name, which is a different command, and nobody clearing this field asked to be
    // told what the conversation is called.
    if (!line) return;
    doc.menu = null;
    paintSessions();
    sendText(line);
  });
  for (const input of inputs) form.appendChild(input);
  form.appendChild(submit);
  return form;
}

/// Ask the process to switch conversations.
///
/// By sending `/resume <n>` up the message route, which means the page never touches a session
/// file, never builds a path, and has no opinion about what "switching" is: it types what the
/// user would have typed. Everything that follows -- the file, the terminal, the transcript,
/// this sidebar -- is the process's own behaviour, and the page's only job is to draw the
/// result when the `reset` frame says the document is stale.
async function openConversation(session) {
  if (session.current) return;
  await sendText(resumeLine(session.n));
}

async function readSessions() {
  if (!canSend) return;
  try {
    const response = await fetch("/sessions", { headers: authHeader() });
    if (!response.ok) throw new Error("HTTP " + response.status);
    sessions = sessionsFrom(await response.text());
  } catch (e) {
    // Keep whatever was last drawn. A sidebar that emptied itself because one request failed
    // would look like the conversations had been deleted.
    sessions = sessions.map((s) => s);
    return;
  }
  // A menu whose conversation is gone stays open in the state and draws nowhere, which would leave
  // the *next* press of its button toggling a menu nobody can see. Closed here rather than in the
  // drawing, because this is where the list is known to be current.
  if (doc.menu && !sessions.some((s) => s.id === doc.menu.id)) doc.menu = null;
  paintSessions();
  // If a destructive row's choices are open, they are *these* rows: the numbers in the list are
  // positions, and a list that changed under an open choice list would point the next press at the
  // conversation below the one that went.
  if (doc.confirm) paintSettings(doc);
}

// ---------------------------------------------------------------------------
// the preview: a file a tool block named, opened over the reading
// ---------------------------------------------------------------------------

/// The file on screen, in the transcript's own words: `{ path, line }`, or `null` when closed.
///
/// The path is kept as the transcript wrote it rather than as the route resolved it, because the
/// header shows the reader what they pressed -- and the route is the one place that resolves a
/// relative path against the run's working directory.
let preview = null;

/// Open a path, or move the panel to another one. `line` of zero means the transcript named no
/// line, which is the usual case.
async function openPreview(path, line) {
  preview = { path: path, line: line || 0, view: previewView(path, line) };
  const panel = document.getElementById("preview");
  if (panel) panel.hidden = false;
  // The hand goes with the panel, and in the same two places: a hand with nothing behind it would
  // resize a column nobody can see, and its 5px would be a strip of the page that does nothing. Its
  // reported width is read here rather than at boot, because at boot the panel is closed and an
  // unopened column measures zero -- a reader would be told the panel it just opened is 0px wide.
  const hand = document.getElementById("preview-grip");
  if (hand) {
    hand.hidden = false;
    if (typeof panel.getBoundingClientRect === "function") {
      hand.setAttribute("aria-valuenow", String(Math.round(panel.getBoundingClientRect().width)));
    }
  }
  paintPreviewHead();
  await readPreview();
}

/// Close it. The transcript, the scroll position and the reader's place are untouched: this panel
/// never owned any of them. The picture's blob URL is let go of, which is the one thing here that is
/// the page's own memory rather than the run's.
function closePreview() {
  preview = null;
  showPicture(null);
  const panel = document.getElementById("preview");
  if (panel) panel.hidden = true;
  const hand = document.getElementById("preview-grip");
  if (hand) hand.hidden = true;
}

/// The path, split so the file's own name stays in full ink while the directories give way.
///
/// The head's fourth control is decided here too, and it is decided from the frame: `open` hands
/// the path to the program this machine uses for it, which is a launch, and a run whose own guard
/// refuses to launch programs must not offer one. The route refuses as well -- the page is not the
/// authority, and a hand-written request is not stopped by a disabled button -- but a control that
/// was always there and always bounced would be a worse answer than one that says why.
function paintPreviewHead() {
  const node = document.getElementById("preview-path");
  if (!node) return;
  node.textContent = "";
  const open = document.getElementById("preview-open");
  // The same two facts for the picture, which is the *other* control that starts a program: pressing
  // it hands the file to the OS. One decision, two places it is drawn, so it is worked out once.
  const picture = document.getElementById("preview-image-button");
  const held = !canSend || readonlyOn(doc && doc.state);
  const why = !canSend
    ? "this page has no flint behind it: opening a path is the run's own route"
    : readonlyOn(doc && doc.state)
      ? "this run is readonly, and opening a path starts a program on this machine"
      : "open it where it lives, in whatever this machine uses for it";
  if (open) {
    open.disabled = held;
    open.title = why;
  }
  if (picture) {
    picture.disabled = held;
    picture.title = held ? why : "press to " + why;
  }
  if (!preview) return;
  node.title = preview.line ? preview.path + ":" + preview.line : preview.path;
  const cut = Math.max(preview.path.lastIndexOf("/"), preview.path.lastIndexOf("\\"));
  if (cut > 0) node.appendChild(el("span", "dirs", preview.path.slice(0, cut + 1)));
  node.appendChild(el("span", "name", cut > 0 ? preview.path.slice(cut + 1) : preview.path));
}

/// Whether a state frame says the run's write guard is on.
///
/// A pure function of the frame, which is where the answer lives: the switch on the `run` screen and
/// this are the same field, set by the terminal's own `/readonly` and handed to the page by the run.
/// A page deciding for itself what the guard is would be a second opinion about a permission -- and a
/// caller that takes the state as an argument is a caller the Node harness can ask about a guarded
/// run without one being open.
///
/// Read out of the settings rather than out of a field of its own: a switch is a setting now, so
/// `readonly` arrives as one key among the others with `on` as its value -- and a second channel for
/// the same fact is exactly what this page spent a commit deleting.
function readonlyOn(state) {
  if (!state || !Array.isArray(state.settings)) return false;
  const guard = state.settings.find((s) => s && s.key === "readonly");
  return !!guard && String(guard.value) === "on";
}

/// The body `POST /open` wants.
///
/// A function of its own for the reason `fileRoute` is one: the path goes into JSON, and a path
/// with a quote or a backslash in it has to arrive as itself. A body assembled by concatenation at
/// the call site is where a Windows path becomes a broken request.
function openBody(path) {
  return JSON.stringify({ path: path });
}

/// Hand the panel's path to the program this machine uses for it.
///
/// The second press, and deliberately not the first: a path in the transcript is a button that
/// reads the file into this panel, and this is the separate, named control beside it. The text the
/// transcript carries is model-written, so a plain click on it must never be the thing that starts
/// a process -- and the cases this is for are exactly the ones the panel cannot serve: a directory,
/// a file past the preview cap, anything that is not text.
///
/// The route's answer is the whole of the feedback. It says what it opened with, or why it would
/// not, in its own words, and the hint shows those rather than a status code.
async function openOutside() {
  if (!preview) return;
  const body = openBody(preview.path);
  let response;
  try {
    response = await fetch("/open", { method: "POST", headers: authHeader(), body: body });
  } catch (e) {
    setHint("cannot open it: " + describe(e), true);
    return;
  }
  const text = (await response.text()).trim();
  if (!response.ok) {
    setHint("not opened: " + text, true);
    return;
  }
  let said = {};
  try {
    said = JSON.parse(text);
  } catch (e) {
    said = {};
  }
  setHint("opened " + (said.opened || preview.path) + " with " + (said.with || "the system"), false);
}

/// The route one path is read through, encoded.
///
/// A function of its own so the encoding is testable on its own: `encodeURIComponent` is what the
/// route's decoder expects, and a path with a backslash, a space or a `+` in it is a file like any
/// other -- the alternative, assembling the URL at the call site, is the one place a `+` would
/// quietly become a space.
function fileRoute(path) {
  return "/file?path=" + encodeURIComponent(path);
}

/// The route a picture is read through, encoded: `GET /image` (§21 of `docs/web-mode.md`).
///
/// The same shape as `fileRoute` and a route of its own rather than a flag on that one, because the
/// two answer with different *kinds* of body -- text a `<pre>` takes, and bytes a `<img>` takes -- and
/// the route decides which of those a file is by looking at its first bytes rather than at its name.
function imageRoute(path) {
  return "/image?path=" + encodeURIComponent(path);
}

/// The extensions this page will **ask** `/image` about, because a name is all it has to go on.
///
/// The decision is a guess the route then confirms or refuses: the page cannot sniff bytes before it
/// has fetched them, so it asks first and falls back to `/file` when the answer is a refusal. That is
/// why an extension that is *not* here can still be a picture (it reads as text, which is wrong but
/// honest) and one that is here but is really a note still reads as the note.
function imageExt(path) {
  const match = /\.([A-Za-z0-9]+)$/.exec(path || "");
  if (!match) return false;
  return IMAGE_EXTENSIONS.has(match[1].toLowerCase());
}

/// The formats a browser draws today, which is what "mainstream" means here. The route's sniffing
/// table is the authority; this set decides only which route is asked first.
const IMAGE_EXTENSIONS = new Set([
  "png", "jpg", "jpeg", "jpe", "jfif",
  "gif", "webp", "bmp", "ico", "cur",
  "tif", "tiff", "avif", "heic", "heif", "svg",
]);

/// The blob URL on screen, so the one that was there before can be let go of.
///
/// A blob URL holds its bytes until it is revoked, and the number of pictures a reader opens in a
/// session is unbounded -- so the release happens where the *next* picture replaces this one and where
/// the panel closes, rather than relying on the tab going away.
let pictureUrl = null;

function releasePicture() {
  if (pictureUrl && typeof URL !== "undefined" && URL.revokeObjectURL) URL.revokeObjectURL(pictureUrl);
  pictureUrl = null;
}

/// Draw a picture, or clear the one that is there. `url` empty means "no picture".
///
/// The note is the route's own `Content-Type` and `Content-Length` rather than the extension, for the
/// reason the route sniffs: a `.png` that is a JPEG should not be described as a PNG by the page
/// either. A type this browser cannot draw -- TIFF and HEIC are served and not always drawable -- is
/// answered by `onerror`, which says so in words and keeps the `open` control the next thing to hand.
function showPicture(url, response) {
  const holder = document.getElementById("preview-image-button");
  const image = document.getElementById("preview-image");
  const text = document.getElementById("preview-text");
  const rendered = document.getElementById("preview-md");
  const switch_ = document.getElementById("preview-render");
  const note = document.getElementById("preview-note");
  releasePicture();
  if (!image || !holder) return;
  // Either a picture is drawn or text is, never both, and the raw/rendered switch belongs to the text
  // half: a picture is drawn by the browser and there is no reading of it to switch to. Hiding it here
  // and letting `paintPreviewView` decide again is what keeps the two halves from disagreeing.
  if (rendered) rendered.hidden = true;
  if (switch_) switch_.hidden = true;
  if (!url) {
    holder.hidden = true;
    image.removeAttribute("src");
    if (text) text.hidden = false;
    return;
  }
  pictureUrl = url;
  const type = ((response && response.headers.get("Content-Type")) || "an image").split(";")[0];
  const size = Number((response && response.headers.get("Content-Length")) || 0);
  const said = type + (size ? " · " + bytesLabel(size) : "");
  image.onerror = () => {
    holder.hidden = true;
    if (text) {
      text.hidden = false;
      showPlain(text, "this browser cannot draw this " + type + " -- press open to look at it where it lives");
    }
    if (note) note.textContent = said;
  };
  image.src = url;
  holder.hidden = false;
  if (text) text.hidden = true;
  // The note is written here rather than by the caller: this is the only place that has both the
  // route's headers and the fact that the picture is on screen, and two writers would be two chances
  // to disagree about what is being looked at.
  if (note) note.textContent = said;
}

/// Read it. A refusal is the route's own sentence, shown where the file would have been: a click
/// that did nothing at all is the one answer a reader cannot act on.
///
/// Three answers to one press, decided by what the path's own name suggests and then by what the run
/// says the bytes are: a picture through `GET /image`, text through `GET /file`, and a refusal in the
/// words of whichever route answered. The order matters and is deliberate -- the picture is tried
/// *first* for a name that looks like one, and its refusal is **not** shown: `/file` is asked instead,
/// because a `.png` that is really a note should read as the note rather than fail twice.
async function readPreview() {
  const text = document.getElementById("preview-text");
  const note = document.getElementById("preview-note");
  if (!text || !preview) return;
  showPicture(null); // whatever picture was there is not this one; its URL is let go of here
  if (!canSend) {
    text.hidden = false;
    note.textContent = "";
    showPlain(text, "this page has no flint behind it: a file is read through the run that served it");
    return;
  }
  text.hidden = false;
  showPlain(text, "reading…");
  note.textContent = "";
  if (imageExt(preview.path) && (await readPicture())) return;
  await readText();
}

/// Ask `GET /image` for the path on screen, and draw it. `false` means "not a picture this route
/// would serve" -- the caller then asks for text, which is the only other thing it could be.
async function readPicture() {
  if (!preview) return false;
  let response;
  try {
    response = await fetch(imageRoute(preview.path), { headers: authHeader() });
  } catch (e) {
    return false; // the text route reports the same failure in its own words
  }
  if (!response.ok) return false;
  let url = "";
  try {
    url = URL.createObjectURL(await response.blob());
  } catch (e) {
    return false; // no blobs (an old browser): text is the honest fallback
  }
  showPicture(url, response);
  return true;
}

/// The text half of the same press: the route's bytes as they are, or its refusal as it is.
async function readText() {
  const text = document.getElementById("preview-text");
  const note = document.getElementById("preview-note");
  if (!text || !preview) return;
  let response;
  try {
    response = await fetch(fileRoute(preview.path), { headers: authHeader() });
  } catch (e) {
    showPlain(text, "cannot read it: " + describe(e));
    return;
  }
  const body = await response.text();
  if (!response.ok) {
    paintPreviewRefusal(body, response.status);
    return;
  }
  // Which of the two views draws it, and the note that says so. The body is the same bytes either way,
  // and the view comes off the panel's own state rather than being decided again here.
  paintPreviewView(body, response, preview.view, preview.path, preview.line);
}

/// A refusal, in the route's own words.
///
/// The route says *why* -- nothing there, a directory, not text -- and that sentence is the whole
/// answer, so it is shown as it is rather than turned into a status code. A refusal is not a Markdown
/// file either, so the raw/rendered switch goes away with the reading it belonged to: offering to render
/// something that was not read would be offering a view of nothing.
function paintPreviewRefusal(body, status) {
  const text = document.getElementById("preview-text");
  const note = document.getElementById("preview-note");
  const rendered = document.getElementById("preview-md");
  const button = document.getElementById("preview-render");
  if (rendered) rendered.hidden = true;
  if (button) button.hidden = true;
  if (text) {
    text.hidden = false;
    showPlain(text, String(body == null ? "" : body).trim());
  }
  if (note) note.textContent = "HTTP " + status;
}

/// What the header says beside the path: where the line is, and how much of the file is here.
function previewNote(response, body, line) {
  const said = [];
  if (line) said.push("line " + line);
  // Two numbers, because a cut with no total is not something a reader can judge: "the first
  // 512 KB" of what?
  const cut = Number(response.headers.get("X-Flint-Cut"));
  const size = Number(response.headers.get("X-Flint-Size"));
  if (cut > 0 && size > 0) said.push("the first " + bytesLabel(cut) + " of " + bytesLabel(size));
  if (!said.length) said.push(bytesLabel(body.length));
  return said.join(" · ");
}

/// The file's own lines, each in its own box with its number in a gutter.
///
/// `\r\n` and a lone `\r` are read as one break, exactly as `markdownBlocks` reads them, because the
/// two views of one file have to agree about how many lines it has -- the rendered reading and the
/// source a `grep` hit opens are the same bytes. A trailing break *ends* the last line rather than
/// opening an empty one: a file of three lines and a newline is three lines, which is what every
/// editor says and what the number in a `grep` hit means. A file with no bytes at all has no lines,
/// and the panel shows none of them.
///
/// The number is `aria-hidden` as well as unselectable: a screen reader should read the code, and the
/// number is a place in the file rather than a word in it. The gutter's width is a class rather than a
/// style written from here -- the geometry belongs in the stylesheet, and `ch` is the one unit that
/// means "a digit" in the face this panel uses.
function showLines(pre, body) {
  while (pre.firstChild) pre.removeChild(pre.firstChild);
  const lines = String(body == null ? "" : body).replace(/\r\n?/g, "\n").split("\n");
  if (lines.length && lines[lines.length - 1] === "") lines.pop();
  const digits = String(lines.length).length;
  pre.className = digits > 3 ? "lines-" + Math.min(digits, 6) : "";
  lines.forEach((line, at) => {
    const row = el("div", "line");
    const number = el("span", "ln", String(at + 1));
    number.setAttribute("aria-hidden", "true");
    row.appendChild(number);
    row.appendChild(el("span", "code", line));
    pre.appendChild(row);
  });
}

/// A sentence where the file's lines would go: a refusal, a message, an empty panel.
///
/// The rows are removed as well as the text replaced, because the gutter belongs to a *file*: a
/// sentence with `1 2 3` down its left is a sentence pretending to be three lines of one. The class
/// goes with them, so a wide gutter left over from a long file cannot hollow out the next sentence.
function showPlain(pre, message) {
  while (pre.firstChild) pre.removeChild(pre.firstChild);
  pre.className = "";
  pre.textContent = String(message == null ? "" : message);
}

/// Put the line a `grep` hit was on at the top of the panel.
///
/// The row itself, rather than arithmetic: `(line - 1) * line-height` is right only for a file whose
/// lines are all one visual line tall, and the moment a line above the target wrapped, the panel
/// scrolled to the wrong place -- which is the one thing this owes the reader, who is otherwise
/// comparing the number at the top of the panel against the one in the transcript. The arithmetic
/// stays as the fallback for a panel with no rows to measure, which is the Node harness and a browser
/// before the first paint.
function scrollToLine(text, line) {
  if (!line) return;
  const rows = text && text.children ? text.children : [];
  const row = rows[line - 1];
  if (row && typeof row.offsetTop === "number" && typeof text.offsetTop === "number") {
    text.scrollTop = Math.max(0, row.offsetTop - text.offsetTop);
    return;
  }
  if (typeof getComputedStyle !== "function") return;
  const height = parseFloat(getComputedStyle(text).lineHeight);
  const step = isNaN(height) ? 20 : height;
  text.scrollTop = Math.max(0, (line - 1) * step);
}

/// Whether a path's own name says Markdown.
///
/// By name, like the picture route, and for the same honest reason: the page has the bytes, but a
/// `.md` that is really a log should read as a log -- and the switch is one press away in both
/// directions, so a wrong guess costs a press rather than a wrong reading.
function isMarkdown(path) {
  return /\.(md|markdown|mdown|mkd|mdx)$/i.test(String(path || ""));
}

/// The top-level syntax this renderer knows, and nothing else.
///
/// Deliberately block-level only: headings, fenced code, lists (nested), blockquotes, thematic breaks,
/// pipe tables and paragraphs. **Inline syntax is not parsed** -- `**bold**` and a backtick come out as
/// written -- and that is a decision recorded in `docs/web-mode.md` §20 rather than an omission: the
/// half of Markdown that is structure is the half that makes a file readable, the half that is inline is
/// where a hand-written parser starts guessing, and a reader who wants the truth presses one button for
/// the bytes. Raw HTML is not "refused" here either: the page never assigns markup, so `<script>` in a
/// file is four characters, which is a property of the whole page rather than a rule of this function.
///
/// The result is data, not nodes, so `scripts/web-view-test.js` can check the reading without a DOM.
const MD_FENCE = /^\s{0,3}(```+|~~~+)\s*(\S*)\s*$/;
const MD_HEADING = /^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/;
const MD_RULE = /^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/;
const MD_ITEM = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
const MD_QUOTE = /^\s{0,3}>\s?(.*)$/;
const MD_TABLE_DIVIDER = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;

/// Split one table row into its cells, with the pipes at either end dropped.
function tableCells(line) {
  let text = String(line).trim();
  if (text.startsWith("|")) text = text.slice(1);
  if (text.endsWith("|")) text = text.slice(0, -1);
  return text.split("|").map((cell) => cell.trim());
}

/// The alignment a divider cell asks for, which is the one thing a table's second line says.
function tableAlign(cell) {
  const text = String(cell).trim();
  const left = text.startsWith(":");
  const right = text.endsWith(":");
  if (left && right) return "center";
  if (right) return "right";
  if (left) return "left";
  return "";
}

/// Whether two list markers are the *same kind*, so a numbered list inside a bulleted one is a new
/// list rather than more items.
const orderedMarker = (marker) => /\d/.test(String(marker));

/// Read a Markdown document into blocks. Lines in, blocks out, no DOM.
///
/// A block is one of: `{kind:"heading", level, text}`, `{kind:"code", info, lines}`,
/// `{kind:"list", ordered, items:[{text, children}]}`, `{kind:"quote", blocks}`,
/// `{kind:"table", head, align, rows}`, `{kind:"rule"}`, `{kind:"paragraph", text}`.
///
/// Two decisions are worth keeping. Consecutive lines of a paragraph are **joined with a space**, which
/// is what Markdown does and what these files' own wrapped prose needs -- a renderer that kept the hard
/// breaks would draw every wrapped sentence of a 100-column file as a ragged column. And a block that
/// cannot be understood is a **paragraph**, never a guess: a line that looks like nothing else here
/// becomes text, which is exactly what the raw view would have shown.
function markdownBlocks(text) {
  const lines = String(text == null ? "" : text).replace(/\r\n?/g, "\n").split("\n");
  const blocks = [];
  let at = 0;
  while (at < lines.length) {
    const line = lines[at];
    if (!line.trim()) {
      at += 1;
      continue;
    }
    const fence = MD_FENCE.exec(line);
    if (fence) {
      const body = [];
      at += 1;
      while (at < lines.length && !MD_FENCE.exec(lines[at])) {
        body.push(lines[at]);
        at += 1;
      }
      if (at < lines.length) at += 1; // the closing fence, or the end of a file that never closed one
      blocks.push({ kind: "code", info: fence[2] || "", lines: body });
      continue;
    }
    const heading = MD_HEADING.exec(line);
    if (heading) {
      blocks.push({ kind: "heading", level: heading[1].length, text: heading[2] });
      at += 1;
      continue;
    }
    if (MD_RULE.test(line)) {
      blocks.push({ kind: "rule" });
      at += 1;
      continue;
    }
    const quoted = MD_QUOTE.exec(line);
    if (quoted) {
      const inner = [];
      while (at < lines.length) {
        const one = MD_QUOTE.exec(lines[at]);
        if (!one) break;
        inner.push(one[1]);
        at += 1;
      }
      blocks.push({ kind: "quote", blocks: markdownBlocks(inner.join("\n")) });
      continue;
    }
    const item = MD_ITEM.exec(line);
    if (item) {
      const list = markdownList(lines, at);
      blocks.push(list.block);
      at = list.next;
      continue;
    }
    if (line.includes("|") && at + 1 < lines.length && MD_TABLE_DIVIDER.test(lines[at + 1])) {
      const head = tableCells(line).map((text) => ({ text }));
      const align = tableCells(lines[at + 1]).map(tableAlign);
      const rows = [];
      at += 2;
      while (at < lines.length && lines[at].includes("|") && lines[at].trim()) {
        rows.push(tableCells(lines[at]));
        at += 1;
      }
      blocks.push({ kind: "table", head, align, rows });
      continue;
    }
    // A paragraph, and everything that continues it: a following line that is not blank and not the
    // start of another block. A `===`/`---` line under it is a setext heading, which is the one piece
    // of Markdown that is only visible *after* reading the line above.
    const body = [];
    let level = 0;
    while (at < lines.length && lines[at].trim()) {
      const next = lines[at];
      const setext = body.length && /^\s{0,3}(=+|-+)\s*$/.test(next);
      if (setext) {
        level = next.trim().startsWith("=") ? 1 : 2;
        at += 1;
        break;
      }
      if (body.length && (MD_HEADING.test(next) || MD_FENCE.test(next) || MD_QUOTE.test(next) ||
          MD_ITEM.test(next) || MD_RULE.test(next))) break;
      body.push(next.trim());
      at += 1;
    }
    if (level) blocks.push({ kind: "heading", level, text: body.join(" ") });
    else blocks.push({ kind: "paragraph", text: body.join(" ") });
  }
  return blocks;
}

/// One list, from its first item to the end of the run.
///
/// Nesting is decided by indentation and by the *kind* of marker, which is the whole of what a reader
/// can see: an indented item under a bullet is that bullet's own list, and a numbered item under a
/// bulleted one starts a new list rather than continuing it. An item's continuation lines are the
/// indented lines under it; they are re-read as blocks, so an item can hold a nested list, a fence or a
/// second paragraph without any of that being a special case here.
function markdownList(lines, at) {
  const first = MD_ITEM.exec(lines[at]);
  const base = first[1].length;
  const ordered = orderedMarker(first[2]);
  const items = [];
  while (at < lines.length) {
    const line = lines[at];
    if (!line.trim()) {
      // A blank line ends the list unless another item of the same list follows it (a "loose" list,
      // which is the same list to a reader and must not become two).
      const next = lines[at + 1] || "";
      const skip = MD_ITEM.exec(next);
      if (!skip || skip[1].length > base + 1 || orderedMarker(skip[2]) !== ordered) break;
      at += 1;
      continue;
    }
    const item = MD_ITEM.exec(line);
    if (!item || item[1].length > base + 1 || orderedMarker(item[2]) !== ordered) break;
    const indent = item[1].length;
    const body = [item[3]];
    at += 1;
    while (at < lines.length) {
      const next = lines[at];
      if (!next.trim()) {
        const after = lines[at + 1] || "";
        const more = MD_ITEM.exec(after);
        if (more && more[1].length <= indent + 1) break; // the next item, after one blank line
        if (!after.trim()) break;
        body.push("");
        at += 1;
        continue;
      }
      if (MD_ITEM.exec(next) && MD_ITEM.exec(next)[1].length <= indent + 1) break;
      const lead = /^\s*/.exec(next)[0].length;
      if (lead <= indent) break;
      body.push(next.slice(Math.min(lead, indent + 2)));
      at += 1;
    }
    const children = markdownBlocks(body.join("\n"));
    // An item whose own text is a paragraph keeps that text *on the item* and everything after it as
    // its children: an `li` with a nested list is a bullet with words and a list under it, not a bullet
    // holding an empty paragraph. The first version pushed both into `children` and lost the words.
    if (children.length > 0 && children[0].kind === "paragraph") {
      items.push({ text: children[0].text, children: children.slice(1) });
    } else {
      items.push({ text: "", children: children });
    }
  }
  return { block: { kind: "list", ordered: ordered, items: items }, next: at };
}

/// Draw blocks as nodes. Every string goes in through `textContent`; nothing here assigns markup.
function paintMarkdown(holder, blocks) {
  if (!holder) return;
  while (holder.firstChild) holder.removeChild(holder.firstChild);
  for (const block of blocks) holder.appendChild(markdownNode(block));
  return holder;
}

/// One block as one node, and a list's items as their own nodes.
function markdownNode(block) {
  if (!block) return el("p", "", "");
  if (block.kind === "heading") {
    const level = Math.min(Math.max(block.level || 1, 1), 6);
    return el("h" + level, "", block.text);
  }
  if (block.kind === "rule") {
    const rule = el("hr", "", "");
    rule.setAttribute("aria-hidden", "true");
    return rule;
  }
  if (block.kind === "code") {
    const box = el("pre", "code-block");
    if (block.info) box.appendChild(el("div", "lang", block.info));
    box.appendChild(el("code", "", (block.lines || []).join("\n")));
    return box;
  }
  if (block.kind === "quote") {
    const quote = el("blockquote", "");
    for (const inner of block.blocks || []) quote.appendChild(markdownNode(inner));
    return quote;
  }
  if (block.kind === "table") {
    const table = el("table");
    const head = el("thead");
    const headRow = el("tr");
    (block.head || []).forEach((cell, at) => {
      const node = el("th", "", cell.text);
      const align = (block.align || [])[at];
      if (align) node.setAttribute("align", align);
      headRow.appendChild(node);
    });
    head.appendChild(headRow);
    table.appendChild(head);
    const body = el("tbody");
    for (const row of block.rows || []) {
      const tr = el("tr");
      row.forEach((cell, at) => {
        const node = el("td", "", cell);
        const align = (block.align || [])[at];
        if (align) node.setAttribute("align", align);
        tr.appendChild(node);
      });
      body.appendChild(tr);
    }
    table.appendChild(body);
    return table;
  }
  if (block.kind === "list") {
    const list = el(block.ordered ? "ol" : "ul");
    for (const item of block.items || []) {
      const node = el("li", "", item.text || "");
      for (const inner of item.children || []) node.appendChild(markdownNode(inner));
      list.appendChild(node);
    }
    return list;
  }
  return el("p", "", block.text || "");
}

/// Which view a path opens in. A pure function of the two things that decide it, so the rule can be
/// checked without opening anything: a Markdown file opened **without** a line opens rendered, and
/// everything else opens raw -- a line is why the panel was opened at all, and "line 412" has no meaning
/// in a rendered view.
function previewView(path, line) {
  return isMarkdown(path) && !line ? "rendered" : "source";
}

/// Which view the panel is showing, and whether there is a choice to make.
///
/// A function of the body and of the view rather than a reader of the panel's own state, so that what it
/// draws depends only on what it was handed -- which is what lets the Node harness check both views of
/// one body without a route, a run or a browser.
function paintPreviewView(body, response, view, path, line) {
  const text = document.getElementById("preview-text");
  const rendered = document.getElementById("preview-md");
  const note = document.getElementById("preview-note");
  const button = document.getElementById("preview-render");
  const markdown = isMarkdown(path);
  const showing = view === "rendered" && markdown;
  if (text) text.hidden = showing;
  if (rendered) rendered.hidden = !showing;
  if (button) {
    button.hidden = !markdown;
    button.textContent = showing ? "source" : "rendered";
    button.title = showing
      ? "show the file's own bytes instead"
      : "read it as Markdown rather than as text";
    button.setAttribute("aria-pressed", showing ? "true" : "false");
  }
  if (showing) {
    paintMarkdown(rendered, markdownBlocks(body));
    // The mode is in the note as well as on the button, because that is the sentence a reader checks
    // when the rendering looks wrong: what is on screen is a *reading* of the file, and which reading.
    if (note) note.textContent = previewNote(response, body, 0) + " · rendered";
    return;
  }
  if (text) {
    showLines(text, body);
    scrollToLine(text, line);
  }
  if (note) note.textContent = previewNote(response, body, line);
}

// ---------------------------------------------------------------------------
// the jobs: what this run left running
// ---------------------------------------------------------------------------

/// The run's jobs as last read, and the clock that repaints the running ones.
///
/// A list rather than a document: the panel is a few rows, and the only thing that changes without
/// a new answer from the route is the elapsed time. Keeping the seconds out of the re-read is what
/// lets the page tick once a second without asking the run anything.
let listedJobs = [];
let jobsClock = null;

/// Read `GET /jobs` and draw it. Everything that changes the list calls this: the `jobs` frame, the
/// boot, and a `reset` (a run that moved conversations has not changed its jobs, but the frame was
/// the one thing the page may have missed).
async function readJobs() {
  if (!canSend) return;
  let response;
  try {
    response = await fetch("/jobs", { headers: authHeader() });
  } catch (e) {
    return; // A page that cannot read has already said so on the stream: see `setHint`.
  }
  if (!response.ok) return;
  let json = null;
  try {
    json = await response.json();
  } catch (e) {
    return; // Not JSON: nothing this page can draw, and the run's own log has the rest.
  }
  paintJobs(jobsFrom(json));
}

/// Draw the list, and start or stop the clock that keeps a running job's duration honest.
///
/// The trigger is hidden when there is nothing: an empty panel in the header would be a control
/// that opens onto nothing, and the count is the only reason to look.
///
/// The summary is *chips*, and they are counts of kinds rather than one total, because "3" cannot
/// answer the question the header is being asked. A person watching a run wants to know whether the
/// work is still moving (`2 running`), whether any of it is a **subagent** rather than a command
/// (`1 subagent`), and whether anything has already ended badly (`1 failed`) -- and a failure is
/// never folded into `done`, because the row behind the chip carries the exit code and that detail
/// is the only place a failed job is legible. DSH draws the same three facts in its session header:
/// a live count, a subagent count with its own dot, and settled rows kept visible rather than
/// tidied away.
function paintJobs(list) {
  listedJobs = list;
  const panel = document.getElementById("jobs");
  const summary = document.getElementById("jobs-summary");
  const body = document.getElementById("job-list");
  if (!panel || !summary || !body) return;
  panel.hidden = listedJobs.length === 0;
  // Removed one by one rather than with `textContent = ""`: the one-liner is what a browser wants, and
  // the stub DOM in `scripts/web-view-test.js` would leave the old chips in place -- which would make a
  // check about the counts meaningless, and did.
  while (body.firstChild) body.removeChild(body.firstChild);
  while (summary.firstChild) summary.removeChild(summary.firstChild);
  const live = listedJobs.filter(jobIsLive);
  const stopping = live.filter((job) => job.status === "stopping").length;
  const children = live.filter((job) => job.kind === "child").length;
  const settled = listedJobs.filter((job) => !jobIsLive(job));
  // `killed` counts as a failure here and not as a tidy end, which is the same reading the row's own
  // dot takes: both are a job that stopped because somebody said so.
  const failed = settled.filter((job) => job.status === "failed" || job.status === "killed").length;
  const finished = settled.length - failed;
  if (live.length) {
    const word = stopping === live.length ? "stopping" : "running";
    summary.appendChild(
      chip("live", live.length + " " + word, live.length + " background job(s) " + word)
    );
  }
  if (children) {
    summary.appendChild(
      chip("child", children + (children === 1 ? " subagent" : " subagents"),
           children + (children === 1 ? " subagent" : " subagents") + " working in a run of its own")
    );
  }
  if (failed) summary.appendChild(chip("failed", failed + " failed", failed + " ended badly; the rows have the exit codes"));
  if (finished) summary.appendChild(chip("done", finished + " done", finished + " finished"));
  if (!listedJobs.length) {
    stopJobsClock();
    return;
  }
  for (const job of listedJobs) body.appendChild(jobRow(job));
  if (listedJobs.some(jobIsLive)) startJobsClock();
  else stopJobsClock();
}

/// One row: the state dot, what kind of job it is, what it was asked, and where it is in time.
///
/// A button when the job has somewhere to read -- a child's conversation or a command's log --
/// because that is the thing a person wants next, and it opens in the same panel a path in the
/// transcript opens in (`GET /file`, §12). Nothing is drawn as pressable when it has nothing behind
/// it: a job that has not named its session yet is a row, not a button.
function jobRow(job) {
  const row = document.createElement(job.path ? "button" : "div");
  row.className = "row job " + job.status;
  if (job.path) {
    row.type = "button";
    row.title = job.path;
    row.addEventListener("click", (e) => {
      e.preventDefault();
      // The drawer covers the row it was opened from otherwise -- the same defect the workspace
      // preview had, and closing the list first is the cheaper answer than a second column.
      const panel = document.getElementById("jobs");
      if (panel) panel.open = false;
      openPreview(job.path, 0);
    });
  }
  row.appendChild(el("span", "dot"));
  row.appendChild(el("span", "kind", job.kind));
  // The row's own text: what was asked. A command's command line, or a child's prompt -- and the
  // whole of it in the tooltip, because a label cut at the width of a panel is not the question.
  const label = el("code", "label", job.label || "(a job)");
  label.title = job.label || "";
  row.appendChild(label);
  // The fact an ended job leaves behind: its exit code, in the route's own sentence. Drawn as its
  // own span rather than folded into the duration because the two answer different questions --
  // how long it took, and whether it worked -- and a row that said only "took 3s" would send a
  // person into the log to find out which.
  if (job.detail) {
    const detail = el("span", "detail", job.detail);
    detail.title = job.detail;
    row.appendChild(detail);
  }
  row.appendChild(el("span", "when", jobWhen(job, Date.now() / 1000)));
  return row;
}

/// Repaint the durations of the running rows, once a second.
///
/// Only the `when` spans: rebuilding the rows would take the focus off a row somebody is on, and the
/// list is not the thing that changed -- the clock is. Nothing is fetched: the route sends absolute
/// epoch seconds, so this arithmetic is the same one the run would do, and a page that has been open
/// for an hour is still right about a job it heard about when it opened. A closed panel is not
/// repainted at all -- there is nothing on screen to be right about -- and the open event calls this
/// once, so the rows are correct from the moment they appear.
function tickJobs() {
  const panel = document.getElementById("jobs");
  const body = document.getElementById("job-list");
  if (!panel || !panel.open || !body) return;
  const rows = body.children || [];
  const now = Date.now() / 1000;
  for (let i = 0; i < rows.length && i < listedJobs.length; i += 1) {
    // Found by class rather than by position: not every row has a detail span (a running job has
    // nothing to report yet), and an index would then write the duration into the wrong cell.
    const when = rows[i].querySelector ? rows[i].querySelector(".when") : null;
    if (when && jobIsLive(listedJobs[i])) when.textContent = jobWhen(listedJobs[i], now);
  }
}

/// The clock, which exists only while something is running: a timer that repaints settled rows
/// would be a wake-up per second for a page whose list is not changing.
function startJobsClock() {
  if (jobsClock !== null || typeof setInterval !== "function") return;
  jobsClock = setInterval(tickJobs, 1000);
}

function stopJobsClock() {
  if (jobsClock === null || typeof clearInterval !== "function") return;
  clearInterval(jobsClock);
  jobsClock = null;
}

// ---------------------------------------------------------------------------
// typing
// ---------------------------------------------------------------------------

/// Send one line to the prompt. Returns whether it was accepted.
async function sendText(text) {
  if (!canSend || !text.trim()) return false;
  try {
    const response = await fetch("/message", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, authHeader()),
      body: messageBody(text),
    });
    if (!response.ok) throw new Error("HTTP " + response.status + " " + (await response.text()).trim());
    setHint("");
    return true;
  } catch (e) {
    // Shown rather than thrown: a message that did not arrive must not look like one that did,
    // and the alternative -- appending it to the transcript anyway -- is the one way this page
    // could lie about what flint was told.
    setHint("not sent: " + e.message, true);
    return false;
  }
}

function setHint(text, bad) {
  const hint = document.getElementById("hint");
  if (!hint) return;
  hint.textContent = text || "";
  hint.className = bad ? "hint bad" : "hint";
  hint.hidden = !text;
}

/// What the composer says when there is nothing wrong.
///
/// The wording about interrupting is the terminal's own rule, said here because the page gives
/// no other sign of it: a line sent while the model is working does not queue, it steers.
function idleHint() {
  // The composer is a prompt, not just a message box: everything the terminal accepts works
  // here, because what the page sends is text and the REPL decides what text means. Nothing on
  // the page said so, so the one thing a person tries -- `/new` -- looked unavailable.
  const base = "Enter sends · Shift+Enter is a newline · /help lists the commands";
  return doc.status ? base + " · sending now interrupts the turn" : base;
}

function sizeComposer() {
  const box = document.getElementById("message");
  if (!box) return;
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, Math.round(window.innerHeight * 0.3)) + "px";
}


function load(whole) {
  const fresh = newDoc();
  // Into a *fresh* document, where the two guards in `applyEvent`'s `chat` arm have nothing to
  // find -- there is no stream-drawn block to duplicate -- so "from the file" is exactly right.
  applyText(fresh, whole, true);
  doc.meta = fresh.meta;
  doc.title = fresh.title;
  doc.usage = fresh.usage;
  doc.blocks = fresh.blocks;
  // A whole document, not a delta: every node the page was holding belongs to the document
  // that has just been replaced, so none of them may be reused. Without this the incremental
  // paint would compare revisions across two different documents and keep stale nodes --
  // which is the one way this optimisation can be *wrong* rather than merely slow.
  painted = [];
  // The transcript's *content*, not the scroll container: the container spans the pane so that
  // its scrollbar sits at the window's edge, and the reading width is capped inside it.
  document.getElementById("doc").textContent = "";
  doc.rev = fresh.rev;
  paint(doc);
  document.getElementById("drop").hidden = true;
}

/// The token, as every request after the first one sends it.
function authHeader() {
  return { "X-Flint-Token": tokenFromSearch(location.search) };
}

/// The highest cursor this page has applied. Everything at or below it is already on screen.
///
/// A *position in the session file* -- the length of the file as of the last frame applied --
/// and not a count of frames. That is what makes it worth sending back: the same number means
/// the same place to any process serving that file, where a frame count only ever meant
/// something to the process that minted it. See `Live::follow` in `src/web.rs`.
let applied = 0;

/// Where this page was reading, kept where a reload can find it.
///
/// `sessionStorage` and deliberately not the origin-wide store beside it: this pair is about *this
/// tab's* reading of a conversation, a second tab has no business reading it, and `sessionStorage`
/// survives exactly the reload this is for. The token is the thing that must never be stored --
/// `docs/web-mode.md` section 4.2 is why -- and the policy test beside this file forbids that other
/// store outright, so that a later convenience cannot quietly put a credential somewhere every
/// document on the loopback origin can read.
///
/// Best-effort by design: a browser that refuses storage (private mode) or never fires `pagehide`
/// loses the pair, and a missing pair costs a message and nothing else.
const SEEN_KEY = "flint.seen";

function remembered() {
  try {
    return JSON.parse(sessionStorage.getItem(SEEN_KEY) || "null");
  } catch (e) {
    return null;
  }
}

function remember(id, at) {
  if (!id) return;
  try {
    sessionStorage.setItem(SEEN_KEY, JSON.stringify({ id: id, at: at }));
  } catch (e) {
    // Nothing to do about it, and nothing that depends on it: see above.
  }
}

/// What to say about the last time this tab was reading this conversation.
///
/// Three cases, and the item that asked for this (`ROADMAP.md` section 11 item 8) wanted the third
/// decided before any code existed. A *different* conversation is not a loss, so the pair is simply
/// replaced and nothing is said. A **smaller** position means the difference arrived while this page
/// was closed, which is said, because nothing in flint changes silently. A position **past the end**
/// of the file is a stale read -- the file this pair was taken from is not this file any more, which
/// a hand edit or a replaced session makes reachable -- and that is a fact to report rather than an
/// error to throw, so the page shows the conversation from the file and says the position did not fit.
///
/// A reload always rebuilds: the DOM is not persisted and the file is the record, so there is no
/// path here that draws only the tail. What the pair buys is knowing what was missed.
function notePosition(before, cursor, id) {
  if (!before || !before.id || !id || before.id !== id) return;
  const at = Number(before.at);
  if (!Number.isFinite(at) || at <= 0) return;
  if (at > cursor) {
    setHint(
      "this conversation is " + cursor + " bytes and this page had read to " + at +
        ": the file it was reading is not this one, so it is shown from the start",
      true
    );
    return;
  }
  if (at < cursor) {
    setHint("rebuilt from the file; " + (cursor - at) + " bytes arrived while this page was closed");
  }
}

/// The position this tab has *drawn to*, written where the next load can find it.
///
/// On `pagehide` rather than as frames arrive: the pair is only ever read by a later load, and
/// `applied` at that moment is the answer to "where had this page got to", including a turn that was
/// still streaming. `pagehide` is the event that also fires when the tab goes into the back/forward
/// cache, which `unload` does not.
window.addEventListener("pagehide", () => {
  remember(doc.meta && doc.meta.id, applied);
});

/// Re-read the conversation from the process, and take its cursor.
///
/// Called once when the page starts, and again on a `reset` -- when the run moved to another
/// conversation, or this connection fell so far behind that the frames in between are gone. It
/// is deliberately *not* called on every reconnect any more: that rebuilt the document for a
/// two-second outage, which threw away where the reader was and any answer still streaming.
/// What a reconnect is missing now arrives on the stream itself.
async function readSession() {
  const response = await fetch("/session", { headers: authHeader() });
  if (!response.ok) throw new Error("HTTP " + response.status);
