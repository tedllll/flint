<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flint — a session</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  One file, no build step, no external request. This is the renderer for a flint
  conversation at three levels, and it is deliberately the same file at all of them:

    L1  drop a ~/.flint/sessions/*.jsonl on it
    L2  fed by `flint --web` over GET /session and GET /events
    L3  ...and POST /message, which is the same document again

  Two rules hold it together.

  Nothing from the model goes in as markup. Tool output is attacker-influenced text --
  a file's contents, a program's stderr, a fetched page -- so every piece of it is set
  through textContent, and there is no Markdown renderer. A renderer is a parser, a
  parser is a dependency, and one that emits HTML is a script-injection hole in a
  program that can run commands.

  It understands two vocabularies, because it is fed by two sources. A session file is
  one *message* per line (`meta`, `chat`, `usage`, `title`); the NDJSON stream that
  `flint -p --json` writes and `--web` relays is one *event* per line. Note that `usage`
  is a type in both with different shapes, which is the kind of thing that is only
  obvious once it is written down.

  An unknown type is skipped in silence, and a known type that will not parse is shown
  as damage -- the same two rules the session format asks of any reader.
-->
<style>
  :root {
    --bg: #14161a;
    --fg: #d6dae0;
    --dim: #8b939f;
    --line: #262a31;
    --user: #7aa2f7;
    --ok: #86c88a;
    --bad: #e5837c;
    --warn: #d9b06a;
    --panel: #1b1e24;
  }
  * { box-sizing: border-box; }
  /* The scrollbars are the one part of the page the browser draws instead of us, and Windows
     draws a light slab with arrow buttons in the middle of a dark panel. It is the first thing
     noticed in a real session, and the transcript's bar is on screen whenever an answer is
     taller than the window -- which is the normal case, not the exception. Chromium and Firefox
     need different properties to say the same thing, and the colours are the page's own tokens
     so the bar follows the theme rather than fighting it. The thumb is inset with a transparent
     border and `background-clip` rather than made narrower, because the hover rule changes only
     the colour -- a shorthand there would reset the clip and the bar would jump wider. */
  * {
    scrollbar-width: thin;                    /* Firefox */
    scrollbar-color: var(--line) transparent; /* Firefox */
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background-color: var(--line);
    border: 2px solid transparent;
    background-clip: content-box;
    border-radius: 5px;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--dim); }
  ::-webkit-scrollbar-corner { background: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  header {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 10px 18px 8px;
  }
  h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  /* The run's own settings, as controls. Quiet by default and hidden until a `state` frame
     arrives: a page opened from a dropped file has no process behind it, and a picker with no
     options is a promise the page cannot keep. A picker with *one* option is disabled rather
     than hidden -- it still says what is in force, which is the half that matters. */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 5px; }
  .controls[hidden] { display: none; }
  .controls select {
    font: inherit; font-size: 12.5px; color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; max-width: 26ch;
  }
  .controls select:hover:enabled { border-color: var(--user); }
  .controls select:disabled { color: var(--dim); cursor: default; }
  /* An action: no value to choose, just the command's own line to send. Styled with the selects so
     the header reads as one row of controls rather than two kinds of thing. */
  .controls button {
    font: inherit; font-size: 12.5px; color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; cursor: pointer;
  }
  .controls button:hover { border-color: var(--user); }
  /* The toggles, drawn from the frame rather than written here: each is a label, the command's
     own name, and a select of the values that command takes. */
  .toggle { display: inline-flex; align-items: baseline; gap: 5px; }
  .toggle-name { color: var(--dim); font-size: 12.5px; }
  /* The command panel: a reference the page keeps to itself, collapsed until it is asked for. It
     is the one thing on this page that is not the conversation, so it does not take a row of the
     transcript -- and the terminal is where somebody typed `/help`, which is the whole reason §8
     keeps a report off this page's wire. */
  .panel { margin: 0 0 5px; font-size: 12.5px; }
  .panel[hidden] { display: none; }
  .panel summary { color: var(--dim); cursor: pointer; width: fit-content; }
  /* The list scrolls inside itself, and that bound is the point rather than a tidy-up: this is the
     one thing in the header that grows without bound (one row per command the run offers), and with
     it open on a pane 800px tall the header took 742 of them, the reading was left 54px, and the
     composer was pushed under it -- `elementFromPoint` at the send button's own centre answered
     `main#transcript`, so the button could not be clicked at all. Measured in a real browser; see
     `docs/web-mode.md` §11. A reference list must never be able to push the conversation, or the
     controls for it, off the screen. */
  .panel[open] .body { margin: 6px 0 0; max-height: 40vh; overflow-y: auto; }
  .panel .body { margin: 6px 0 0; }
  .panel .group-name { color: var(--dim); font-size: 12px; margin: 6px 0 2px; }
  .panel .row { display: flex; gap: 8px; align-items: baseline; }
  .panel .row code { color: var(--fg); white-space: nowrap; }
  .panel .row span { color: var(--dim); }
  /* A row this page has no control for: still a row, dimmed right down, because it is a fact about
     the run rather than something to press. The hover says where its control is. */
  .panel .row.reference code, .panel .row.reference span { color: var(--dim); opacity: .75; }
  .panel .row.reference { cursor: help; }
  /* A job's row: the shape of every other row, with the three things a list of running work needs --
     a state dot, the kind, and a duration in figures that do not jitter as they tick. `nowrap` on the
     label because the interesting end of "write me a summary of src/web.rs" is the end, and `title`
     carries the whole of it. */
  #jobs .row.job { gap: 7px; }
  #jobs .row.job .dot {
    flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%;
    background: var(--dim); align-self: center;
  }
  #jobs .row.job.running .dot { background: var(--warn); }
  /* On its way out rather than working: the same dot, dimmed, because the state is the run's own
     decision taking effect and not a failure -- a person who has just asked for a stop is looking at
     this row to see the ask land. */
  #jobs .row.job.stopping .dot { background: var(--warn); opacity: .45; }
  #jobs .row.job.completed .dot { background: var(--ok); }
  #jobs .row.job.failed .dot, #jobs .row.job.killed .dot { background: var(--bad); }
  #jobs .row.job .kind {
    flex: 0 0 auto; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--dim);
  }
  #jobs .row.job code.label {
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  }
  /* The ending, when there is one: short, dim, and allowed to shrink before the label does -- the
     label is what tells two rows apart, and an exit code cut off would be the fact this list
     exists for. */
  #jobs .row.job .detail {
    flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12px; color: var(--dim);
  }
  #jobs .row.job.failed .detail, #jobs .row.job.killed .detail { color: var(--bad); }
  #jobs .row.job .when {
    flex: 0 0 auto; font-size: 12px; color: var(--dim);
    /* Tabular figures: a duration that changes width every second drags the column beside it. */
    font-variant-numeric: tabular-nums;
  }
  /* A row that can be read: the same shape as the rows above, made pressable. Reset to look like
     them rather than like a control, because the panel is a list of what the terminal takes and a
     row of chrome would make one command look different from the others. */
  .panel button.row {
    font: inherit; text-align: left; width: 100%; background: none; border: 0; padding: 0;
    color: inherit; cursor: pointer;
  }
  .panel button.row:hover code, .panel button.row:hover span { color: var(--user); }
  /* A row that destroys something: the same shape, coloured so that the press that sends is
     unmistakably not the press that opens the choices. */
  .panel button.row.danger:hover code, .panel button.row.danger:hover span { color: var(--bad); }
  /* The reading itself: one listing, and the way back to the list. `pre-wrap` because these
     listings are the terminal's own text, aligned with spaces. */
  .panel .back {
    font: inherit; font-size: 12px; color: var(--dim); background: none; border: 0; padding: 0;
    cursor: pointer;
  }
  .panel .back:hover { color: var(--user); }
  /* A row that takes a field: a form row is still a row, so the input sits where the description
     would and the button says which command it sends -- the row's own `send`, never a word the page
     made up. */
  .panel form.field { display: flex; gap: 8px; align-items: baseline; }
  .panel form.field input.value {
    font: inherit; flex: 1 1 auto; min-width: 0; color: var(--fg); background: none;
    border: 0; border-bottom: 1px solid var(--dim); padding: 0 0 1px;
  }
  .panel form.field input.value:focus { outline: none; border-bottom-color: var(--user); }
  .panel form.field button.send {
    font: inherit; color: var(--dim); background: none; border: 0; padding: 0; cursor: pointer;
    white-space: nowrap;
  }
  .panel form.field button.send:hover { color: var(--user); }
  .panel .reading { white-space: pre-wrap; margin: 4px 0 0; }
  .meta { color: var(--dim); font-size: 12.5px; word-break: break-all; }
  .meta span { margin-right: 14px; white-space: nowrap; }
  /* Two columns: the conversations on the left, this one on the right. A grid rather than
     floats or flex, because the sidebar has to be a fixed width and the transcript has to be
     the rest -- and `minmax(0, 1fr)` is what stops a long unbroken line in the transcript from
     widening the column and pushing the sidebar off screen. */
  /* Rows as well as columns, and the status line is the second row rather than a fixed bar.
     Measured: with `position: fixed` it sat *on top of* the composer and the hint under it, so
     the last two lines of the page were unreadable exactly while a turn was running -- which is
     when the status line is showing. A grid row cannot overlap anything. */
  .app {
    display: grid;
    /* Three columns: the conversations, the hand that resizes them, and the transcript. The
       width is a variable so that hand can move it, and `min(var(--side), 60vw)` is what stops
       a widened sidebar from eating the transcript on a narrow window -- a clamp in CSS rather
       than a listener on every resize. The 5px column is the grab area: a hairline seam is a
       pixel hunt, and the sidebar's own border is still the line you see.
       The fourth column is the file preview, and it is a column rather than a panel floating over
       the reading: measured in a browser, a fixed panel covered the very block the path was pressed
       in, so the second path in a turn could not be pressed at all without closing the first. A
       column narrows the transcript instead, which is what DSH's own preview does. */
    grid-template-columns: min(var(--side, 250px), 60vw) 5px minmax(0, 1fr) auto;
    grid-template-rows: minmax(0, 1fr) auto;
    height: 100vh;
  }
  .app.plain { grid-template-columns: minmax(0, 1fr) auto; }
  /* The grip has no visible width of its own, only a highlight on hover so that it is
     discoverable at all, and the resize cursor. Every cursor on the page becomes that one
     while a drag is running: the pointer is captured, so the moves keep arriving here while
     the cursor itself travels over the transcript, and without this the page flickers between
     two cursors for the whole drag. */
  #grip, #read-grip { cursor: col-resize; }
  #grip:hover, #read-grip:hover, body.dragging #grip, body.dragging #read-grip {
    background-color: var(--user);
  }
  body.dragging { user-select: none; }
  body.dragging * { cursor: col-resize !important; }
  /* The reading-width hand, which is placed against the text's right edge rather than against a
     column of the layout, and is clamped inside the pane for the window too narrow to hold the
     width it is asking for. It carries a hairline at rest -- asked for after the fact: at the right
     edge of the text there is no seam to notice, so unlike the list's hand it had nothing to be
     discovered by, and a control nobody can see is a control nobody uses. The line is `--line`,
     the same colour as the borders, so it reads as part of the page rather than as a hint. */
  #read-grip {
    position: absolute; top: 0; bottom: 0; width: 5px;
    left: min(calc(var(--pad-x) + var(--read, 110ch)), calc(100% - 5px));
    background-image: linear-gradient(var(--line), var(--line));
    background-size: 1px 100%;
    background-position: center;
    background-repeat: no-repeat;
  }
  #read-grip:hover { background-image: none; }
  .app.plain #grip, .app.plain #read-grip { display: none; }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; min-height: 0; padding: 12px 0 14px;
  }
  .side-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    color: var(--dim); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
    padding: 0 14px 8px;
  }
  #new-conversation {
    font: inherit; text-transform: none; letter-spacing: 0;
    color: var(--user); background: none; border: 1px solid var(--line); border-radius: 5px;
    padding: 2px 7px; cursor: pointer;
  }
  #new-conversation:hover { border-color: var(--user); }
  #new-conversation:disabled { color: var(--dim); border-color: var(--line); cursor: default; }
  #sessions { list-style: none; margin: 0; padding: 0; }
  /* One row per conversation, and the label ellipsised rather than wrapped: a list of
     conversations is for telling apart at a glance, and a row that wraps to two lines makes
     the list half as long for no more information. The flex row with `min-width: 0` on the
     label is what lets the ellipsis happen at all -- a flex item refuses to shrink below its
     content otherwise, which is how the first version pushed the label onto its own line. */
  #sessions li {
    display: flex; align-items: baseline; gap: 7px;
    padding: 6px 14px; cursor: pointer; border-left: 2px solid transparent;
    font-size: 13.5px; line-height: 1.4;
    /* The menu below hangs off the row rather than off the list: it belongs to one conversation,
       and `position: absolute` inside a `relative` row is what keeps it there while the sidebar
       scrolls. */
    position: relative;
  }
  #sessions li:hover { background: var(--bg); }
  #sessions li.current { border-left-color: var(--user); background: var(--bg); }
  #sessions li .n {
    flex: 0 0 auto; min-width: 13px; text-align: right;
    color: var(--dim); font-size: 12px;
  }
  #sessions li .label {
    flex: 1 1 auto; min-width: 0; color: var(--fg);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #sessions li.current .label { color: var(--user); }
  /* A conversation's own actions. Dim until the row is pointed at -- including by keyboard, hence
     `:focus`, or the button would be unreachable without a mouse -- because the list is for telling
     conversations apart, and a control on every row competes with that. */
  #sessions li .more {
    flex: 0 0 auto; font: inherit; font-size: 15px; line-height: 1;
    color: var(--dim); background: none; border: 0; padding: 0 2px; cursor: pointer; opacity: 0;
  }
  #sessions li:hover .more, #sessions li .more:focus { opacity: 1; color: var(--user); }
  /* The second level: one row per action the frame offers, each one the line it will send. */
  #sessions li .menu {
    position: absolute; right: 8px; top: 100%; z-index: 5; min-width: 150px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
  }
  #sessions li .menu button.row {
    display: flex; justify-content: space-between; gap: 10px;
    font: inherit; text-align: left; width: 100%; background: none; border: 0; padding: 0;
    color: inherit; cursor: pointer;
  }
  #sessions li .menu button.row:hover code, #sessions li .menu button.row:hover span { color: var(--bad); }
  #sessions li .menu .row { color: var(--dim); font-size: 12.5px; }
  /* The rename field inside the menu: the same shape as the panel's forms -- a row that takes an
     answer is still a row -- at the size of the list it hangs off rather than the size of the panel.
     It is drawn here rather than in the panel because the conversation it names is the one this row
     is, and the field starts on that name. */
  #sessions li .menu form.field { display: flex; gap: 6px; align-items: baseline; margin-top: 4px; }
  #sessions li .menu form.field input.value {
    font: inherit; font-size: 12.5px; flex: 1 1 auto; min-width: 0; color: var(--fg);
    background: none; border: 0; border-bottom: 1px solid var(--dim); padding: 0 0 1px;
  }
  #sessions li .menu form.field input.value:focus { outline: none; border-bottom-color: var(--user); }
  #sessions li .menu form.field button.send {
    font: inherit; font-size: 12.5px; color: var(--dim); background: none; border: 0; padding: 0;
    cursor: pointer; white-space: nowrap;
  }
  #sessions li .menu form.field button.send:hover { color: var(--user); }
  #sessions .none, #sessions .waiting { color: var(--dim); cursor: default; padding: 7px 14px; }
  /* `position: relative` and `--pad-x` are for the reading-width hand below: the hand is placed
     against the pane's own edge, and the padding is a variable because three things need the same
     number -- the transcript's padding, the hand's position, and the arithmetic in the drag. */
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; --pad-x: 18px; }
  /* The transcript's own box: `main` scrolls inside it, and the reading hand is as tall as this
     rather than as tall as the pane. The wrapper is what the hand is positioned against. */
  .reading { position: relative; flex: 1; min-height: 0; display: flex; }
  /* The scroll container is the whole pane, and the *reading* width is capped inside it. The cap
     used to be on this element, which left the transcript's scrollbar sitting in the middle of a
     wide window with a dead strip of background to its right: a scrollbar belongs at the edge of
     what you are scrolling, and what you are scrolling is the window. */
  main { padding: 14px var(--pad-x) 40px; flex: 1; overflow-y: auto; }
  #doc { max-width: var(--read, 110ch); }
  /* The composer is a row rather than a fixed element: it sits under the transcript, so a
     scrollbar belongs to the transcript and not to the whole window.
     Positioned without a `z-index`, and the reason is paint order rather than layout: the reading
     is `position: relative` (the hand inside it is positioned against it), so it paints in the
     positioned layer and a *static* composer would paint in the in-flow layer below it -- wherever
     the two overlap, the reading wins. That is not hypothetical: with the command panel open the
     header grew until they overlapped, and the send button could not be clicked (see the note on
     `.panel[open] .body`). `position: relative` with no offsets changes nothing about the layout and
     puts this back in tree order, which decides in the composer's favour because it comes later.
     Deliberately not a `z-index`: a number here would be a number to escalate against the sidebar's
     own menu, and tree order is already the answer. */
  #composer {
    position: relative;
    border-top: 1px solid var(--line); background: var(--bg);
    display: flex; gap: 8px; align-items: flex-end; padding: 10px 18px;
  }
  #message {
    flex: 1; resize: none; font: inherit; color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
    max-height: 30vh; min-height: 34px; overflow-y: auto;
  }
  #message:focus { outline: none; border-color: var(--user); }
  #send {
    font: inherit; color: var(--bg); background: var(--user); border: 0;
    border-radius: 6px; padding: 7px 14px; cursor: pointer;
  }
  #send:disabled { background: var(--line); color: var(--dim); cursor: default; }
  /* The stop button, which exists only while a turn does. Quiet rather than coloured: the thing to
     press in a hurry is still `send`, and this one is for the turn that is going wrong. */
  #stop {
    font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 14px; cursor: pointer;
  }
  #stop[hidden] { display: none; }
  .hint { color: var(--dim); font-size: 12px; padding: 0 18px 8px; }
  .hint.bad { color: var(--bad); }
  .drop {
    border: 1px dashed var(--line); border-radius: 8px;
    padding: 28px 18px; margin: 14px 18px; color: var(--dim); text-align: center;
  }
  .drop.over { border-color: var(--user); color: var(--fg); }
  .drop button {
    font: inherit; color: var(--user); background: none; border: 0;
    padding: 0; cursor: pointer; text-decoration: underline;
  }
  .turn { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; }
  .turn:first-child { border-top: 0; margin-top: 0; }
  .who { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .user .body { color: var(--user); }
.command .body { color: var(--dim); }
  .body { white-space: pre-wrap; word-wrap: break-word; margin: 2px 0 0; }
  .reasoning { color: var(--dim); font-style: italic; }
  details {
    border: 1px solid var(--line); border-radius: 6px;
    margin: 8px 0; background: var(--panel);
  }
  summary {
    cursor: pointer; padding: 6px 10px; color: var(--dim); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  summary .name { color: var(--fg); }
  summary .bad { color: var(--bad); }
  summary .ok { color: var(--ok); }
  details[open] > summary { border-bottom: 1px solid var(--line); }
  details > pre {
    margin: 0; padding: 10px; overflow-x: auto; white-space: pre-wrap;
    word-wrap: break-word; font-size: 13px; max-height: 60vh; overflow-y: auto;
  }
  .notice { color: var(--warn); font-size: 13.5px; margin: 8px 0; }
  .notice.error { color: var(--bad); }
  .notice.damage { color: var(--bad); border-left: 2px solid var(--bad); padding-left: 8px; }
  /* A path in a tool block: a button that opens the file, drawn as text so the block still reads
     like the terminal's line rather than like a page full of chrome. The dotted underline is the
     only sign it is pressable -- discovered by hovering, which is what a reader does with a path
     they want to look at. */
  button.path {
    font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0;
    cursor: pointer; text-align: inherit;
    border-bottom: 1px dotted var(--dim);
  }
  button.path:hover, button.path:focus { color: var(--user); border-bottom-color: var(--user); }
  /* An address on the web: the one thing on this page that is a link, because it is the one thing
     with somewhere to go. A path is a button instead (`button.path`), since a file has no address a
     browser may open from a page served over http. Dotted like a path so that the two read as the
     same kind of thing -- something to press -- and it solidifies under the pointer. */
  a.link {
    color: var(--user); text-decoration: underline; text-decoration-style: dotted;
    text-underline-offset: 2px;
  }
  a.link:hover, a.link:focus { text-decoration-style: solid; }
  /* The file, opened beside the conversation. A column of the layout, not a panel over it -- see
     the grid above for the measurement that settled it -- and deliberately not resizable: it has one
     width, and the reader closes it rather than negotiating with it. DSH's page opens a file
     reference in a document preview beside the conversation; this is that idea with none of the
     machinery: no tabs, no renderer registry, one route and this panel. */
  #preview {
    grid-column: 4; grid-row: 1;
    width: min(720px, 45vw);
    display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-left: 1px solid var(--line);
  }
  .app.plain #preview { grid-column: 2; }
  #preview[hidden] { display: none; }
  .preview-head {
    display: flex; gap: 10px; align-items: baseline;
    padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px;
  }
  /* The directories dim and the file's own name in full ink, which is the half a reader is
     looking for. The directories are the part that gives way when the path is wider than the row;
     `title` on the row carries the whole thing. */
  #preview-path { display: flex; min-width: 0; flex: 1 1 auto; }
  #preview-path .dirs { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #preview-path .name { color: var(--fg); white-space: nowrap; }
  #preview-note { color: var(--dim); white-space: nowrap; flex: 0 0 auto; }
  .preview-head button {
    font: inherit; font-size: 12.5px; color: var(--dim); background: none; border: 0; padding: 0;
    cursor: pointer; flex: 0 0 auto;
  }
  .preview-head button:hover { color: var(--user); }
  #preview-text {
    flex: 1 1 auto; margin: 0; padding: 10px 12px; overflow: auto;
    white-space: pre-wrap; word-wrap: break-word; font-size: 13px;
  }
  #status {
    grid-column: 1 / -1;
    background: var(--panel); border-top: 1px solid var(--line);
    color: var(--dim); font-size: 13px; padding: 6px 18px;
  }
  #status[hidden] { display: none; }
  #status b { color: var(--fg); font-weight: 600; }
  .empty { color: var(--dim); }
</style>
</head>
<body>
<!-- The sidebar is hidden unless a running flint served this page: a dropped file has no list
     of conversations to switch between, and showing an empty one would be a promise the page
     cannot keep. -->
<div class="app plain" id="app">
  <aside id="sidebar" hidden>
    <div class="side-head">
      <span>conversations</span>
      <!-- The one thing the sidebar could not do. Switching between conversations was here and
           making one was not, so the page could only ever show conversations that already
           existed. It sends `/new` like everything else the page sends: the terminal's own
           command, not a second implementation of starting a conversation. -->
      <button id="new-conversation" type="button" title="start a new conversation">+ new</button>
    </div>
    <ul id="sessions"><li class="waiting">reading the list…</li></ul>
  </aside>
  <!-- The hand between the two columns. Its own grid column rather than a strip positioned
       over the seam: positioned, it would paint under the transcript and its hit area would
       travel with the pointer instead of staying put. Reachable by keyboard as well, because
       dragging is not the only way to want the list wider. -->
  <div id="grip" role="separator" aria-orientation="vertical" tabindex="0" title="drag to resize"
       aria-label="resize the conversation list" aria-valuemin="160" aria-valuemax="900"></div>
  <div class="pane">
    <header>
      <h1 id="title">flint</h1>
      <!-- The run's configuration, as the controls that change it. Drawn from the `state` frame,
           which is the only read channel the page has: it may not read `config.toml` itself --
           a second reader of the same state can disagree with the process, and the file says one
           thing while a run does another whenever `--readonly` or `/readonly` is involved. -->
      <div class="controls" id="controls" hidden>
        <select id="pick-provider" title="the provider this run is using"></select>
        <select id="pick-model" title="the model this run is using"></select>
        <!-- Where the switches go, drawn from the frame: see `showToggles`. -->
        <span id="toggles"></span>
        <!-- Where the actions go -- one button each, no argument to ask for: see `showActions`. -->
        <span id="actions"></span>
      </div>
      <!-- The commands the run offers, drawn from the frame as well: see `showCommands`. A panel
           rather than a button each, because most of them are reports -- the page shows the listing
           instead of sending `/sessions` and printing it into the terminal, where nobody asked for
           it. Collapsed until somebody opens it, since it is a reference and not the conversation.
      -->
      <details class="panel" id="commands" hidden>
        <summary>commands</summary>
        <div class="body" id="command-list"></div>
      </details>
      <!-- The run's background work -- the `task` children and the background commands this process
           started -- drawn from `GET /jobs`. Hidden until there is one: a run that has started
           nothing has nothing to show, and a control that says "0" is a control nobody presses.
           DSH's page has the same thing in its session header; this is that row, read off the same
           `Job` records `job_op` answers from rather than from a second bookkeeping of its own. -->
      <details class="panel" id="jobs" hidden>
        <summary id="jobs-summary">jobs</summary>
        <div class="body" id="job-list"></div>
      </details>
      <div class="meta" id="meta"></div>
    </header>

<div class="drop" id="drop">
  Drop a session <code>.jsonl</code> here — or
  <button id="pick" type="button">choose one</button>.
  <input type="file" id="file" accept=".jsonl,.json,application/jsonl,text/plain" hidden>
</div>

    <!-- The transcript and its reading hand share a box, so the hand is as tall as the text rather
         than as tall as the pane: spanning the pane ran the hairline down through the composer,
         which is a different thing at the bottom of the screen with its own edges. -->
    <div class="reading">
      <main id="transcript"><div id="doc"><p class="empty">Nothing loaded yet.</p></div></main>
      <!-- The hand for the reading width. Positioned rather than a grid column, because it follows
           a variable inside this box instead of a column of the layout, and it spans the box so it
           can be grabbed anywhere down the text's right edge. -->
      <div id="read-grip" role="separator" aria-orientation="vertical" tabindex="0"
           title="drag to change the reading width" aria-label="reading width"
           aria-valuemin="320" aria-valuemax="1200"></div>
    </div>
    <!-- Typing goes through the same channel the keyboard does, so a slash command works from
         here too -- `/resume 3` below is that and nothing more. Enter sends, Shift+Enter is a
         newline, because a pasted block is a message the same way it is in the terminal. -->
    <form id="composer" hidden>
      <textarea id="message" rows="1" placeholder="say something to flint"></textarea>
      <!-- The interrupt, as the one word that means it. It is to the *left* of `send` on purpose:
           a control that appears under the pointer that was reaching for another one turns a steer
           into a stop, and sending a line while the model works is steering by design. -->
      <button id="stop" type="button" title="stop the turn that is running" hidden>stop</button>
      <button id="send" type="submit">send</button>
    </form>
    <div class="hint" id="hint" hidden></div>
  </div>
  <!-- The second grid row: the terminal's status strip, in the same place the terminal puts it,
       and out of the composer's way. -->
  <div id="status" hidden></div>

  <!-- A file a tool block named, opened beside the conversation. Its own column of the grid rather
       than a panel over the reading, and drawn here -- inside the app -- so that is true by
       construction. Hidden until a path is pressed; the column it would occupy is gone while it is
       hidden, because a `display: none` grid item takes no cell. -->
  <aside id="preview" hidden>
    <div class="preview-head">
      <span id="preview-path"></span>
      <span id="preview-note"></span>
      <button id="preview-open" type="button" title="open it where it lives">open</button>
      <button id="preview-reload" type="button" title="read it again">reload</button>
      <button id="preview-close" type="button" title="close (Esc)">close</button>
    </div>
    <pre id="preview-text"></pre>
  </aside>
</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// The model: lines in, a document out. No DOM here, on purpose.
//
// `scripts/web-view-test.js` runs exactly this half under Node, because a viewer whose
// only test is "the file contains no markup assignment" is a viewer nobody has run. Keeping
// the two vocabularies apart from the painting is what makes that possible.
// ---------------------------------------------------------------------------

// Both vocabularies at once. A type in here that will not parse is damage; a type that is
// not in here belongs to another build and is skipped in silence.
const KNOWN = new Set([
  // A session file: ~/.flint/sessions/<id>.jsonl
  "meta", "chat", "usage", "title",
  // The NDJSON stream: `flint -p --json`, relayed by `--web`
  "session.started", "turn.started", "message.delta", "reasoning.delta",
  "message.completed", "tool.started", "tool.args", "tool.completed",
  "warning", "turn.completed", "error", "status",
  // Not a turn's event: what a command answered. It is on this stream because the transcript is
  // built from it, and an answer typed into the composer belongs in the transcript (ROADMAP §8).
  "command",
]);

function newDoc() {
  return {
    meta: {}, title: "", usage: null, status: "", running: false, blocks: [], rev: 0,
    // The run's own configuration, as the last `state` frame described it (`null` until one
    // arrives, which is also how a page opened from a file knows it has no process behind it).
    // Kept on the document rather than in the DOM so that `load` -- a whole new document from
    // the session file -- carries it over: the conversation changed, the configuration did not.
    state: null,
    // Which listing the panel is showing, and what the process last said about it.
    //
    // Not carried over a `load`, unlike `state`, and the difference is the point: a *reading* is a
    // window onto the run at a moment, and a new document is a different moment. The list comes
    // back with the next state frame, which is one press away.
    reading: null,
    readingText: "",
    // The destructive row whose choices are open, and nothing else: see `showCommands`. Not carried
    // over a `load` either, and for a stronger reason than `reading` -- a choice list that survived
    // the document it was opened in would be a delete button aimed at whatever number is next.
    confirm: null,
    // The conversation whose own menu is open, named by id. Not carried over a `load`, for the same
    // reason as `confirm` and one more: the `n` in it is a position in the sidebar, and a menu that
    // survived into a new document would be a delete button aimed at whatever is at that position.
    menu: null,
  };
}

/// Note that a block changed, so the next paint redraws it and only it.
///
/// This exists because of a measurement, and the measurement is worth keeping. The transcript
/// used to be rebuilt from scratch on every frame -- `root.textContent = ""` and then every
/// block again -- which is quadratic in the size of the answer. Measured against a stub
/// provider: about 85 KB/s of answer painted while the transcript was small, about 17 KB/s once
/// it passed a megabyte. And a page that cannot keep up is a page that is eventually told
/// `reset` and loses what it was showing, which is what the megabyte run did at fifteen
/// seconds: 1,424,691 characters on screen, then 64,999.
///
/// It also cost three things that are not about speed, because a rebuilt node is a *new* node:
/// the scroll position, which `details` were expanded, and any selected text all went with it.
/// This page exists to be the better renderer for reading a run, and "you cannot select the
/// answer" is not a promise a full repaint can keep.
function touched(doc, block) {
  block.rev = ++doc.rev;
  return block;
}

function push(doc, block) {
  doc.blocks.push(touched(doc, block));
  return block;
}

// The assistant message the deltas are currently arriving into, if any.
function currentAnswer(doc) {
  const last = doc.blocks[doc.blocks.length - 1];
  return last && last.kind === "assistant" && last.open ? last : null;
}

/// The answer a turn is streaming into right now, if one is.
///
/// Kept because a `reset` mid-turn is *destructive* without it. `/session` is the file, and the
/// file gets the assistant message when the turn **ends** -- so re-reading it during a turn
/// returns a document that does not contain the answer being written. Measured against a stub
/// provider: 1,424,691 characters on screen became 64,999. The reader watches the answer
/// disappear and start again.
function streamingAnswer(from) {
  const source = from || doc;
  const last = source.blocks[source.blocks.length - 1];
  if (!last || last.kind !== "assistant") return null;
  return { text: last.text || "", reasoning: last.reasoning || "" };
}

/// Put that answer back after the document has been re-read.
///
/// Deliberately additive and never blind: the block is only reused when what the file holds is
/// a *prefix* of what was on screen, because that is the case where the file is simply behind.
/// Anything else means the file has moved on -- the turn ended and wrote its own copy -- and
/// adding the memory of it would duplicate the answer rather than rescue it.
function carryStreaming(into, kept) {
  if (!kept || !kept.text) return;
  const last = into.blocks[into.blocks.length - 1];
  if (last && last.kind === "assistant" && kept.text.startsWith(last.text || "")) {
    last.text = kept.text;
    if (!last.reasoning) last.reasoning = kept.reasoning;
    // Still arriving: the block has to keep taking deltas, or the rest of the answer would
    // start a second block and the turn would read as two.
    last.open = true;
    touched(into, last);
    return;
  }
  if (last && last.kind === "assistant") return;
  push(into, { kind: "assistant", text: kept.text, reasoning: kept.reasoning, open: true });
}

/// Put the answer-so-far into the block that is streaming, making it if there is not one.
///
/// `open: true` is what makes the deltas that follow append to this block rather than start a
/// second one, and the turn would read as two answers without it.
function setStreamingAnswer(into, text) {
  if (!text) return;
  let answer = into.blocks[into.blocks.length - 1];
  if (!answer || answer.kind !== "assistant") {
    answer = push(into, { kind: "assistant", text: "", reasoning: "", open: true });
  }
  answer.text = text;
  answer.open = true;
  touched(into, answer);
}

function toolById(doc, id) {
  for (let i = doc.blocks.length - 1; i >= 0; i--) {
    if (doc.blocks[i].kind === "tool" && doc.blocks[i].id === id) return doc.blocks[i];
  }
  return null;
}

function text(value) {
  return typeof value === "string" ? value : "";
}

/// One already-parsed event object. Returns nothing; the document is mutated.
function applyEvent(doc, ev, fromFile) {
  switch (ev.type) {
    // ---- a session file -----------------------------------------------------
    case "meta":
      doc.meta = { id: ev.id, created: ev.created, cwd: ev.cwd, provider: ev.provider, model: ev.model };
      return;

    case "title":
      doc.title = text(ev.name);           // the last title in the file is the one in force
      return;

    case "chat": {
      const m = ev.message;
      if (!m || typeof m.role !== "string") {
        push(doc, { kind: "damage", text: "a chat line with no message role" });
        return;
      }
      if (m.role === "system") {
        push(doc, { kind: "system", text: text(m.content) });
      } else if (m.role === "user") {
        // The stream draws a question from `turn.started`; the file draws it from its own
        // `chat` line. A page that drew the first and is then sent the second -- which is what
        // catching up out of the file does -- would show the same question twice, so the file's
        // copy of a question already at the end of the document is not drawn again. Only the
        // last one: a person asking the same thing twice is two questions, and they are not
        // adjacent in the file either.
        const last = doc.blocks[doc.blocks.length - 1];
        if (fromFile && last && last.kind === "user" && last.text === text(m.content)) return;
        push(doc, { kind: "user", text: text(m.content) });
      } else if (m.role === "assistant") {
        // The other half of the same problem, and the same answer with the opposite sign: a
        // block built from deltas is an *unfinished* copy of the message the file kept, so the
        // file's line fills it in rather than opening a second one beside it. `carryStreaming`
        // protects the same thing in the other direction -- it will not re-add an answer the
        // file has already written.
        const open = fromFile ? currentAnswer(doc) : null;
        if (open) {
          open.text = text(m.content);
          open.reasoning = text(m.reasoning);
          open.open = false;
          touched(doc, open);
        } else if (text(m.content) || text(m.reasoning)) {
          push(doc, { kind: "assistant", text: text(m.content), reasoning: text(m.reasoning), open: false });
        }
        // The calls are placed where they were asked for; the results arrive later as
        // their own `tool` messages and are matched back by id, so the file order is the
        // reading order.
        for (const call of m.tool_calls || []) {
          push(doc, {
            kind: "tool", id: call && call.id, name: callName(call),
            args: callArgs(call), output: "", ok: true, done: false,
          });
        }
      } else if (m.role === "tool") {
        const slot = toolById(doc, m.tool_call_id);
        if (slot) {
          slot.output = text(m.content);
          slot.done = true;
          touched(doc, slot);
        } else {
          // A trimmed file, or a result whose call was dropped. Showing it is better than
          // losing it: the format explicitly allows hand-editing.
          push(doc, {
            kind: "tool", id: m.tool_call_id, name: "(unmatched result)",
            args: "", output: text(m.content), ok: true, done: true,
          });
        }
      } else {
        push(doc, { kind: "damage", text: "a chat line with an unknown role: " + m.role });
      }
      return;
    }

    // ---- the NDJSON stream --------------------------------------------------
    case "session.started":
      doc.meta = { id: ev.session, cwd: ev.cwd, model: ev.model };
      return;

    case "turn.started": {
      // A turn is in flight, which is the whole of what the stop button is offered for. The page
      // reads this rather than the status line, because the status line also carries feed trouble,
      // and a stop button that appears because the connection dropped stops nothing.
      doc.running = true;
      // A click that stopped the last turn disabled the button to keep one click from sending two
      // stops. This is a new turn, and that guard must not outlive the turn it was made in.
      const stop = document.getElementById("stop");
      if (stop) stop.disabled = false;
      push(doc, { kind: "user", text: text(ev.prompt) });
      return;
    }

    // Both delta kinds open a block if there is not one, and both refuse to open one for a
    // piece with nothing in it. A delta that says nothing is not the start of an answer, and
    // opening a block for it left a blank "flint" heading that no text ever arrived to fill --
    // seen on a page reloaded while a turn was waiting on the model.
    case "message.delta": {
      const piece = text(ev.text);
      let answer = currentAnswer(doc);
      if (!answer) {
        if (!piece) return;
        answer = push(doc, { kind: "assistant", text: "", reasoning: "", open: true });
      }
      answer.text += piece;
      touched(doc, answer);
      return;
    }

    case "reasoning.delta": {
      const piece = text(ev.text);
      let answer = currentAnswer(doc);
      if (!answer) {
        if (!piece) return;
        answer = push(doc, { kind: "assistant", text: "", reasoning: "", open: true });
      }
      answer.reasoning += piece;
      touched(doc, answer);
      return;
    }

    case "message.completed": {
      const answer = currentAnswer(doc);
      if (answer) {
        // Only a block the deltas never filled is given this text, and the reason is
        // worth stating: `message.completed` carries the whole *turn* -- every round
        // concatenated, because the sink accumulates across a turn -- while the deltas
        // arrive round by round. Writing it into the last block would pull the first
        // round's narration down past the tool calls that happened in between, and the
        // transcript would no longer say what happened in what order.
        if (!answer.text) answer.text = text(ev.text);
        answer.open = false;
        touched(doc, answer);
      } else if (text(ev.text)) {
        push(doc, { kind: "assistant", text: text(ev.text), reasoning: "", open: false });
      }
      return;
    }

    case "tool.started":
      push(doc, {
        kind: "tool", id: ev.id, name: text(ev.name), args: "",
        output: "", ok: true, done: false,
      });
      return;

    case "tool.args": {
      const slot = toolById(doc, ev.id);
      if (slot) {
        slot.args = text(ev.arguments);
        if (text(ev.name)) slot.name = text(ev.name);
      } else {
        push(doc, {
          kind: "tool", id: ev.id, name: text(ev.name), args: text(ev.arguments),
          output: "", ok: true, done: false,
        });
      }
      return;
    }

    case "tool.completed": {
      const slot = toolById(doc, ev.id);
      if (slot) {
        slot.output = text(ev.output);
        slot.ok = ev.ok !== false;
        slot.done = true;
        touched(doc, slot);
      } else {
        push(doc, {
          kind: "tool", id: ev.id, name: text(ev.name), args: "",
          output: text(ev.output), ok: ev.ok !== false, done: true,
        });
      }
      return;
    }

    case "status":
      doc.status = text(ev.text);
      return;

    case "turn.completed":
      // The server sends this at the end of every turn, including one that was interrupted --
      // which is the case it exists for here: an interrupted turn never produces
      // `message.completed`, so without this the half answer stayed open for good and the stop
      // button stayed on screen.
      doc.running = false;
      doc.status = "";
      for (const b of doc.blocks) if (b.kind === "assistant") b.open = false;
      return;

    // `usage` is a type in both vocabularies and the numbers sit in different places:
    // a session file wraps them (`{"type":"usage","usage":{...}}`) and the stream does
    // not. Reading whichever is there costs one line and is the whole reason this is
    // commented rather than clever.
    case "usage":
      doc.usage = ev.usage && typeof ev.usage === "object" ? ev.usage : ev;
      return;

    case "warning":
      push(doc, { kind: "notice", level: "warning", text: text(ev.message) });
      return;

    case "command":
      // A report the page asked for: it belongs in the panel, not in the transcript (ROADMAP §8).
      // Taken only when it is the answer to what is *being* read, so a reader who moved on to
      // another listing does not get the old one appearing under the new one's name.
      if (ev.panel === true) {
        const input = text(ev.input);
        if (doc.reading === input) {
          doc.readingText = text(ev.text);
          showCommands(doc);
        }
        return;
      }
      // What a command answered. A block rather than a notice because the answer can be a
      // listing -- `/config`, `/tools`, `/help` are a dozen lines each -- and because the input
      // is half of what a reader needs: a `/model` in the transcript with no answer under it is
      // a question, and one with an answer and no question is a mystery.
      push(doc, { kind: "command", input: text(ev.input), text: text(ev.text) });
      return;

    case "error":
      push(doc, { kind: "notice", level: "error", text: text(ev.message) });
      return;

    default:
      return;   // another build's event: skipped in silence, by the format's own rule
  }
}

function callName(call) {
  return call && call.function && typeof call.function.name === "string" ? call.function.name : "";
}

// The arguments are a *string* on the wire -- that is how providers stream them -- so they
// are shown as one rather than re-serialised. Deliberately not reduced to a per-tool
// summary: `display.rs` in the terminal owns that decision, and a second implementation
// here would disagree with it about which argument names the call.
function callArgs(call) {
  return call && call.function && typeof call.function.arguments === "string" ? call.function.arguments : "";
}

/// Parse one line into the document. Returns nothing: damage becomes a block, not a throw.
///
/// `fromFile` says where the line came from, and it is not bookkeeping: the same moment reaches
/// this page twice -- once as the stream's own event and once as the session file's entry --
/// and the two are drawn differently. See the `chat` arm.
function applyLine(doc, line, fromFile) {
  const trimmed = line.trim();
  if (!trimmed) return;
  let ev;
  try {
    ev = JSON.parse(trimmed);
  } catch (e) {
    push(doc, { kind: "damage", text: "a line that is not JSON: " + clip(trimmed, 200) });
    return;
  }
  if (!ev || typeof ev.type !== "string") {
    push(doc, { kind: "damage", text: "a line with no type: " + clip(trimmed, 200) });
    return;
  }
  applyEvent(doc, ev, fromFile);
}

/// A whole file, or a whole stream: one object per line, and never anything else.
function applyText(doc, whole, fromFile) {
  for (const line of whole.split("\n")) applyLine(doc, line, fromFile);
  return doc;
}

function clip(s, n) {
  return s.length > n ? s.slice(0, n) + "…" : s;
}

/// The pieces of a string that are an address -- a web address or a path -- and the text between.
///
/// A pure splitter, so the rules this page has about addresses can be tested under Node without a
/// DOM. It is deliberately dumb, and the whole of it is written down here rather than left to a
/// regex nobody reads again:
///
///   * a candidate is a run of characters with no whitespace, quote, bracket, brace, angle
///     bracket, comma, semicolon or backtick in it -- so JSON arguments and English sentences
///     both come apart in the right places;
///   * a candidate that begins with one of the two web schemes is a **web address**, and nothing
///     else about it is judged here: `asUrl` decides that, and it decides it by allowlist;
///   * otherwise it is a path if it is **absolute** (`/…`, `./…`, `../…`, `~…`, `C:\…`), or its
///     last segment has an extension of two to eight characters, or it has three or more segments.
///     One separator and no extension is left as text on purpose: `and/or`, `read/write`,
///     `pass/fail` and `24/7` all look like `src/bin` from here, and this page cannot tell them
///     apart without asking the disk;
///   * a one-character "extension" is prose, not a file: `e.g.` and `i.e.` are the reason, and
///     `foo.c` is the price -- it stays text;
///   * a `//` in it means it is not a path at all -- the candidate that reaches here with one is a
///     URL that failed `asUrl`, so it stays text;
///   * trailing `.` and `:` are punctuation rather than part of a name, and a trailing `:N` or
///     `:N:C` is the line a `grep` hit was found on: it comes back as `line` rather than as part
///     of the path, so the preview can open where the hit was.
///
/// `absoluteOnly` is the narrower rule prose is read with, and the reason is the bullets above:
/// in a sentence, `src/bin`, `and/or` and `e.g.` are words, while `/etc/hosts` and `C:\work\x` are
/// not. Tool output keeps the wider rule -- a relative path in a tool result is what the tool
/// meant. The web-address half is the same in both: a URL in a sentence is still a URL.
function addressParts(text, absoluteOnly) {
  const parts = [];
  let last = 0;
  const candidates = String(text).matchAll(/[^\s"'`()\[\]{}<>,;]+/g);
  for (const match of candidates) {
    const found = asUrl(match[0]) || asPath(match[0], absoluteOnly);
    if (!found) continue;
    if (match.index > last) parts.push({ text: text.slice(last, match.index) });
    parts.push(found);
    last = match.index + match[0].length;
  }
  if (last < text.length) parts.push({ text: text.slice(last) });
  return parts;
}

/// One candidate token as a web address, or `null`.
///
/// The scheme is the whole test, and it is an **allowlist** rather than a blocklist of the schemes
/// that are dangerous. This document holds the run's token, and the text it renders is written by a
/// model, so an `href` taken from that text is a way to run script here: `javascript:` needs no
/// bug, no parser and no click beyond the one the reader was going to make anyway. The two schemes
/// that mean "a page" pass; `javascript`, `data`, `file` and a bare `www.` with no scheme at all
/// stay the words they are.
///
/// A trailing `.` or `:` is the sentence's punctuation rather than part of the address -- the other
/// trailing punctuation never reaches here, because the splitter cuts on it. The host is part of the
/// test as well: the scheme on its own is not an address, and neither is a scheme followed by
/// nothing but slashes.
function asUrl(token) {
  const text = token.replace(/[.:]+$/, "");
  if (!/^https?:\/\/[^\s/]+/i.test(text)) return null;
  return { url: text };
}

/// One candidate token as a path, or `null` when it is a word that merely looks like one.
///
/// With `absoluteOnly` -- which is how prose is read -- a relative name is a word: see
/// `addressParts` for why the two rules differ.
function asPath(token, absoluteOnly) {
  let path = token.replace(/[.:]+$/, "");
  let line = 0;
  const numbered = /^(.*?):(\d+)(?::\d+)?$/.exec(path);
  if (numbered) {
    path = numbered[1];
    line = Number(numbered[2]);
  }
  if (path.length < 3 || path.indexOf("//") !== -1) return null;
  const segments = path.split(/[\\/]+/);
  const name = segments[segments.length - 1];
  const absolute = /^([\\/]|~[\\/]|[A-Za-z]:[\\/])/.test(path);
  if (absoluteOnly && !absolute) return null;
  // `4/2`, `2024/09` and `1/2/3` are ratios and dates as often as they are directories, and a
  // numeric segment in every position after the first is the shape they share. The check is only
  // made when there *is* a position after the first: `Cargo.toml` is one segment, and `every` on
  // an empty list is true -- which is how this rule first swallowed every bare filename.
  const tail = segments.slice(1);
  if (tail.length && tail.every((s) => /^\d+$/.test(s))) return null;
  if (!absolute && !/\.([A-Za-z0-9]{2,8})$/.test(name) && segments.length < 3) return null;
  return { path: path, line: line };
}

/// A byte count in the words the route uses for the same number, so the panel's note and the
/// route's own sentence do not disagree about how to say it.
function bytesLabel(n) {
  const units = [["GB", 1024 * 1024 * 1024], ["MB", 1024 * 1024], ["KB", 1024]];
  for (const [unit, size] of units) {
    if (n >= size) return Math.round(n / size) + " " + unit;
  }
  return n + " bytes";
}

/// The run's jobs, as `GET /jobs` answers them, sorted the way the panel draws them.
///
/// Pure, and deliberately dumb about what a job *is*: it reads the route's fields, keeps the ones
/// the rows need, and drops anything that is not a job. The order is the run's own -- running
/// first, newest first -- and it is *kept* rather than re-sorted here, because two lists that
/// sorted by different rules would show the same jobs in two orders and neither would be wrong.
function jobsFrom(json) {
  const listed = json && Array.isArray(json.jobs) ? json.jobs : [];
  const shown = [];
  for (const job of listed) {
    if (!job || typeof job.pid !== "number") continue;
    shown.push({
      pid: job.pid,
      kind: job.kind === "command" ? "command" : "child",
      label: typeof job.label === "string" ? job.label : "",
      status: typeof job.status === "string" ? job.status : "running",
      detail: typeof job.detail === "string" ? job.detail : "",
      started: Number(job.started_secs) || 0,
      ended: Number(job.ended_secs) || 0,
      path: typeof job.path === "string" ? job.path : "",
    });
  }
  return shown;
}

/// How long a job ran, or has been running, in the words a person reads.
///
/// `now` is handed in rather than read from the clock, so the ticking display and the test that
/// checks it agree about what "three minutes" means without either of them waiting.
function durationLabel(secs) {
  const s = Math.max(0, Math.floor(secs));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s";
  return Math.floor(s / 3600) + "h " + String(Math.floor((s % 3600) / 60)).padStart(2, "0") + "m";
}

/// The one line beside a job's row: where it is, or what it ended with.
///
/// `Running for` and `Took` rather than a bare number, because the two are different facts: one is
/// a clock still going and the other is a duration that has stopped. DSH's job list says the same
/// two words, which is where this came from.
function jobWhen(job, nowSecs) {
  if (job.status === "running") {
    return job.started ? "running for " + durationLabel(nowSecs - job.started) : "running";
  }
  const took = job.started && job.ended ? durationLabel(job.ended - job.started) : "";
  return took ? "took " + took : job.status;
}

/// Whether a job is still going, which is the only thing that makes the page tick.
function jobIsLive(job) {
  return job.status === "running";
}

/// The token, out of the URL that `--web` printed.
///
/// It travels in the query string of the one route a person pastes into a browser --
/// there is nowhere else to put it, and a page that cannot authenticate itself cannot
/// fetch anything. From here on it is sent as a header instead, because a query string
/// ends up in history, in logs and in any link that gets shared, and a header does not.
function tokenFromSearch(search) {
  const match = /[?&]token=([0-9A-Za-z_-]+)/.exec(search || "");
  return match ? match[1] : "";
}

/// The sidebar's items, out of what `GET /sessions` returned.
///
/// Pure and tested in Node, because the two things that can go wrong here are both silent: a
/// number that is not the one `/resume` accepts, and a list that is rendered as if it were
/// empty. Anything unexpected becomes an empty list rather than a throw -- the sidebar is not
/// worth taking the page down for, and the transcript beside it is still readable.
function sessionsFrom(text) {
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    return [];
  }
  const list = parsed && parsed.sessions;
  if (!Array.isArray(list)) return [];
  return list
    .filter((s) => s && typeof s.n === "number" && typeof s.id === "string")
    .map((s) => ({
      n: s.n,
      id: s.id,
      label: typeof s.label === "string" && s.label ? s.label : "(empty)",
      current: s.current === true,
    }));
}

/// One `<select>`: the options a setting can take, and the one it is on.
///
/// The value is set *after* the options, and the current one is added to the list when the frame
/// does not mention it -- a provider's `model` field is offered by `/model` whether or not it is
/// repeated in `models`, so a picker built from `models` alone would sit on whichever option came
/// first and then *send* it the moment anything else on the page was touched. A select whose value
/// is not among its options keeps the first one, silently: that is a control that lies about the
/// run, which is the whole class of bug this page's controls exist to avoid.
function fillSelect(select, options, current) {
  if (!select) return;
  const wanted = current === undefined || current === null ? "" : String(current);
  const named = options.map(String).filter((name) => name !== "");
  if (wanted && !named.includes(wanted)) named.unshift(wanted);
  // Options are removed one by one rather than with `textContent = ""`: the one-liner is what a
  // browser wants, and this also has to work under the stub DOM in `scripts/web-view-test.js`,
  // where it would leave the old options in place and make every assertion here meaningless.
  while (select.firstChild) select.removeChild(select.firstChild);
  for (const name of named) {
    const option = el("option", "", name);
    option.value = name;
    option.selected = name === wanted;
    select.appendChild(option);
  }
  select.value = wanted;
  // A control with one choice is not a choice. Disabled rather than hidden, because it still has
  // something to say: which one is in force.
  select.disabled = named.length < 2;
}

/// The toggles the run reports, as one switch each: a name, and the values that name takes.
///
/// Built from the frame rather than written into this page, and that is the difference between a
/// switch that tells the truth and one that lies. `/verbose` takes `off`, `on` and `full` today;
/// a page carrying its own copy of that list offers a word the command may refuse, and a page
/// deciding for itself what "on" means shows a run that is not the one in front of it. The frame
/// says the name, the values and the value in force, and the switch sends `/<name> <value>` --
/// the terminal's own command, composed the same way every other control here composes one.
///
/// Rebuilt when a state frame arrives, which is only when something has actually changed: a
/// `<select>` rebuilt on every paint would close under whoever was choosing from it.
function showToggles(doc) {
  const box = document.getElementById("toggles");
  if (!box) return;
  while (box.firstChild) box.removeChild(box.firstChild);
  const toggles = doc.state && Array.isArray(doc.state.toggles) ? doc.state.toggles : [];
  for (const toggle of toggles) {
    if (!toggle || typeof toggle.name !== "string") continue;
    const select = el("select", "");
    fillSelect(select, toggle.values || [], toggle.value);
    select.addEventListener("change", async (e) => {
      if (!(await sendText("/" + toggle.name + " " + e.target.value))) showState(doc);
    });
    const label = el("label", "toggle");
    label.appendChild(el("span", "toggle-name", toggle.name));
    label.appendChild(select);
    box.appendChild(label);
  }
}

/// The commands the run offers, one group per class §8 names.
///
/// The list is the frame's, whole. `label` is what `/help` prints, `send` is what would go on the
/// wire, and `class` is which group it belongs to -- and, in the rounds that follow, what kind of
/// control it gets. None of them is a control yet, and that is on purpose: a report is shown rather
/// than sent, and a button that sends a command this page has not been taught to confirm would be a
/// button that destroys a conversation on one click.
///
/// The group order is this page's own, because it is a reading order -- what you ask, what you do,
/// what you choose, what you type into, what destroys something -- and a frame's order is whatever
/// the table happens to be in.
const COMMAND_GROUPS = [
  ["panel", "reports"],
  ["button", "actions"],
  ["selector", "selectors"],
  ["form", "forms"],
  ["danger", "destructive"],
];

/// Where the control for a command the panel cannot press actually is, per class.
///
/// The panel lists every command -- a list with holes in it teaches nothing -- and this page only
/// draws a control where the frame said how to supply the argument. So the rest are rows of
/// reference, and the first person to use the panel asked why some rows press and others do not. The
/// answer is here, on hover, where the question is asked: the words are this page's own, because
/// where *this* page put its buttons and pickers is its own business, while which commands exist is
/// the process's.
///
/// `toggles` is absent on purpose: those rows are not in the frame at all (their value is already a
/// field of it), so no row can ever ask for a home. See `OnPage::Toggles`. A `selector` that carries
/// `values` never reaches here either -- it is a control, and this entry is for the one selector whose
/// list lives somewhere else on the page (`/resume`'s, which is the sidebar).
const COMMAND_HOMES = {
  button: "a button in the header",
  selector: "a conversation on the left",
  form: "typed in the terminal -- it asks questions",
};
const COMMAND_HOME_FALLBACK = "typed in the terminal";

/// The panel, in one of its two modes: the commands, or one report being read.
///
/// The list is drawn from the frame and never assembled here, so a row cannot offer a command the
/// terminal does not take. The report rows are pressable, and what a press does is ask the process
/// for that listing on `/report` -- the route that keeps the answer off the terminal, where the
/// reader did not ask for it (ROADMAP §8). A row that carries `values` is drawn once per value, which
/// is how a read that takes an argument (`/skills <name>`) gets a control without the page ever
/// knowing what the command is called. A row the frame marks with a `field` gets an input instead,
/// and what its button sends is the row's `send` plus what was typed -- the same composition again,
/// and the input's `type` comes from the frame, so a credential is masked because the process said
/// it was one.
///
/// One surface rather than a `<details>` per row, and that is a decision rather than a shortcut: a
/// panel here is a window onto the run, and what it shows is one thing at a time. Nothing is cached
/// either. A listing kept from a moment ago would be a second copy of a fact the process owns, and
/// asking again is both cheaper and *truer* -- `/config` after an edit, `/skills` after a change, and
/// the reader sees what is in force now.
function showCommands(doc) {
  const panel = document.getElementById("commands");
  const list = document.getElementById("command-list");
  if (!panel || !list) return;
  while (list.firstChild) list.removeChild(list.firstChild);
  const commands = doc.state && Array.isArray(doc.state.commands) ? doc.state.commands : [];
  // Hidden when there is nothing to show, the way the switches are: a page opened from a dropped
  // file has no process behind it, and an empty panel is a promise this page cannot keep.
  panel.hidden = commands.length === 0;
  if (doc.reading) {
    // A listing being read, which replaces the list until the reader goes back. The name comes from
    // what was asked for rather than from the answer's own first line, so the heading is the same
    // whether the process has answered yet or not.
    const back = el("button", "back", "\u2039 commands");
    back.type = "button";
    back.addEventListener("click", () => {
      doc.reading = null;
      showCommands(doc);
    });
    list.appendChild(back);
    list.appendChild(el("div", "row", doc.reading));
    list.appendChild(el("div", "reading", doc.readingText || "reading\u2026"));
    return;
  }
  for (const [className, heading] of COMMAND_GROUPS) {
    const rows = commands.filter(
      (command) => command && command.class === className && typeof command.label === "string"
    );
    if (rows.length === 0) continue;
    const group = el("div", "group");
    group.appendChild(el("div", "group-name", heading));
    for (const command of rows) {
      const send = typeof command.send === "string" ? command.send : "";
      const help = typeof command.help === "string" ? command.help : "";
      // Which lines this row offers. A report is read here rather than sent: `doc.reading` is the
      // toggle between the two modes, and the row only has to name the line to ask for. Anything
      // else is a row of reference -- the class decides which, and it comes from the frame.
      //
      // A row that carries `values` offers one line per value as well, and the page composes it as
      // `<send> <value>` from the frame's own two strings -- exactly what a toggle does with
      // `/<name> <value>`. It is the frame that says which values may be asked for, so the page
      // cannot name one that was not offered; the process refuses the rest. The row's own line is
      // kept next to them because it is a command in its own right: `/skills` is the catalog, and
      // `/skills <name>` is one entry in it.
      // A row the frame says takes answers gets one input each. It is a *form*, not a report: the
      // answers go on `/message` with the rest of what a person sends, because a form changes
      // something and its answer belongs in the transcript where the change is. Each answer's
      // `field` is the input's `type`, so the page is told how to draw it rather than deciding from
      // the command's name that a key is a secret -- and a masked input is emptied the moment it is
      // sent, so the value exists in the input, on the wire, and in the config file it was for, and
      // nowhere else.
      const fields = Array.isArray(command.fields) ? command.fields : [];
      if (fields.length > 0) {
        const form = el("form", "field");
        const inputs = fields.map((spec) => {
          // An answer the frame says comes from a list is a picker, not a field: a pid typed into a
          // text box would be prose, and a message that quietly went to whoever the sentence named is
          // worse than one that reached everybody here.
          if (spec && spec.from === "peers") return peerPicker();
          const input = el("input", "value");
          input.type = spec && spec.field === "password" ? "password" : "text";
          // One answer says what the command is for; several have to say which answer each wants,
          // because there is no room to explain three of them one at a time.
          input.placeholder =
            fields.length === 1 ? help : ((spec && spec.name) || "") + (spec && spec.optional ? " (optional)" : "");
          return input;
        });
        const submit = el("button", "send", send);
        submit.type = "submit";
        form.addEventListener("submit", (event) => {
          if (event && typeof event.preventDefault === "function") event.preventDefault();
          const line = formLine(send, fields, inputs.map((input) => input.value));
          // Nothing at all is sent when an answer the frame did not mark optional is missing. That is
          // not politeness: the bare command is a different thing -- `/provider add` with no arguments
          // is the wizard, which asks a person one question at a time, and a run being served to a
          // page has nobody at the terminal to answer it.
          if (!line) return;
          inputs.forEach((input, at) => {
            if (fields[at] && fields[at].field === "password") input.value = "";
          });
          sendText(line);
        });
        for (const input of inputs) form.appendChild(input);
        form.appendChild(submit);
        group.appendChild(form);
        continue;
      }
      // A destructive row is the one class where a single press could destroy work, so it takes two
      // deliberate presses and the second one is a row that prints the line it will send. The first
      // press opens the choices, taken from the list the frame named -- which the page already
      // holds: the sidebar's own numbers, the provider names from the state frame, or the pids in
      // the jobs panel it is looking at -- and the second sends `send + " " + value`, the same
      // composition as everywhere else. `doc.confirm` is that state, and it is only the row: nothing
      // has been sent while it is open, so there is no countdown to get wrong and nothing to disarm
      // on a timer.
      //
      // A job's candidates are only the *live* ones: a job that has ended cannot be stopped, and
      // offering it would be a choice whose only outcome is the sentence saying so.
      const choices =
        command.from === "sessions"
          ? sessions.map((s) => ({ value: String(s.n), label: s.label }))
          : command.from === "providers"
            ? ((doc.state && Array.isArray(doc.state.providers) ? doc.state.providers : [])
                .filter((p) => p && typeof p.name === "string")
                .map((p) => ({ value: p.name, label: p.name })))
            : command.from === "jobs"
              ? listedJobs
                  .filter((job) => jobIsLive(job))
                  .map((job) => ({ value: String(job.pid), label: job.kind + " " + job.label }))
              : null;
      if (className === "danger" && choices) {
        if (doc.confirm && doc.confirm.send === send) {
          const back = el("button", "back", "\u2039 commands");
          back.type = "button";
          back.addEventListener("click", () => {
            doc.confirm = null;
            showCommands(doc);
          });
          group.appendChild(back);
          for (const choice of choices) {
            const row = el("button", "row danger");
            row.type = "button";
            row.title = help;
            row.addEventListener("click", () => {
              // The second press: the row says the line, and the line is what goes.
              doc.confirm = null;
              sendText(send + " " + choice.value);
            });
            row.appendChild(el("code", "", send + " " + choice.value));
            row.appendChild(el("span", "", choice.label));
            group.appendChild(row);
          }
          if (choices.length === 0) group.appendChild(el("div", "row", "nothing to choose from"));
        } else {
          const row = el("button", "row danger");
          row.type = "button";
          row.title = help;
          row.addEventListener("click", () => {
            doc.confirm = { send: send };
            showCommands(doc);
          });
          row.appendChild(el("code", "", command.label));
          row.appendChild(el("span", "", help));
          group.appendChild(row);
        }
        continue;
      }
      const values = Array.isArray(command.values)
        ? command.values.filter((value) => typeof value === "string" && value.trim())
        : [];
      const offered = [];
      if (className === "panel" && send) offered.push({ label: command.label, line: send });
      for (const value of values) offered.push({ label: send + " " + value, line: send + " " + value });
      if (offered.length === 0) {
        // Nothing this page can send: a row of reference, marked and dimmed so that it cannot be
        // mistaken for the control it is not, and carrying the one thing it can usefully say --
        // where that control is (see `COMMAND_HOMES`). It used to be drawn to look exactly like a
        // pressable row, on the theory that no command should look different from the others. That
        // reads well and does not work: the first person to use the panel asked why some rows press
        // and others do not, which is a puzzle rather than a list.
        const row = el("div", "row reference");
        row.title = "this one is " + (COMMAND_HOMES[className] || COMMAND_HOME_FALLBACK);
        row.appendChild(el("code", "", command.label));
        row.appendChild(el("span", "", help));
        group.appendChild(row);
        continue;
      }
      for (const item of offered) {
        const row = el("button", "row");
        row.type = "button";
        row.title = help;
        row.addEventListener("click", () => {
          // A value on a *report* row is a read, and its answer belongs in the panel. A value on any
          // other row is a line this page types for you -- `/provider other`, `/model x` -- and its
          // answer belongs in the transcript, where the change is. The class is the frame's, and it
          // is the only thing that tells the two apart: sending a switch through the report route
          // would run it with the terminal quiet, which for a provider that starts a local engine
          // means starting one without printing a word anywhere.
          if (className === "panel") askReport(doc, item.line);
          else sendText(item.line);
        });
        row.appendChild(el("code", "", item.label));
        row.appendChild(el("span", "", help));
        group.appendChild(row);
      }
    }
    list.appendChild(group);
  }
}

/// Ask the process for a listing, and read it in the panel.
///
/// The third place this page sends a line -- after the composer and the switches -- and the rule is
/// the same one: the `send` string is composed by the process and sent verbatim, so there is no
/// command name in this file to go stale. What differs is the route. `/message` is a person typing
/// and its answer belongs in the transcript; `/report` is a reader asking, and its answer comes back
/// on the feed marked as a panel's.
///
/// A refusal puts the panel back to the list and says so, the way a refused switch puts the header
/// back to what is in force: a panel left saying "reading..." for an answer that is not coming is
/// the one way this could look like it worked.
async function askReport(doc, input) {
  if (!canSend || typeof input !== "string" || !input.trim()) return false;
  doc.reading = input;
  doc.readingText = "";
  showCommands(doc);
  try {
    const response = await fetch("/report", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, authHeader()),
      body: messageBody(input),
    });
    if (!response.ok) throw new Error("HTTP " + response.status + " " + (await response.text()).trim());
    setHint("");
    return true;
  } catch (e) {
    doc.reading = null;
    showCommands(doc);
    setHint("not read: " + e.message, true);
    return false;
  }
}

/// The run's actions, one button each: every command the frame marks as taking no argument.
///
