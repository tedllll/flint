  const cursor = Number(response.headers.get("X-Flint-At") || 0);
  // Read *before* the conversation is loaded, because `load` is what replaces `doc.meta` -- and the
  // whole point of the pair is comparing this conversation against the one this tab last read.
  const before = remembered();
  const whole = await response.text();
  load(whole);
  applied = cursor;
  notePosition(before, cursor, doc.meta && doc.meta.id);
}

/// Which conversation this page is showing, as the file's own `meta` line names it.
///
/// Sent beside the cursor, because a cursor is a position in a file and two files have the same
/// positions: without it, a page that reconnects after the run switched conversations would be
/// handed the entries of a conversation it is not reading -- positioned, in order, and wrong.
function sessionParam() {
  const id = doc.meta && doc.meta.id;
  return id ? "&session=" + encodeURIComponent(id) : "";
}

/// Follow the live feed, reconnecting for as long as the page is open.
///
/// The stream is opened *before* the file is read, and that order is what makes the pair
/// safe: the server subscribes before it sends these headers, so by the time this await
/// returns, every frame from here on is already being buffered for this connection. Reading
/// the file first would leave a window in which a frame belonged to neither source.
async function follow() {
  let delay = 500;
  // The conversation, once, before the feed opens: after this the page only ever applies what
  // the stream sends it, and a reconnect is a delta rather than a rebuild.
  await readSession();
  // `?debug=1`, and only then: the trace answers the one question the page cannot ask itself (is
  // the feed delivering, and do the frames become blocks?) and it is noise in every session that
  // works. Added after "the page does not change at all", where no frames, skipped frames and
  // frames rendered out of sight were indistinguishable -- and then given a file to write to,
  // because a hint line can only be read by whoever is sitting in front of the screen.
  for (;;) {
    try {
      postLog("opening the feed · last " + applied);
      // A deadline on *connecting*, not on the stream. The first version armed it for the whole
      // response, and a stream is silent between turns by design, so a healthy connection was
      // aborted every ten seconds -- measured in the log as `AbortError: BodyStreamBuffer was
      // aborted` on a ten-second cycle, forever. The timer is cleared the moment the response
      // arrives, and a listener that never answers still cannot hang the page.
      const deadline = new AbortController();
      const giveUp = setTimeout(() => deadline.abort(), 10000);
      let response;
      try {
        response = await fetch("/events?last=" + applied + sessionParam(), {
          headers: authHeader(),
          signal: deadline.signal,
        });
      } finally {
        clearTimeout(giveUp);
      }
      if (!response.ok) throw new Error("HTTP " + response.status);
      delay = 500;
      feedLast = "connected, applied " + applied;
      postLog("connected · " + feedTrace(feedReceived, doc.blocks.length, feedLast));
      if (debugFeed) setHint(feedTrace(feedReceived, doc.blocks.length, feedLast));

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const cut = sseFrames(buffer);
        buffer = cut.rest;
        for (const frame of cut.frames) {
          // Counted before anything decides what to do with it: a frame this page skips is the
          // whole reason the trace exists, and a counter after the skipping would show zero.
          feedReceived++;
          feedLast = (frame.event || "message") + " at " + frame.id;
          if (feedReceived === 1) postLog("first frame · " + feedTrace(feedReceived, doc.blocks.length, feedLast));
          if (debugFeed) setHint(feedTrace(feedReceived, doc.blocks.length, feedLast));
          // A named event, not a line of the run's vocabulary: it means this page's
          // document is stale, so it re-reads rather than trying to catch up.
          if (frame.event === "reset") {
            // Two different reasons arrive as the same frame, and the page cannot tell them
            // apart: `/new` and `/resume` moved the conversation, or this connection fell
            // behind and the frames in between are gone. So both are handled -- re-read, and
            // carry over an answer the file cannot have yet.
            const streaming = streamingAnswer(doc);
            // A destructive row's choice list is aimed at a document, not at a run: the numbers in
            // it are that document's, and the next one's are not the same list. So is a row's menu,
            // which is aimed at a position in a sidebar that is about to be re-read.
            doc.confirm = null;
            doc.menu = null;
            await readSession();
            carryStreaming(doc, streaming);
            await readSessions();
            schedulePaint();
            continue;
          }
          // The other named event, and the pair of them are the two things a cursor cannot
          // express. This one is *state*: what the turn is waiting for right now, sent once
          // because a page opened mid-turn has missed every change there has been. Applied
          // without a cursor, because it is not a change -- it is where things are.
          if (frame.event === "status") {
            doc.status = frame.data;
            setHint(doc.status ? "" : idleHint());
            schedulePaint();
            continue;
          }
          // The list of conversations changed -- `/archive` or `/delete` in the terminal. Only
          // the sidebar is re-read: the transcript has not changed, and rebuilding it would
          // throw away the reader's place for nothing. The list itself is not cosmetic, though:
          // the numbers in it are what `/resume` takes, and they are positions in a list, so a
          // stale one resumes the wrong conversation.
          if (frame.event === "sessions") {
            await readSessions();
            continue;
          }
          // The run's jobs changed -- one started, or one ended. Like `sessions` this is a route
          // that went stale rather than a fact, so the page re-reads it: a job that ended while a
          // background command was running has an exit code the frame does not carry.
          if (frame.event === "jobs") {
            await readJobs();
            continue;
          }
          // The third named event, and the other half of what a cursor cannot express: what the
          // turn in flight has written so far. State, applied without a cursor -- and the only
          // way a page that loaded, reconnected or was reset mid-turn can learn the part of the
          // answer that streamed before it was listening. `/session` cannot tell it, because the
          // file gets the assistant message when the turn ends.
          if (frame.event === "answer") {
            try {
              setStreamingAnswer(doc, JSON.parse(frame.data));
            } catch (e) {
              // Not worth a damage block: the next delta will rebuild the answer anyway.
            }
            schedulePaint();
            continue;
          }
          // A named event like the others, and the other kind of state: not what the turn is
          // doing but what the run *is* -- the provider and model in force, what each provider
          // offers, and every setting with the words that change it and the screen it belongs on.
          // Named rather than a line of the run's vocabulary because it
          // is not an event, and applied without a cursor for the same reason as `status`.
          if (frame.event === "state") {
            applyState(doc, frame.data);
            // The header prints the model and provider only when there is no state: with one,
            // the settings say it and offer the alternatives, and the same fact twice -- once of
            // them unchangeable -- reads as two different facts.
            schedulePaint();
            continue;
          }
          // The session file's own lines, sent when the ring could not answer this page's cursor
          // -- a gap of more than the ring holds, or a process that has only just started. They
          // are the record of what was missed, and they are drawn as the file draws them: see
          // `applyLine`'s `fromFile` and the two guards in `applyEvent`'s `chat` arm.
          if (frame.event === "file") {
            const at = Number(frame.id);
            if (Number.isFinite(at)) applied = Math.max(applied, at);
            if (frame.data) applyLine(doc, frame.data, true);
            schedulePaint();
            continue;
          }
          // A frame of the run, applied without comparing anything: what arrives is what this
          // page does not have, because the cursor it was sent is the last one this page
          // applied and the server replays nothing at or below it. The frame-count comparison
          // that used to stand here is the check a position makes unnecessary -- and it is what
          // dropped a page's own deltas whenever two of them shared a cursor.
          const at = Number(frame.id);
          if (Number.isFinite(at)) applied = Math.max(applied, at);
          if (frame.data) applyLine(doc, frame.data);
          schedulePaint();
        }
      }
      throw new Error("the stream ended");
    } catch (e) {
      // Reconnecting is the normal case, not an error worth shouting about: the usual
      // reasons are a flint that is being restarted and a laptop that was asleep.
      doc.status = feedTrouble(e.message);
      paint(doc);
      postLog("feed failed: " + describe(e) + " · " + feedTrace(feedReceived, doc.blocks.length, feedLast));
      // ...but a refused token is not a case retrying can fix, so the page stops here and says
      // where the right address is, instead of saying "reconnecting" until somebody gives up.
      if (tokenRefused(e.message)) return;
    }
    await new Promise((resolve) => setTimeout(resolve, delay));
    delay = Math.min(delay * 2, 10000);
  }
}

/// Whether the run answered "no token". **403 is the one to check**: it is what the listener
/// sends for a missing or wrong token (measured with `curl /session` against a running flint:
/// `403 missing or wrong token`), and the first version of this check tested for 401 -- which the
/// listener never sends -- so the page went on saying "reconnecting" for the one failure that
/// cannot be retried. 401 is kept because a proxy in front of loopback can produce one.
function tokenRefused(message) {
  return /\b40[13]\b/.test(message);
}

/// What the page says when it cannot read the run at all, and the two cases are different in
/// kind. A refused token never heals by itself: the token is in the URL this page was opened
/// with, and restarting flint changes both the port and the token, so a tab left open across a
/// restart is refused for good. A stream that ended is the ordinary case -- flint restarting, a
/// laptop waking -- and is retried without ceremony. Reported as "the page is not connected to
/// the conversation, and nothing on it changes": the second case's line was being shown for the
/// first, and "reconnecting" forever is indistinguishable from a broken flint.
function feedTrouble(message) {
  if (tokenRefused(message)) {
    return "this page's token is not this flint's — open the address flint printed (a restart changes the port and the token)";
  }
  return "live feed: " + message + " — reconnecting";
}

/// `?debug=1` on the address flint printed turns the hint line into the feed's trace. Guarded
/// because this file also runs under Node, where there is no `location`.
const debugFeed = typeof location !== "undefined" && /[?&]debug=1/.test(location.search);

/// An error as one line a log can hold. The stack, not the message: "which line" is the only
/// question worth asking of it, and this file has spent a long time being asked from a distance.
function describe(e) {
  return e && e.stack ? String(e.stack).split("\n").slice(0, 2).join(" | ") : String(e);
}

/// The feed's own counters. At module scope because the debug interval reads them between frames.
let feedReceived = 0;
let feedLast = "-";

/// Send one line of the page's account of itself to the server, which appends it to
/// `<FLINT_HOME>/web.log`. Failures are swallowed on purpose: a page that cannot log must not stop
/// being a page, and the log is a diagnostic rather than a guarantee.
function postLog(line) {
  try {
    fetch("/log", { method: "POST", headers: authHeader(), body: line }).catch(() => {});
  } catch (e) {
    // Nothing to say about it: this is the last thing that should ever take the view down.
  }
}

/// The line the debug switch shows in the hint, kept as a pure function so the shape is pinned:
/// what the answer to "the page does not change" has to distinguish is whether the feed connects,
/// whether frames arrive at all, and whether they become blocks -- three failures that look
/// identical from the outside, which is why the switch exists.
function feedTrace(received, blocks, last) {
  return "live · " + received + " frames · " + blocks + " blocks · last " + last;
}

function readFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => load(String(reader.result));
  reader.readAsText(file);
}

if (typeof document !== "undefined" && document.getElementById) {
  const drop = document.getElementById("drop");
  const picker = document.getElementById("file");
  document.getElementById("pick").addEventListener("click", () => picker.click());
  picker.addEventListener("change", () => readFile(picker.files[0]));
  for (const name of ["dragenter", "dragover"]) {
    drop.addEventListener(name, (e) => { e.preventDefault(); drop.classList.add("over"); });
  }
  for (const name of ["dragleave", "drop"]) {
    drop.addEventListener(name, (e) => { e.preventDefault(); drop.classList.remove("over"); });
  }
  drop.addEventListener("drop", (e) => {
    const item = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    readFile(item);
  });
  document.addEventListener("dragover", (e) => e.preventDefault());
  document.addEventListener("drop", (e) => e.preventDefault());

  // The preview's own three controls. Escape closes it, and it is bound here rather than on the
  // panel because the reader's focus is wherever they were reading, not in the panel: a path was
  // clicked, and the panel appeared beside the text they were looking at. A page with no run
  // behind it still draws the panel -- the paths in a dropped session are still paths -- and it
  // says there what it cannot do.
  document.getElementById("preview-close").addEventListener("click", closePreview);
  document.getElementById("preview-reload").addEventListener("click", () => readPreview());
  // The raw/rendered switch: it flips the view and reads the file again rather than keeping the last
  // body around. A second copy of the bytes in the page is exactly the derived state this project does
  // not keep, and the route is one round trip away -- the same reason `reload` exists as a control.
  document.getElementById("preview-render").addEventListener("click", () => {
    if (!preview) return;
    preview.view = preview.view === "rendered" ? "source" : "rendered";
    readPreview();
  });
  // The one control on this page that starts a program. See `openOutside` for why it is not the
  // path itself -- and the picture, which is the same act through the same route: a press on the
  // image is a person asking to see the file at the size this machine can show it, which is what
  // `open` does, and the panel's own button is still there for anyone who reads the header instead.
  document.getElementById("preview-open").addEventListener("click", () => openOutside());
  const pictureButton = document.getElementById("preview-image-button");
  if (pictureButton) pictureButton.addEventListener("click", () => openOutside());

  // The settings dialog's three doors, and the one Escape press that serves all three overlays.
  //
  // The listeners that used to sit here were two `keydown` handlers, one for the preview and one for
  // the jobs list, and they both ran on the same press -- `docs/features.md` recorded that as a
  // feature ("one `Escape` press also closes the jobs list when both are open"). With a *modal* that
  // is no longer an honest answer: a dialog over the page is the thing being used, so Escape has to
  // close it and nothing else. So there is one handler now, and `dismissTopmost` is the order.
  const settingsDoor = document.getElementById("settings-open");
  if (settingsDoor) settingsDoor.addEventListener("click", () => openSettings());
  const settingsClose = document.getElementById("settings-close");
  if (settingsClose) settingsClose.addEventListener("click", () => closeSettings());
  const settingsMask = document.getElementById("settings-mask");
  if (settingsMask) settingsMask.addEventListener("click", () => closeSettings());
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") dismissTopmost();
  });

  // The jobs panel, which is news rather than an answer: opening it repaints the running rows from
  // the clock, because the durations were last written when the list was read and a panel opened a
  // minute later would show a minute-old number.
  const jobsPanel = document.getElementById("jobs");
  if (jobsPanel) {
    jobsPanel.addEventListener("toggle", () => {
      if (jobsPanel.open) tickJobs();
    });
  }

  if (servedByFlint()) {
    // Served by a running flint: there is nothing to drop, and the conversation is the
    // process's. A failure is rendered rather than thrown, because a blank page and a
    // page whose request was refused look identical and only one of them is a bug.
    drop.hidden = true;
    canSend = true;
    document.getElementById("app").className = "app";
    document.getElementById("sidebar").hidden = false;
    document.getElementById("composer").hidden = false;
    setHint(idleHint());

    // The two hands, left and right, are one control: grab it, drag, let go, nudge with the
    // arrows, double-click to put it back. Only the width behind the boundary differs, so `apply`
    // is handed the boundary's position in the window and turns it into whichever width belongs
    // to that boundary. Nothing is remembered across reloads -- the page keeps nothing in storage
    // today, and a width that outlives the run is a preference nobody asked to have saved.
    const dragBoundary = (hand, apply, reset) => {
      hand.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        hand.setPointerCapture(e.pointerId);
        document.body.classList.add("dragging");
        e.preventDefault(); // a drag is not a text selection
      });
      hand.addEventListener("pointermove", (e) => {
        if (hand.hasPointerCapture(e.pointerId)) apply(e.clientX);
      });
      const end = (e) => {
        if (hand.hasPointerCapture(e.pointerId)) hand.releasePointerCapture(e.pointerId);
        document.body.classList.remove("dragging");
      };
      hand.addEventListener("pointerup", end);
      hand.addEventListener("pointercancel", end);
      hand.addEventListener("dblclick", reset);
      hand.addEventListener("keydown", (e) => {
        // The boundary follows the arrow, so Right widens whatever is on its left -- one rule for
        // both hands, and the reason this cannot be written as a width delta per hand.
        const step = e.shiftKey ? 48 : 16;
        if (e.key === "ArrowLeft") apply(hand.getBoundingClientRect().left - step);
        else if (e.key === "ArrowRight") apply(hand.getBoundingClientRect().left + step);
        else return;
        e.preventDefault();
      });
    };

    const app = document.getElementById("app");
    const pane = document.querySelector(".pane");
    const padX = () => parseFloat(getComputedStyle(pane).getPropertyValue("--pad-x")) || 18;

    // The conversation list's width.
    const grip = document.getElementById("grip");
    const setSide = (boundaryX) => {
      // 320px is what the transcript needs to be worth reading; below 160px the labels are all
      // ellipsis, which is the state the list was in before it could be dragged at all.
      const widest = Math.max(160, Math.min(900, window.innerWidth - 320));
      const w = Math.round(Math.min(Math.max(boundaryX, 160), widest));
      app.style.setProperty("--side", w + "px");
      grip.setAttribute("aria-valuenow", String(w));
    };
    dragBoundary(grip, setSide, () => app.style.removeProperty("--side"));
    setSide(grip.getBoundingClientRect().left);

    // The reading width. The transcript still scrolls at the window's edge whatever this is,
    // because the cap is on the content inside the scroll container and not on the container.
    const readHand = document.getElementById("read-grip");
    // Not named `doc`: this is the element, and the page's conversation document is already called
    // `doc` at this scope. It was named `doc` for one build, which shadowed the conversation
    // everywhere below it in this block -- including the boot's `paint(doc)`, which then read
    // `.blocks` off a `<div>` and threw, taking the sidebar, the session list and the feed with it.
    // The log said so in one line: `boot failed: TypeError: Cannot read properties of undefined
    // (reading 'length') at paint (...:862:19)`.
    const reading = document.getElementById("doc");
    const setRead = (boundaryX) => {
      const box = pane.getBoundingClientRect();
      const pad = padX();
      // Never wider than the pane can show: past that the hand would be dragged off the edge and
      // the only way to get it back would be the double-click.
      const most = Math.max(320, box.width - pad * 2);
      const w = Math.round(Math.min(Math.max(boundaryX - box.left - pad, 320), most));
      app.style.setProperty("--read", w + "px");
      readHand.setAttribute("aria-valuenow", String(w));
    };
    dragBoundary(readHand, setRead, () => app.style.removeProperty("--read"));
    readHand.setAttribute("aria-valuenow", String(Math.round(reading.getBoundingClientRect().width)));

    // The file panel's width, and it is the one hand of the three whose column is to the *right* of
    // the boundary: the width is measured from the panel's own right edge, which does not move, rather
    // than from the boundary's position in the window. 280px is narrow enough to read a line of prose
    // in and the window minus 420px is what the transcript keeps, so the list's hand and this one
    // cannot between them squeeze the reading away -- each clamps against the window, and the middle
    // column is what is left. Nothing is remembered across reloads, the same as the other two: a width
    // that outlives the run is a preference nobody asked to have saved.
    const previewHand = document.getElementById("preview-grip");
    const previewPanel = document.getElementById("preview");
    const setPreview = (boundaryX) => {
      const box = previewPanel.getBoundingClientRect();
      const widest = Math.max(280, Math.min(1100, window.innerWidth - 420));
      const w = Math.round(Math.min(Math.max(box.right - boundaryX, 280), widest));
      app.style.setProperty("--preview", w + "px");
      previewHand.setAttribute("aria-valuenow", String(w));
    };
    dragBoundary(previewHand, setPreview, () => app.style.removeProperty("--preview"));

    document.getElementById("new-conversation").addEventListener("click", async (e) => {
      // Disabled while it is in flight, because a second click before the process answers would
      // start a second conversation and leave the sidebar showing whichever won the race.
      e.target.disabled = true;
      await sendText("/new");
      e.target.disabled = false;
    });

    const message = document.getElementById("message");
    // The `/` menu follows what is typed, one keystroke at a time: `/` alone opens it on the frame's
    // own order, letters filter it, a space closes it (the line is being written), and clearing the
    // box closes it too. Nothing is cached: the rows come from the frame on every keystroke, which is
    // the same rule as everywhere else here -- a list kept from a moment ago is a second copy of a
    // fact the process owns.
    message.addEventListener("input", () => {
      sizeComposer();
      const query = menuQuery(message.value);
      if (query === null) hideMenu();
      else showMenu(doc, query);
    });
    message.addEventListener("keydown", (e) => {
      // While the menu is open it takes the arrows and Enter: a menu that swallowed Enter into a send
      // would send `/pro` -- a line nobody meant to type, and one the run would answer as an unknown
      // command. The menu's own Escape is the document handler's (`dismissTopmost`), because that is
      // the one place the order of the page's overlays is written down.
      if (menuOpen()) {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          menuStep(doc, e.key === "ArrowDown" ? 1 : -1);
          return;
        }
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          if (menu && menu.at >= 0) takeMenuRow(doc, menu.rows[menu.at]);
          return;
        }
      }
      // Enter sends, Shift+Enter is a newline. The other way round is what a chat box does and
      // is wrong here: a prompt is a paragraph far more often than it is a line, and a pasted
      // block has to be able to arrive as one message.
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        document.getElementById("composer").requestSubmit();
      }
    });
    document.getElementById("composer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = message.value;
      if (!text.trim()) return;
      // Cleared only once it is accepted, so a refusal leaves the text where it was rather
      // than losing what somebody typed -- and only when the box still holds what was sent.
      // Two submits can overlap -- the round trip is short but it is not instant, and typing
      // again during it is ordinary -- and the earlier one's clear would otherwise wipe the
      // text of the later one. Measured in a real browser: send, type again within 150 ms,
      // send, and the second message was written and then erased before it could be read.
      if (await sendText(text) && message.value === text) {
        message.value = "";
        sizeComposer();
      }
    });

    // The stop is `/stop`, sent down the same route as everything else the page says: the REPL is
    // what decides what a line means, and a second verb for stopping would be a second thing to
    // keep in step with it. Nothing is typed into the box, so a half-written message survives being
    // interrupted -- which is the moment it most needs to.
    document.getElementById("stop").addEventListener("click", async (e) => {
      // One click is one stop. The button goes away when the turn ends, but that is a round trip
      // away, and a second click inside that window would send a `/stop` that arrives after nothing
      // is running -- where a bare line is an unknown command rather than an interrupt.
      e.target.disabled = true;
      await sendText("/stop");
    });

    // The settings' controls are wired where they are drawn (`settingRow`), because which controls
    // exist is the frame's answer and a listener bound here would be a listener for a control this
    // page had decided on: the same reason there is no command name anywhere in this file.

    // With `?debug=1`, the page reports itself to `<FLINT_HOME>/web.log` every few seconds: how many
    // frames arrived, how many became blocks, and what the last one was. The hint line shows the
    // same thing, but the hint belongs to whoever is looking at the screen -- and this question was
    // asked four times over a console nobody could read from anywhere else.
    // Written by default, and that is a correction rather than a preference: the first version put
    // this behind `?debug=1`, and the bug it was built for was then reported again without a single
    // line of it -- a diagnostic that has to be switched on is one nobody switches on. The file is
    // the record; `?debug=1` only decides whether the same numbers are also shown on screen, which
    // is a display choice rather than a fact worth keeping.
    postLog("page opened · " + feedTrace(0, 0, "boot"));
    // Only when something has changed since the last line, so an idle page is silent and a stream
    // cannot write faster than the interval.
    let loggedTrace = "";
    setInterval(() => {
      const now = feedTrace(feedReceived, doc.blocks.length, feedLast);
      if (now === loggedTrace) return;
      loggedTrace = now;
      postLog(now);
    }, 3000);

    try {
      postLog("boot · painting");
      paint(doc);
      postLog("boot · painted");
      paintSessions();
      postLog("boot · sidebar drawn");
      readSessions().catch((e) => postLog("sessions failed: " + describe(e)));
      postLog("boot · sessions asked for");
      // The run's jobs, before the feed has said anything. A page opened while a long build is
      // running must show it: the `jobs` frame at connect may already have been sent, but the page
      // booting does not depend on having caught it.
      readJobs().catch((e) => postLog("jobs failed: " + describe(e)));
    } catch (e) {
      // The boot had no error surface at all: a throw here skipped the sidebar, the sessions and
      // the feed together, and the only thing that arrived was "page opened" -- which is exactly
      // what the log showed. A page that cannot start has to be able to say where it stopped.
      postLog("boot failed: " + describe(e));
      setHint("this page cannot start: " + describe(e));
    }
    follow().catch((e) => {
      doc.blocks = [
        { kind: "damage", text: "cannot follow this flint: " + e.message },
      ];
      paint(doc);
    });
  } else {
    // A file opened from disk: a session somebody dropped on the page, or an export, which is this
    // same page with the conversation welded into it. Nothing is fetched either way -- `file:` is what
    // `servedByFlint` is false for -- and the drop zone stays visible, because a reader of an exported
    // conversation dropping their own session on it is a reasonable thing to do next.
    const island = document.getElementById("session");
    const carried = islandLines(island);
    if (carried) {
      applyText(doc, carried);
    } else if (island) {
      // Present and unreadable is a broken export rather than an empty conversation, and the
      // difference matters: one is a file to send back, the other is a page with nothing in it.
      doc.blocks = [{ kind: "damage", text: "this export's conversation cannot be read" }];
      setHint("this export is damaged: its conversation is not readable");
    }
    paint(doc);
  }
}

// For the Node test in scripts/web-view-test.js, and for the page's own console.
if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    newDoc, applyLine, applyText, applyEvent, tokenFromSearch, servedByFlint, sseFrames,
    islandLines,
    // The page's own document, which is the one the dialog paints: `openSettings` reads it because in
    // a browser there is only one, and a check that drove a detached document could not see what the
    // dialog drew -- or find the row it was handed.
    doc,
    sessionsFrom, messageBody, resumeLine, streamingAnswer, carryStreaming, setStreamingAnswer,
    paint, feedTrouble, tokenRefused, feedTrace, debugFeed, applyState, showState, choiceControl,
    // The dialog's own drawing: the settings as controls, the rows as controls, and the painter that
    // does both for every screen. Exported because all three are pure functions of a frame over a
    // stub DOM -- which is how the Node harness checks what a screen holds without a browser.
    drawSettings, settingRow, drawRows, drawCommandRow, paintSettings, screenOf, MENU_GROUPS,
    sessionRow, formLine,
    addressParts, asUrl, asPath, bytesLabel, previewNote, linkNodes, renderBlock, fileRoute,
    // The branch control's half of the transcript: which answers a value cuts from, and the one
    // comparison that ties a value's label to a turn the page drew. Both are pure -- a document and a
    // frame in, marks out -- so the Node harness can check where the buttons land over a folded
    // conversation, an imported one and a turn in flight, which is where a wrong button would be a
    // branch cut somewhere nobody pointed at.
    branchPoints, isTheQuestion,
    // The picture half of the panel: which route is asked, which names make it worth asking, and the
    // one piece of this page's own state that has to be let go of. Exported because all three are
    // pure or nearly so -- a name in, a decision out -- so the Node harness can hold the extension
    // list and the route's encoding without a browser and without a picture on disk.
    imageRoute, imageExt, releasePicture, showPicture,
    // `POST /open`'s half of the panel: the body the route takes, and the frame's own write guard,
    // which is what decides whether the control is offered at all. Exported because both are pure --
    // one takes a path, the other reads a frame -- so the Node harness can check them without a
    // browser, which is the only way the readonly case is checked without turning a live run's guard
    // on in the middle of a turn.
    openBody, readonlyOn,
    // Opening a path is exported for one reason: the overlays now overlap, and "which one does Escape
    // close" is only a question once two of them can be open at once. The panel's own drawing is
    // checked in a browser; here it is a way to have one open.
    openPreview,
    // The settings dialog: the sections it offers, which one is open, and the one order Escape
    // follows. Exported because all three are decisions rather than drawing -- a rail is a list, a
    // section is a name, and "what does Escape close" is a question the Node harness can ask without
    // a browser and without a modal on screen.
    SETTINGS_PANES, showSettingsPane, settingsOpen, openSettings, closeSettings, dismissTopmost,
    // The `/` menu, exported for the same reason: what a query matches and what a row *does* are the
    // two halves of a decision, and the second half is where the one rule that matters lives -- a form
    // row must never complete the line, because a credential in the composer is a credential in the
    // session file. Neither half needs a browser to be checked.
    menuQuery, menuScore, menuRows, menuOpen, showMenu, hideMenu, menuStep, takeMenuRow, menuDispatch,
    setComposerText,
    // The Markdown reading. `markdownBlocks` is lines in and blocks out with no DOM at all -- which is
    // what makes a renderer checkable without a browser -- and `paintMarkdown` is the half that builds
    // nodes, so a check can read the structure it drew without a screenshot.
    isMarkdown, markdownBlocks, markdownList, tableCells, tableAlign, paintMarkdown,
    previewView, paintPreviewView, paintPreviewRefusal,
    // The text half of the panel: the lines and their gutter, the sentence that stands in for a file
    // that could not be read, and where a `grep` hit's line puts the scroll. Exported because a
    // number's *text* and a row's *existence* are structure, which the Node harness can read off the
    // nodes it drew -- a browser is needed for the geometry, not for the numbering.
    showLines, showPlain, scrollToLine,
    jobsFrom, durationLabel, jobWhen, jobIsLive, jobIsStoppable, paintJobs, titleWords,
    // The position this tab was reading from: exported so the Node harness can check the three cases
    // -- a gap, a different conversation, and a position past the end -- against the real functions
    // rather than against the page's text.
    SEEN_KEY, remembered, remember, notePosition,
    // The `/say --to` picker: `describePeer` and `fillPeerSelect` are pure enough to check in the
    // sandbox, which is where the label/value split and the broadcast default are held.
    describePeer, fillPeerSelect,
  };
}
