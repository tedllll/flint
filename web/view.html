///     One separator and no extension is left as text on purpose: `and/or`, `read/write`,
///     `pass/fail` and `24/7` all look like `src/bin` from here, and this page cannot tell them
///     apart without asking the disk;
///   * a one-character "extension" is prose, not a file: `e.g.` and `i.e.` are the reason, and
///     `foo.c` is the price -- it stays text;
///   * a `//` in it means it is not a path at all -- the candidate that reaches here with one is a
///     URL that failed `asUrl`, so it stays text;
///   * an absolute path has to be **two real segments deep, or end in an extension**: `/stop`,
///     `/name`, `/jobs` and `/web` are this program's own commands, and a conversation about flint
///     is full of them, so a one-segment `/word` is read as the word it is. `/etc/hosts`,
///     `~/.flint/config.toml` and `C:\notes.md` pass; a bare `/tmp` or `C:\Users` does not, which
///     costs nothing, because a directory is the one thing the preview refuses anyway;
///   * trailing `.` and `:` are punctuation rather than part of a name, and a trailing `:N` or
///     `:N:C` is the line a `grep` hit was found on: it comes back as `line` rather than as part
///     of the path, so the preview can open where the hit was.
///
/// `absoluteOnly` is the narrower rule prose is read with, and the reason is the bullets above:
/// in a sentence, `src/bin`, `and/or` and `e.g.` are words, while `/etc/hosts` and `C:\work\x` are
/// not. Tool output keeps the wider rule -- a relative path in a tool result is what the tool
/// meant. The web-address half is the same in both: a URL in a sentence is still a URL.
///
/// A **quoted** run is one candidate, quotes and all: `"C:\Program Files\flint\config.toml"`,
/// `'…'` and `` `…` ``. Without that, a path with a space in it was cut at the space -- the first
/// fragment became a link to a file that does not exist and the rest was plain text, which is how
/// one path reads as two things. A quote is also what flint itself puts around such a path when it
/// prints one (`display::quote_if_spaced`), because the same ambiguity faces a person reading the
/// terminal. A *bare* path with a space stays cut, and that residue is stated rather than hidden: no
/// reader can tell `C:\Program Files\x` from a path and a word, and the first fragment is still a
/// link to something that exists rather than to nothing.
function addressParts(text, absoluteOnly) {
  const parts = [];
  let last = 0;
  const candidates = String(text).matchAll(/"[^"\n]*"|'[^'\n]*'|`[^`\n]*`|[^\s"'`()\[\]{}<>,;]+/g);
  for (const match of candidates) {
    const raw = match[0];
    const quote = raw.length > 1 && /^["'`]/.test(raw) ? raw[0] : "";
    const token = quote ? raw.slice(1, -1) : raw;
    const found = asUrl(token) || asPath(token, absoluteOnly);
    if (!found) continue;
    // The opening quote stays text, and the closing one is left for the next piece: a link drawn
    // *inside* the quotes it was written with, rather than a link that ate them.
    if (match.index + quote.length > last) {
      parts.push({ text: text.slice(last, match.index + quote.length) });
    }
    parts.push(found);
    last = match.index + raw.length - (quote ? 1 : 0);
  }
  if (last < text.length) parts.push({ text: text.slice(last) });
  return parts;
}

/// One candidate token as a web address, or `null`.
///
/// The scheme is the whole test, and it is an **allowlist** rather than a blocklist of the schemes
/// that are dangerous. This document holds the run's token, and the text it renders is written by a
/// model, so an `href` taken from that text is a way to run script here: `javascript:` needs no
/// bug, no parser and no click beyond the one the reader was going to make anyway. The two schemes
/// that mean "a page" pass; `javascript`, `data`, `file` and a bare `www.` with no scheme at all
/// stay the words they are.
///
/// A trailing `.` or `:` is the sentence's punctuation rather than part of the address -- the other
/// trailing punctuation never reaches here, because the splitter cuts on it. The host is part of the
/// test as well: the scheme on its own is not an address, and neither is a scheme followed by
/// nothing but slashes.
function asUrl(token) {
  const text = token.replace(/[.:]+$/, "");
  if (!/^https?:\/\/[^\s/]+/i.test(text)) return null;
  return { url: text };
}

/// One candidate token as a path, or `null` when it is a word that merely looks like one.
///
/// With `absoluteOnly` -- which is how prose is read -- a relative name is a word: see
/// `addressParts` for why the two rules differ.
///
/// The result is `{path, line, written}`. `path` is what the route is asked to read, `line` is where
/// to put the panel (`openPreview`), and `written` is what the *button says* -- the token as the
/// reader met it, less a `file://` scheme, with its line suffix intact. Keeping the suffix on the
/// button is the reason `written` exists: the page used to draw `src/web.rs` for a `grep` hit that
/// said `src/web.rs:412:7`, so the one detail worth seeing in a hit (where it is) was in the tooltip
/// and nowhere else.
function asPath(token, absoluteOnly) {
  let text = token.replace(/[.:]+$/, "");
  // `file://` is a third way to write a path, and the scheme is the only part of it this page cannot
  // use: the route takes a path and the panel's own bar prints one. See `fileAddress`.
  const scheme = fileAddress(text);
  if (scheme) text = scheme;
  const marked = stripLine(text);
  let path = marked.path;
  let line = marked.line;
  if (path.length < 3 || path.indexOf("//") !== -1) return null;
  const segments = path.split(/[\\/]+/);
  const name = segments[segments.length - 1];
  const absolute = /^([\\/]|~[\\/]|[A-Za-z]:[\\/])/.test(path);
  if (absoluteOnly && !absolute) return null;
  // `4/2`, `2024/09` and `1/2/3` are ratios and dates as often as they are directories, and a
  // numeric segment in every position after the first is the shape they share. The check is only
  // made when there *is* a position after the first: `Cargo.toml` is one segment, and `every` on
  // an empty list is true -- which is how this rule first swallowed every bare filename.
  const tail = segments.slice(1);
  if (tail.length && tail.every((s) => /^\d+$/.test(s))) return null;
  // An extension at the end is the same evidence for an absolute path as for a relative one, and
  // it is the only thing that saves `C:\notes.md` and `/notes.md`, which are two segments once the
  // root is counted. Without it, one segment past the root is a *word* that happens to start with a
  // slash: `/stop`, `/name`, `/jobs`, `/web` and `/events` are this program's own commands, and a
  // transcript that turns them into links to files that do not exist is a transcript full of doors
  // onto "nothing at …".
  //
  // The condition is asked only of a **slash-rooted** path, because a slash command is the whole
  // reason for it: no command word begins with `~` or with a drive letter, so `~/notes` and `C:\x`
  // are paths on their own evidence and are left as they are. `C:\Users` and `/tmp` stay dropped
  // with the commands, which costs nothing -- a directory is the one thing the preview refuses by
  // its own rule.
  const rootSlash = /^[\\/]/.test(path);
  const hasExtension = /\.([A-Za-z0-9]{2,8})$/.test(name);
  if (absolute && rootSlash && !hasExtension && tail.length < 2) return null;
  if (!absolute && !hasExtension && segments.length < 3) return null;
  return { path: path, line: line, written: marked.written };
}

/// The line a token names, and the token without it.
///
/// Three ways of writing the same thing, because three tools write it and none of them is wrong:
///
/// - `src/a.rs:412` -- a compiler, most editors, and flint's own `grep`, which is also a
///   `:412:7` with the column on the end. The column is *dropped* (a preview opens at a line, and
///   nothing here draws a character offset) while `written` keeps it, since it is what the tool said.
/// - `src/a.rs#L412` and `#L412-L420` -- GitHub's, which is how a link to a line travels between
///   people. A range keeps its first line: the panel scrolls to one line, and the range's end is a
///   fact about the tooltip rather than about the file.
///
/// A token with neither is returned whole with `line: 0`.
function stripLine(token) {
  const hash = /^(.*?)#L(\d+)(?:-L(\d+))?$/.exec(token);
  if (hash) return { path: hash[1], line: Number(hash[2]), written: token };
  const colon = /^(.*?):(\d+)(?::\d+)?$/.exec(token);
  if (colon) return { path: colon[1], line: Number(colon[2]), written: token };
  return { path: token, line: 0, written: token };
}

/// A `file://` address as the path it names, or `null` when the token is not one.
///
/// The scheme is dropped rather than kept as a link: an `<a href="file://…">` is a navigation the
/// page will not make (and `asUrl` refuses the scheme by allowlist), while the *file* is the thing
/// the reader pointed at, and `GET /file` is the door that reads it. A `/` in front of a drive
/// letter goes with the scheme -- `file:///C:/x.js` is what a browser's copy-link produces, and
/// `C:/x.js` is the path it means -- while on Unix the leading `/` is the path's own root and stays.
///
/// `file://host/share/x` is *not* one: that is a path on another machine, and this page reads files
/// where the run lives. It stays text, and the doubling of the slash is what stops `asPath` from
/// taking it for a UNC path, which is how a Windows reader would spell the same thing.
function fileAddress(token) {
  if (!/^file:\/\//i.test(token)) return null;
  const rest = token.slice("file://".length);
  if (!rest.startsWith("/")) return null;
  return /^\/[A-Za-z]:[\\/]/.test(rest) ? rest.slice(1) : rest;
}

/// A byte count in the words the route uses for the same number, so the panel's note and the
/// route's own sentence do not disagree about how to say it.
function bytesLabel(n) {
  const units = [["GB", 1024 * 1024 * 1024], ["MB", 1024 * 1024], ["KB", 1024]];
  for (const [unit, size] of units) {
    if (n >= size) return Math.round(n / size) + " " + unit;
  }
  return n + " bytes";
}

/// The run's jobs, as `GET /jobs` answers them, sorted the way the panel draws them.
///
/// Pure, and deliberately dumb about what a job *is*: it reads the route's fields, keeps the ones
/// the rows need, and drops anything that is not a job. The order is the run's own -- running
/// first, newest first -- and it is *kept* rather than re-sorted here, because two lists that
/// sorted by different rules would show the same jobs in two orders and neither would be wrong.
function jobsFrom(json) {
  const listed = json && Array.isArray(json.jobs) ? json.jobs : [];
  const shown = [];
  for (const job of listed) {
    if (!job || typeof job.pid !== "number") continue;
    shown.push({
      pid: job.pid,
      kind: job.kind === "command" ? "command" : "child",
      label: typeof job.label === "string" ? job.label : "",
      status: typeof job.status === "string" ? job.status : "running",
      detail: typeof job.detail === "string" ? job.detail : "",
      started: Number(job.started_secs) || 0,
      ended: Number(job.ended_secs) || 0,
      path: typeof job.path === "string" ? job.path : "",
    });
  }
  return shown;
}

/// How long a job ran, or has been running, in the words a person reads.
///
/// `now` is handed in rather than read from the clock, so the ticking display and the test that
/// checks it agree about what "three minutes" means without either of them waiting.
function durationLabel(secs) {
  const s = Math.max(0, Math.floor(secs));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s";
  return Math.floor(s / 3600) + "h " + String(Math.floor((s % 3600) / 60)).padStart(2, "0") + "m";
}

/// The one line beside a job's row: where it is, or what it ended with.
///
/// `Running for` and `Took` rather than a bare number, because the two are different facts: one is
/// a clock still going and the other is a duration that has stopped. DSH's job list says the same
/// two words, which is where this came from.
function jobWhen(job, nowSecs) {
  if (job.status === "running") {
    return job.started ? "running for " + durationLabel(nowSecs - job.started) : "running";
  }
  const took = job.started && job.ended ? durationLabel(job.ended - job.started) : "";
  return took ? "took " + took : job.status;
}

/// Whether a person can still usefully stop this job.
///
/// Narrower than `jobIsLive` on purpose, and the difference is one press. A job already on its way
/// out is *live* -- it is still spending time, so the chips count it and the clock keeps it honest --
/// but offering `stop` for it is a choice whose only outcome is the sentence it already has, which is
/// the rule the stop menu states about a job that has ended.
function jobIsStoppable(job) {
  return job.status === "running";
}

/// Whether a job is still in flight, which is wider than "the status word is `running`".
///
/// A job that has been asked to stop is **still spending time** until it does: the signal is out and
/// the process is on its way out, and a page that filed it under "done" would show a run as finished
/// while the editor it started was still holding a file. `stopping` is not a settled word either --
/// the exit that completes it has not happened yet -- so it belongs on the live side of every
/// question the page asks, and the chips say the word out loud rather than pretending it is running.
function jobIsLive(job) {
  return job.status === "running" || job.status === "stopping";
}

/// The token, out of the URL that `--web` printed.
///
/// It travels in the query string of the one route a person pastes into a browser --
/// there is nowhere else to put it, and a page that cannot authenticate itself cannot
/// fetch anything. From here on it is sent as a header instead, because a query string
/// ends up in history, in logs and in any link that gets shared, and a header does not.
function tokenFromSearch(search) {
  const match = /[?&]token=([0-9A-Za-z_-]+)/.exec(search || "");
  return match ? match[1] : "";
}

/// The sidebar's items, out of what `GET /sessions` returned.
///
/// Pure and tested in Node, because the two things that can go wrong here are both silent: a
/// number that is not the one `/resume` accepts, and a list that is rendered as if it were
/// empty. Anything unexpected becomes an empty list rather than a throw -- the sidebar is not
/// worth taking the page down for, and the transcript beside it is still readable.
function sessionsFrom(text) {
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    return [];
  }
  const list = parsed && parsed.sessions;
  if (!Array.isArray(list)) return [];
  return list
    .filter((s) => s && typeof s.n === "number" && typeof s.id === "string")
    .map((s) => ({
      n: s.n,
      id: s.id,
      label: typeof s.label === "string" && s.label ? s.label : "(empty)",
      current: s.current === true,
    }));
}

/// One setting that is a choice, as the words themselves.
///
/// A press per value the frame named, with the one in force filled in, rather than a `<select>`: a
/// select is the same fact behind a control the OS draws, at the OS's size and in the OS's colours,
/// and it opens *over* the panel -- which is why no setting is drawn with one and why the one select
/// left in this dialog is an *answer* being given rather than a value being set (the peer a `/say`
/// goes to, in the form that asks for it).
///
/// The current value is added to the list when the frame does not repeat it, which is the rule the
/// select needed and for the same reason: a provider's `model` field is offered by `/model` whether or
/// not it is repeated in `models`, so a control built from `models` alone would show whichever value
/// came first and *send* it the moment anything else on the page was touched. A list with one word in
/// it is drawn and disabled rather than hidden: it says what is in force, which is the half that
/// matters, and being dead says there is nothing to choose between.
function choiceControl(doc, send, help, choices, value) {
  const words = Array.isArray(choices)
    ? choices.map(String).filter((word) => word.trim() !== "")
    : [];
  if (value && !words.includes(value)) words.unshift(value);
  const box = el("div", "choices");
  box.title = help;
  for (const word of words) {
    const button = el("button", "choice", word);
    button.type = "button";
    // `aria-pressed` rather than a class, because it is the same fact to a reader as the fill is to
    // the eye -- and the harness reads it back the same way rather than by matching colours.
    button.setAttribute("aria-pressed", word === value ? "true" : "false");
    button.disabled = words.length < 2;
    button.addEventListener("click", async () => {
      // A refused change puts the control back to what is in force, because a control that quietly did
      // nothing is worse than one that says it could not. The frame that comes back is the one that
      // says what happened, and the terminal is where the reason is printed.
      if (!(await sendText(send + " " + word))) showState(doc);
    });
    box.appendChild(button);
  }
  return box;
}

/// The screens of the settings dialog, in the order they are read.
///
/// This page's own list, and the one place it is allowed to name its own furniture: a screen is a
/// place this page put things, so its name and its one-line note are the page's words -- while what
/// is *on* it is the frame's. Every command row carries the screen it belongs on (`group`) and every
/// setting carries its own, so the process says where a thing goes and this list only says what to
/// call the place and in which order the places read: the endpoint first (what answers), then how the
/// run behaves, then what it may spend, then what it can use, then this conversation, and last the
/// work it left running. The order is a person's, not the table's.
///
/// A screen with nothing on it is not drawn, and a group the frame names that is not here is not
/// drawn either rather than shown unlabelled -- `the_page_files_every_settings_screen_the_process_
/// hands_it` in `tests/web_view.rs` is what keeps the two lists from drifting apart in silence.
const SETTINGS_PANES = [
  ["model", "model", "the endpoint and the model this run asks"],
  ["run", "this run", "how it behaves while it works"],
  ["limits", "limits", "what it may spend, and how it runs a command"],
  ["tools", "tools", "what it can use, and what it knows"],
  ["conversation", "this conversation", "its name, its size, and the other conversations"],
  ["work", "background work", "what this run left running"],
];

/// Where the control for a row this page cannot press actually is, per class.
///
/// A row this page draws no control for is a row of reference, and the first person to use the panel
/// asked why some rows press and others do not. The answer is here, on hover, where the question is
/// asked: the words are this page's own, because where *this* page put its controls is its own
/// business, while which commands exist is the process's. A `selector` that carries `values` never
/// reaches here either -- it is a control, and this entry is for the one selector whose list lives
/// somewhere else on the page (`/resume`'s, which is the sidebar).
const COMMAND_HOMES = {
  selector: "a conversation on the left",
  form: "typed in the terminal -- it asks questions",
};
const COMMAND_HOME_FALLBACK = "typed in the terminal";

/// Which screen a row belongs on: the frame's word, or the first screen when the frame files it
/// nowhere.
///
/// A row with no group is one the `/` menu offers and no screen holds, and the menu's two hand-offs
/// still have to put the dialog *somewhere*: the first screen is where a reading lands and where a
/// form row is marked, rather than a dialog that opens with the last screen still showing.
function screenOf(command) {
  const wanted = command && typeof command.group === "string" ? command.group : "";
  return SETTINGS_PANES.some(([key]) => key === wanted) ? wanted : SETTINGS_PANES[0][0];
}

/// One screen's settings: what a person came to change.
///
/// Drawn from `state.settings`, which is the process's own answer to what a setting is: the key, the
/// value in force, the words it takes, how to draw it (`kind`), what changing it means (`help`) and
/// the line that changes it (`send`). So this page carries no list of settings and no grammar for
/// them: it joins `send` and the value the way `/provider <name>` is joined -- the words are the
/// process's, and the page is not inventing a command.
///
/// Rebuilt on every state frame, which is safe here in a way it is not for the rows: a control is
/// redrawn with the value that is in force, and a frame only arrives when something has changed.
function drawSettings(doc, key, box) {
  while (box.firstChild) box.removeChild(box.firstChild);
  const all = doc.state && Array.isArray(doc.state.settings) ? doc.state.settings : [];
  let drawn = 0;
  for (const setting of all) {
    if (!setting || setting.group !== key || typeof setting.key !== "string") continue;
    box.appendChild(settingRow(doc, setting));
    drawn += 1;
  }
  // A screen with nothing set on it draws no container rather than an empty one, because the gap it
  // would leave is between the page's head and its first group -- where a person reads it as a page
  // that failed to load rather than as a fact about this run.
  box.hidden = drawn === 0;
}

/// One setting, as a row: its name, what changing it means under it, and the control on the right.
function settingRow(doc, setting) {
  const send = typeof setting.send === "string" ? setting.send : "";
  const help = typeof setting.help === "string" ? setting.help : "";
  const value = setting.value === undefined || setting.value === null ? "" : String(setting.value);
  const row = el("div", "setting");
  // The name and its sentence are one box rather than two cells of the row, so they stack: a fixed
  // name column is a width guessed for the longest name, and the sentence beside it is prose that then
  // has to fit whatever is left. Stacked, every row is two lines and every control is at the same
  // place down the page.
  const text = el("div", "setting-text");
  text.appendChild(el("span", "setting-name", setting.key));
  text.appendChild(el("span", "setting-help", help));
  row.appendChild(text);
  if (setting.kind === "select") {
    row.appendChild(choiceControl(doc, send, help, setting.choices, value));
    return row;
  }
  // A value that is a line rather than a choice: an input and a press. There is no `change` event on
  // a box somebody is still typing in, and `max_steps` may not be sent half-typed -- so this is a
  // form, and the line is `send` plus what the box holds, exactly the composition above.
  const form = el("form", "setting-edit");
  const input = el("input", "value");
  // The frame's word for how to draw it, not a guess from the key's name: a number box refuses
  // `many`, which is the whole reason `kind` is in the frame.
  input.type = setting.kind === "number" ? "number" : "text";
  input.value = value;
  input.title = help;
  const save = el("button", "send", "save");
  save.type = "submit";
  // Nothing to save is a real state and is shown rather than hidden: the press is dead until the box
  // says something else, so a person cannot send the value that is already in force and read the
  // answer as a change. Blanking a setting is allowed -- an empty `proxy` is how one is cleared.
  const current = () => (input.value === value ? save.disabled = true : save.disabled = false);
  current();
  input.addEventListener("input", current);
  form.addEventListener("submit", (event) => {
    if (event && typeof event.preventDefault === "function") event.preventDefault();
    const said = send + " " + input.value.trim();
    if (!said.trim()) return;
    sendText(said);
  });
  form.appendChild(input);
  form.appendChild(save);
  row.appendChild(form);
  return row;
}

/// One screen's commands, grouped by what each row does.
///
/// The list is drawn from the frame and never assembled here, so a row cannot offer a command the
/// terminal does not take. The report rows are pressable, and what a press does is ask the process
/// for that listing on `/report` -- the route that keeps the answer off the terminal, where the
/// reader did not ask for it (ROADMAP §8). A row that carries `values` is drawn once per value, which
/// is how a read that takes an argument (`/skills <name>`) gets a control without the page ever
/// knowing what the command is called. A row the frame marks with a `field` gets an input instead,
/// and what its button sends is the row's `send` plus what was typed -- the same composition again,
/// and the input's `type` comes from the frame, so a credential is masked because the process said
/// it was one.
///
/// The class is also the grouping, and that is the one thing here the page decides: `this conversation`
/// is eleven rows in a run with nothing open, and eleven rows in one list is a list a person reads
/// twice to find `/delete`. Under their classes they are four or five short lists, and the destructive
/// pair is at the bottom under its own word. Which screen a row is on is still the frame's, and the
/// words for the classes are the menu's own (`MENU_GROUPS`) rather than a second set invented here.
///
/// One reading at a time on the whole dialog rather than one per screen, because a screen is a place
/// and a reading is a thing being looked at: `doc.reading` is that, `doc.readingGroup` is which
/// screen it belongs to, and every other screen goes on showing its own rows. A reading is drawn
/// *instead of* the groups rather than inside one: it is an answer to a press, not a class of row.
function drawRows(doc, key, list) {
  while (list.firstChild) list.removeChild(list.firstChild);
  const commands = doc.state && Array.isArray(doc.state.commands) ? doc.state.commands : [];
  const rows = commands.filter(
    (command) => command && command.group === key && typeof command.label === "string"
  );
  // Hidden when there is nothing to show: a screen of settings with no commands under it is right
  // (the `model` screen is three pickers and four provider rows, and a run may have neither), and an
  // empty box is a promise this page cannot keep.
  list.hidden = rows.length === 0 && !(doc.reading && doc.readingGroup === key);
  if (doc.reading && doc.readingGroup === key) {
    // A listing being read, which replaces this screen's rows until the reader goes back. The name
    // comes from what was asked for rather than from the answer's own first line, so the heading is
    // the same whether the process has answered yet or not.
    const back = el("button", "back", "\u2039 back");
    back.type = "button";
    back.addEventListener("click", () => {
      doc.reading = null;
      paintSettings(doc);
    });
    list.appendChild(back);
    list.appendChild(el("div", "row", doc.reading));
    list.appendChild(el("div", "reading", doc.readingText || "reading\u2026"));
    return;
  }
  // One group per class, in the menu's own order -- the same words, because the launcher and the
  // screen are answering the same question about a row ("what does this do?") and a page that called
  // the same five classes by two sets of names would be teaching a person two vocabularies. A class
  // this page has no word for -- a command added to the process since this page was written -- is
  // drawn under no heading rather than dropped: what the frame offers is not this page's to lose, and
  // a new class in the process must not silently hide a row from the person who came looking for it.
  const groups = MENU_GROUPS.slice();
  const known = groups.map(([className]) => className);
  for (const command of rows) {
    const className = String(command.class || "");
    if (!known.includes(className) && !groups.some(([name]) => name === className)) {
      groups.push([className, ""]);
    }
  }
  for (const [className, title] of groups) {
    const inGroup = rows.filter((command) => String(command.class || "") === className);
    if (inGroup.length === 0) continue;
    const group = el("div", "group");
    if (title) group.appendChild(el("h3", "group-title", title));
    const box = el("div", "group-rows");
    for (const command of inGroup) drawCommandRow(doc, key, command, box);
    group.appendChild(box);
    list.appendChild(group);
  }
}

/// One command row, in the shape its class calls for.
///
/// Split out of `drawRows` so that a screen's list is one loop over the frame's rows and this is the
/// five shapes a row can take: a form (the frame said how to supply the answers), a button (a line
/// with no argument), a destructive row (two presses and the line between them), a report or a
/// picker (one press per line it offers), and a row of reference (this page has no control for it,
/// and says where the control is instead).
function drawCommandRow(doc, key, command, list) {
  const send = typeof command.send === "string" ? command.send : "";
  const help = typeof command.help === "string" ? command.help : "";
  const className = command.class;
  // A row the frame says takes answers gets one input each. It is a *form*, not a report: the
  // answers go on `/message` with the rest of what a person sends, because a form changes
  // something and its answer belongs in the transcript where the change is. Each answer's
  // `field` is the input's `type`, so the page is told how to draw it rather than deciding from
  // the command's name that a key is a secret -- and a masked input is emptied the moment it is
  // sent, so the value exists in the input, on the wire, and in the config file it was for, and
  // nowhere else.
  const fields = Array.isArray(command.fields) ? command.fields : [];
  if (fields.length > 0) {
    const form = el("form", "field");
    const inputs = fields.map((spec) => {
      // An answer the frame says comes from a list is a picker, not a field: a pid typed into a
      // text box would be prose, and a message that quietly went to whoever the sentence named is
      // worse than one that reached everybody here.
      if (spec && spec.from === "peers") return peerPicker();
      const input = el("input", "value");
      input.type = spec && spec.field === "password" ? "password" : "text";
      // One answer says what the command is for; several have to say which answer each wants,
      // because there is no room to explain three of them one at a time.
      input.placeholder =
        fields.length === 1 ? help : ((spec && spec.name) || "") + (spec && spec.optional ? " (optional)" : "");
      return input;
    });
    const submit = el("button", "send", send);
    submit.type = "submit";
    form.addEventListener("submit", (event) => {
      if (event && typeof event.preventDefault === "function") event.preventDefault();
      const line = formLine(send, fields, inputs.map((input) => input.value));
      // Nothing at all is sent when an answer the frame did not mark optional is missing. That is
      // not politeness: the bare command is a different thing -- `/provider add` with no arguments
      // is the wizard, which asks a person one question at a time, and a run being served to a
      // page has nobody at the terminal to answer it.
      if (!line) return;
      inputs.forEach((input, at) => {
        if (fields[at] && fields[at].field === "password") input.value = "";
      });
      sendText(line);
    });
    for (const input of inputs) form.appendChild(input);
    form.appendChild(submit);
    list.appendChild(form);
    return;
  }
  // An action: a line with no argument to ask for. A press sends the row's own `send` string, put
  // together by the process, so there is no command name in this file to go stale -- and a press
  // that is refused puts the screen back to what is in force.
  if (className === "button" && send) {
    const row = el("button", "row action");
    row.type = "button";
    row.title = help;
    row.addEventListener("click", async () => {
      if (!(await sendText(send))) showState(doc);
    });
    row.appendChild(el("code", "", command.label));
    row.appendChild(el("span", "", help));
    list.appendChild(row);
    return;
  }
  // A destructive row is the one class where a single press could destroy work, so it takes two
  // deliberate presses and the second one is a row that prints the line it will send. The first
  // press opens the choices, taken from the list the frame named -- which the page already
  // holds: the sidebar's own numbers, the provider names from the state frame, or the pids in the
  // jobs panel it is looking at -- and the second sends `send + " " + value`, the same
  // composition as everywhere else. `doc.confirm` is that state, and it is only the row: nothing
  // has been sent while it is open, so there is no countdown to get wrong and nothing to disarm
  // on a timer.
  //
  // A job's candidates are only the ones a stop can still *do* something about: a job that has
  // ended cannot be stopped at all, and one that is already stopping is live but already
  // answered, so offering it would be a choice whose only outcome is the sentence saying so.
  const choices =
    command.from === "sessions"
      ? sessions.map((s) => ({ value: String(s.n), label: s.label }))
      : command.from === "providers"
        ? ((doc.state && Array.isArray(doc.state.providers) ? doc.state.providers : [])
            .filter((p) => p && typeof p.name === "string")
            .map((p) => ({ value: p.name, label: p.name })))
        : command.from === "jobs"
          ? listedJobs
              .filter((job) => jobIsStoppable(job))
              .map((job) => ({ value: String(job.pid), label: job.kind + " " + job.label }))
          : null;
  if (className === "danger" && choices) {
    if (doc.confirm && doc.confirm.send === send) {
      const back = el("button", "back", "\u2039 back");
      back.type = "button";
      back.addEventListener("click", () => {
        doc.confirm = null;
        paintSettings(doc);
      });
      list.appendChild(back);
      for (const choice of choices) {
        const row = el("button", "row danger");
        row.type = "button";
        row.title = help;
        row.addEventListener("click", () => {
          // The second press: the row says the line, and the line is what goes.
          doc.confirm = null;
          sendText(send + " " + choice.value);
        });
        row.appendChild(el("code", "", send + " " + choice.value));
        row.appendChild(el("span", "", choice.label));
        list.appendChild(row);
      }
      if (choices.length === 0) list.appendChild(el("div", "row", "nothing to choose from"));
    } else {
      const row = el("button", "row danger");
      row.type = "button";
      row.title = help;
      row.addEventListener("click", () => {
        doc.confirm = { send: send };
        paintSettings(doc);
      });
      row.appendChild(el("code", "", command.label));
      row.appendChild(el("span", "", help));
      list.appendChild(row);
    }
    return;
  }
  const values = Array.isArray(command.values) ? command.values : [];
  // What each value is *of*, for the one row that needs it: a question's number says where a cut falls
  // and nothing about what is being cut, so `/fork`'s buttons carry the question's own first line. The
  // lists are index-aligned by the process (`page_rows` builds them from one read), and a row whose
  // labels are short of its values simply says the help twice.
  const labels = Array.isArray(command.labels) ? command.labels : [];
  const offered = [];
  if (className === "panel" && send) offered.push({ label: command.label, line: send, note: "" });
  values.forEach((value, at) => {
    if (typeof value !== "string" || !value.trim()) return;
    offered.push({
      label: send + " " + value,
      line: send + " " + value,
      note: labels[at] || "",
    });
  });
  if (offered.length === 0) {
    // Nothing this page can send: a row of reference, marked and dimmed so that it cannot be
    // mistaken for the control it is not, and carrying the one thing it can usefully say --
    // where that control is (see `COMMAND_HOMES`). It used to be drawn to look exactly like a
    // pressable row, on the theory that no command should look different from the others. That
    // reads well and does not work: the first person to use the panel asked why some rows press
    // and others do not, which is a puzzle rather than a list.
    const row = el("div", "row reference");
    row.title = "this one is " + (COMMAND_HOMES[className] || COMMAND_HOME_FALLBACK);
    row.appendChild(el("code", "", command.label));
    row.appendChild(el("span", "", help));
    list.appendChild(row);
    return;
  }
  for (const item of offered) {
    const row = el("button", "row");
    row.type = "button";
    row.title = help;
    row.addEventListener("click", () => {
      // A value on a *report* row is a read, and its answer belongs in the panel. A value on any
      // other row is a line this page types for you -- `/provider other`, `/model x` -- and its
      // answer belongs in the transcript, where the change is. The class is the frame's, and it
      // is the only thing that tells the two apart: sending a switch through the report route
      // would run it with the terminal quiet, which for a provider that starts a local engine
      // means starting one without printing a word anywhere.
      if (className === "panel") askReport(doc, item.line, key);
      else sendText(item.line);
    });
    row.appendChild(el("code", "", item.label));
    row.appendChild(el("span", "", item.note || help));
    list.appendChild(row);
  }
}

/// Every screen, painted from the frame: the settings, then the rows, for each in the page's order.
///
/// The whole dialog is redrawn from one frame rather than each control being updated in place, and
/// that is the same decision the transcript's painter makes for the same reason: the frame is the
/// truth, and a control that kept a value the process has moved past is a control that lies. Nothing
/// is kept between frames -- a listing held from a moment ago would be a second copy of a fact the
/// process owns (see `askReport`).
function paintSettings(doc) {
  if (!document.getElementById("settings-panes")) return;
  for (const [key] of SETTINGS_PANES) {
    const box = document.getElementById("fields-" + key);
    if (box) drawSettings(doc, key, box);
    const list = document.getElementById("row-list-" + key);
    if (list) drawRows(doc, key, list);
  }
}

/// Ask the process for a listing, and read it on the screen the row is on.
///
/// The third place this page sends a line -- after the composer and the switches -- and the rule is
/// the same one: the `send` string is composed by the process and sent verbatim, so there is no
/// command name in this file to go stale. What differs is the route. `/message` is a person typing
/// and its answer belongs in the transcript; `/report` is a reader asking, and its answer comes back
/// on the feed marked as a panel's.
///
/// The screen is the caller's, and it is carried rather than looked up when the answer arrives: the
/// reading belongs where the row was pressed, and a frame in between (a turn ending, say) must not
/// move it under a different heading.
///
/// A refusal puts the screen back to its rows and says so, the way a refused switch puts the controls
/// back to what is in force: a panel left saying "reading..." for an answer that is not coming is
/// the one way this could look like it worked.
async function askReport(doc, input, key) {
  if (!canSend || typeof input !== "string" || !input.trim()) return false;
  doc.reading = input;
  doc.readingGroup = key;
  doc.readingText = "";
  paintSettings(doc);
  try {
    const response = await fetch("/report", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, authHeader()),
      body: messageBody(input),
    });
    if (!response.ok) throw new Error("HTTP " + response.status + " " + (await response.text()).trim());
    setHint("");
    return true;
  } catch (e) {
    doc.reading = null;
    paintSettings(doc);
    setHint("not read: " + e.message, true);
    return false;
  }
}

/// The `/` menu: what typing a slash in the composer offers, and what taking a row does.
///
/// The list is the frame's -- the same `state.commands` the settings dialog draws, so this file still
/// contains no command name and the menu cannot offer a line the terminal would refuse. What differs
/// from the dialog is the *shape*: a dialog is a reference you read, and this is a launcher you drive
/// from the keyboard while a line is half-typed. Arrow keys move one row at a time, Enter takes the
/// row, Escape puts the menu away, and typing after the `/` filters.
///
/// The dispatch is per class, and each class is a different *amount* of commitment rather than a
/// different feature. This is where the one rule that matters lives: **a form row never completes the
/// line.** A form command that filled the composer would be a credential typed into a transcript --
/// the session file is written by the run, and a secret in it is a secret in a file. So a form row
/// opens the dialog at the row instead, where the field is masked and the value never touches the
/// conversation.
const MENU_ROWS_MAX = 40;

/// What a value typed in the composer is asking the menu about: the text after a leading `/`, or
/// `null` when the menu should not be open at all.
///
/// The strictness is the point. A menu that stayed open through `/config set key value` would be
/// covering the line being written, and one that opened on a slash in the middle of a sentence
/// (`see src/main.rs and/or docs`) would be offering `/or`. So: the value must *start* with the
/// slash and contain no whitespace yet. Once there is a space the line is being written, and the
/// menu has said what it knows.
function menuQuery(value) {
  if (typeof value !== "string") return null;
  const text = value.trimStart();
  if (!text.startsWith("/")) return null;
  const rest = text.slice(1);
  return /\s/.test(rest) ? null : rest;
}

/// How well a command answers a query typed after the `/`.
///
/// Subsequence rather than substring, and prefix before the rest: `/sk` finds `/skill`, `/pkey` finds
/// `/pkey` finds a two-word command, and a bare `/` puts the frame's own order first. The score is
/// what makes the list predictable -- exact prefix, then a subsequence of the command itself, then a
/// word in its help -- because a menu whose order is "whatever the frame happened to send" is one a
/// person cannot learn. Zero means no match.
function menuScore(command, query) {
  if (!command) return 0;
  const name = String(command.send || "").toLowerCase();
  const q = String(query || "").toLowerCase();
  if (!q) return 1;
  const bare = name.startsWith("/") ? name.slice(1) : name;
  if (bare.startsWith(q)) return 100;
  const at = bare.indexOf(q);
  if (at >= 0) return 80 - at;
  let cursor = 0;
  let gap = 0;
  for (const ch of q) {
    const found = bare.indexOf(ch, cursor);
    if (found < 0) {
      // Not in the name: the help text is the last chance, and only as a substring. A subsequence
      // over a whole sentence matches almost anything (`/delete` matches "the panel does").
      const help = String(command.help || "").toLowerCase();
      return help.includes(q) ? 20 : 0;
    }
    gap += found - cursor;
    cursor = found + 1;
  }
  return 60 - Math.min(gap, 40);
}

/// How the `/` menu groups its rows, in the order it draws them.
///
/// By §8's *class*, which is the right reading order for a palette and the wrong one for settings: a
/// palette is "every line this run takes, sorted by what kind of thing it is", and a settings dialog
/// is "the settings, sorted by which one you came to change" -- which is why the dialog's screens are
/// the frame's `group` words (`SETTINGS_PANES`) and not these. The words are this page's own, and the
/// rows are the frame's.
const MENU_GROUPS = [
  ["panel", "reports"],
  ["button", "actions"],
  ["selector", "selectors"],
  ["form", "forms"],
  ["danger", "destructive"],
];

/// The rows a query offers, in the order the menu draws them.
///
/// The frame's order, filtered and then stably sorted by score: the frame's order is a table's, and
/// this list is a *reading* order (the same reason `MENU_GROUPS` exists). Ties keep the frame's
/// order, which is what makes the list stable while a person types.
function menuRows(doc, query) {
  const commands = doc && doc.state && Array.isArray(doc.state.commands) ? doc.state.commands : [];
  const scored = [];
  commands.forEach((command, at) => {
    if (!command || typeof command.label !== "string" || typeof command.send !== "string") return;
    const score = menuScore(command, query);
    if (score > 0) scored.push({ command, score, at });
  });
  scored.sort((a, b) => (b.score - a.score) || (a.at - b.at));
  return scored.slice(0, MENU_ROWS_MAX).map((entry) => entry.command);
}

/// What the menu is showing: the rows, the row the keyboard is on, and (for a selector) the values
/// the frame named for the row that was just taken. `null` when it is closed.
let menu = null;

function menuOpen() {
  const box = document.getElementById("menu");
  return !!box && box.hidden === false;
}

/// Draw the menu for a query, or put it away.
///
/// Rebuilt on every keystroke, which a panel of settings must not be (a `<select>` closing under the
/// pointer) and a menu must be: the rows *are* the query's answer, and there is no control inside a
/// row whose state could be lost.
function showMenu(doc, query, values) {
  const box = document.getElementById("menu");
  if (!box) return;
  const commands = doc && doc.state && Array.isArray(doc.state.commands) ? doc.state.commands : [];
  // A page with no run behind it has no commands to offer, and a menu drawn from nothing is a promise
  // this page cannot keep -- the same rule the settings door follows.
  if (!values && commands.length === 0) {
    hideMenu();
    return;
  }
  const rows = values
    ? values.map((value) => ({ label: String(value), send: String(value), help: "", class: "value" }))
    : menuRows(doc, query);
  menu = { query: query, rows: rows, at: rows.length ? 0 : -1, values: !!values, base: "" };
  while (box.firstChild) box.removeChild(box.firstChild);
  if (rows.length === 0) {
    // Nothing to offer is said rather than drawn as an empty box: `/zzz` is a person asking, and
    // "no command matches" is the answer. The menu stays open so a backspace brings the list back.
    box.appendChild(el("div", "row empty", "no command matches /" + String(query || "")));
    box.hidden = false;
    return;
  }
  // Grouped by the class the frame gave, in this page's reading order. A heading is not a row: the
  // arrow keys skip it because `menu.at` counts rows, not children.
  for (const [className, heading] of MENU_GROUPS) {
    const inGroup = rows.filter((row) => row.class === className);
    if (inGroup.length === 0) continue;
    box.appendChild(el("div", "group-name", heading));
    for (const row of inGroup) box.appendChild(menuButton(doc, row, rows.indexOf(row)));
  }
  // A value list is its own group: the values are strings rather than frame rows, so they carry no
  // class, and the loop above would drop every one of them.
  const valueRows = rows.filter((row) => row.class === "value");
  if (valueRows.length) {
    box.appendChild(el("div", "group-name", "arguments"));
    for (const row of valueRows) box.appendChild(menuButton(doc, row, rows.indexOf(row)));
  }
  box.hidden = false;
  paintMenu();
}

/// One pressable row of the menu, with the pointer and `Enter` wired to the same thing they do
/// everywhere else on this page: a press takes the row, and hovering it moves the keyboard to it.
///
/// `at` is on the element as a `data-row` attribute rather than left implicit, because the mark has to
/// be findable from the box alone (`paintMenu`) and the rows are interleaved with group headings --
/// counting child nodes would count a heading as a row. The Node harness's stub DOM has no
/// `querySelectorAll` on an element, and a page that needed one to mark its own row would be a page
/// whose mark could not be checked without a browser.
function menuButton(doc, row, at) {
  const button = el("button", "row");
  button.type = "button";
  button.setAttribute("role", "option");
  button.setAttribute("data-row", String(at));
  if (typeof row.help === "string" && row.help) button.title = row.help;
  button.appendChild(el("code", "", row.send));
  button.appendChild(el("span", "", row.label));
  if (typeof row.help === "string" && row.help) button.appendChild(el("span", "help", row.help));
  button.addEventListener("click", () => takeMenuRow(doc, row));
  button.addEventListener("mouseenter", () => menuAt(doc, row));
  return button;
}

/// Mark the row the keyboard is on, and keep it in view. `row` names it by identity, which is how the
/// pointer and the arrow keys stay the same fact.
function paintMenu() {
  const box = document.getElementById("menu");
  if (!box || !menu) return;
  const buttons = Array.from(box.children || []).filter(
    (child) => child.getAttribute && child.getAttribute("data-row") !== null
  );
  buttons.forEach((button) => {
    const at = Number(button.getAttribute("data-row"));
    button.setAttribute("aria-selected", at === menu.at ? "true" : "false");
  });
  const current = buttons.find((button) => Number(button.getAttribute("data-row")) === menu.at);
  if (current && typeof current.scrollIntoView === "function") {
    current.scrollIntoView({ block: "nearest" });
  }
}

/// Move the keyboard to a row: by number for the arrow keys, by identity for the pointer.
function menuAt(doc, row) {
  if (!menu) return;
  const at = menu.rows.indexOf(row);
  if (at >= 0) menu.at = at;
  paintMenu();
}

/// Move by one row, wrapping at both ends. Wrapping rather than stopping: the list is short, and a
/// key that does nothing at the last row reads as a broken key.
function menuStep(doc, by) {
  if (!menu || menu.rows.length === 0) return;
  menu.at = (menu.at + by + menu.rows.length) % menu.rows.length;
  paintMenu();
}

/// Put the menu away. The text is left exactly as it is: this closes a list, not the line.
function hideMenu() {
  const box = document.getElementById("menu");
  if (box) box.hidden = true;
  menu = null;
}

/// What taking a row does, as one word.
///
/// The decision is separated from the doing for the reason every other decision on this page is in a
/// pure function: this is where the rule that matters lives -- a `form` row may not complete the line,
/// because the composer's text goes to the run and into the session file -- and a rule inside an
/// `async` function that fetches is a rule whose only witness is a browser.
function menuDispatch(row) {
  if (!row) return "none";
  if (row.class === "value") return "value";
  const command = row.command || row;
  const className = command.class;
  if (className === "panel") return "report";
  if (className === "form") return "dialog";
  const values = Array.isArray(command.values)
    ? command.values.filter((value) => typeof value === "string" && value.trim())
    : [];
  if (values.length && className === "selector") return "values";
  return "line";
}

/// Take a row: what a press or Enter does, per class.
///
/// The order of the checks is the order of commitment. A report is the only class this page *sends*
/// from the menu, and it goes out on `/report` -- the route that keeps the answer off the terminal --
/// with the reading landing in the settings dialog, which is where this page draws listings. An action
/// or a selector completes the line and leaves the person to press Enter, because a menu keystroke
/// should not decide anything. A selector that carries `values` reopens the menu on them. A form
/// opens the dialog at the row; a destructive row completes the line and stops there.
///
/// Everything a caller can observe happens **before** the first `await`, so the page's own behaviour
/// is checkable without a browser: the request is on the wire, the dialog is open, the line is written
/// or untouched. What is left asynchronous is the reading's answer, which arrives on the feed.
async function takeMenuRow(doc, row) {
  if (!row) return false;
  const command = row.command || row;
  const dispatch = menuDispatch(row);
  const send = String(row.send || "");
  if (dispatch === "value") {
    setComposerText((menu && menu.base ? menu.base + " " : "") + send);
    hideMenu();
    return true;
  }
  if (dispatch === "report") {
    hideMenu();
    // The text the menu was built from is a *query*, not a line: the person asked to read this command,
    // and leaving `/help` in the box would mean the next Enter sends it into the transcript -- which is
    // the exact thing the report route exists to avoid. Measured in a real browser: this claim failed
    // with `box: "/help"` before the box was cleared here.
    setComposerText("");
    // The dialog is opened *as* the reading is asked for, not after it answers: `askReport` draws
    // "reading…" where the listing will go, and a dialog that appeared only when the answer arrived
    // would leave the reader looking at the composer for a round trip with nothing saying anything
    // was happening.
    openSettings();
    showSettingsPane(screenOf(command));
    return askReport(doc, send, screenOf(command));
  }
  if (dispatch === "dialog") {
    // Never the line: a form row would put a credential in the composer, and the composer's text is
    // sent to the run and written into the session file. The dialog's own field is masked, emptied
    // after a send, and never reaches the conversation.
    hideMenu();
    // Cleared for the report branch's reason and one more of its own: what was typed is a command name
    // with no argument, and leaving it behind would put the credential's own line one Enter away.
    setComposerText("");
    openSettings();
    showSettingsPane(screenOf(command));
    markCommandRow(command);
    return true;
  }
  if (dispatch === "values") {
    // The line so far is kept in `base` so a value completes it rather than replacing it.
    const values = command.values.filter((value) => typeof value === "string" && value.trim());
    showMenu(doc, "", values);
    if (menu) menu.base = send;
    setComposerText(send + " ");
    return true;
  }
  // An action, a selector whose list lives elsewhere on the page, or a destructive row: the line,
  // completed, and no further. A destructive row stops one press short on purpose -- the control that
  // actually sends it is the dialog's two-press row, which prints the line before it goes.
  const wantsArgument = command.class === "danger" || command.class === "selector";
  setComposerText(wantsArgument ? send + " " : send);
  hideMenu();
  return true;
}

/// Put a line in the composer and put the caret at its end, so the next keystroke continues the line
/// rather than landing in the middle of it.
function setComposerText(text) {
  const box = document.getElementById("message");
  if (!box) return;
  box.value = text;
  if (typeof box.focus === "function") box.focus();
  if (typeof box.setSelectionRange === "function") {
    try {
      box.setSelectionRange(text.length, text.length);
    } catch (e) {
      // A `<textarea>` in the stub DOM has no selection; the value is what a check reads anyway.
    }
  }
  if (typeof sizeComposer === "function") sizeComposer();
}

/// The text of a row, read from its own children rather than from `textContent`.
///
/// `textContent` aggregates a whole subtree in a browser and does not in the Node harness's stub DOM,
/// and a mark that can only be found in a browser is a mark that is not checked. Every row this page
/// draws is one level deep -- a `code` and a `span`, or a field and a `button.send` -- so reading the
/// children is the same answer in both places.
function rowText(row) {
  return Array.from(row.children || [])
    .map((child) => String(child.textContent || ""))
    .join(" ");
}

/// Draw attention to one row of the dialog's command list -- how a `form` row taken from the menu is
/// handed over. The mark is transient and the page's own: a class on the row, and a scroll to it.
///
/// Walked rather than queried (`querySelectorAll` on an element is not in the stub DOM), and the walk
/// is the shape this page built: `#row-list-<screen>` holds one group per class, a group holds its rows
/// in a `group-rows` box, and the rows are that box's children. The box is found by class rather than
/// by position, because the heading is its previous sibling and a group the page has no word for has
/// no heading at all.
function markCommandRow(command) {
  const list = document.getElementById("row-list-" + screenOf(command));
  if (!list || typeof command.send !== "string") return;
  for (const group of Array.from(list.children || [])) {
    const box = Array.from(group.children || []).find((child) => child.className === "group-rows");
    if (!box) continue;
    // Every row this page draws carries the line it would send as its first child's text -- a `code`
    // and a `span`, a field and a `button.send`, an answer and a `save` -- so reading the children is
    // the same answer in a browser and under the stub DOM.
    for (const row of Array.from(box.children || [])) {
      if (!rowText(row).includes(command.send)) continue;
      row.className = String(row.className || "") + " pointed";
      if (typeof row.scrollIntoView === "function") row.scrollIntoView({ block: "center" });
      return;
    }
  }
}

/// Draw every screen from `doc.state`, or nothing when there is no state to draw.
///
/// Separate from applying a frame so that a refused send can put the screens back to what is in force
/// without inventing a frame: `applyState` stores what the process said, and this is the only thing
/// that reads it.
function showState(doc) {
  const state = doc.state;
  // The door goes with what is behind it: a page opened from a dropped file has no run and therefore
  // no settings, and a settings button that opens an empty dialog is a promise this page cannot keep.
  // The seat around it goes too, or a page with no run shows an empty strip with a hairline over it at
  // the foot of the list -- which reads as a row that failed to load rather than as nothing to say.
  const door = document.getElementById("settings-open");
  const seat = document.getElementById("side-foot");
  if (door) door.hidden = !state;
  if (seat) seat.hidden = !state;
  // Closing a dialog whose run has gone away, because the dialog is now empty: the frame says the
  // process has no state, and a modal over a page with nothing in it is worse than no modal.
  if (!state && settingsOpen()) closeSettings();
  // Before the early return: a state that has gone away has to take its settings and its rows with it,
  // and leaving them behind would leave controls showing values nothing reports any more.
  paintSettings(doc);
  // The preview's open control reads the same frame -- a run whose guard just went on must not go
  // on offering to start a program. Repainted only when a path is open, which is when it is drawn.
  if (preview) paintPreviewHead();
  // And the transcript, because one thing it draws comes from this frame: the branch buttons, whose
  // values are the run's own list of questions (`branchPoints`). Without this a page that has just
  // loaded would draw the conversation and no way to cut from it, until the next answer moved the
  // transcript -- and the frame carrying the list is the event a loaded page is waiting for, so the
  // one thing missing would be the one thing the frame was for. Painted here rather than queued
  // through `schedulePaint`, which would paint the page's own document: this function takes the
  // document it draws, and a state that arrived for another one has to draw there. A frame arrives
  // once per turn rather than once per delta, so there is nothing to coalesce.
  paint(doc);
}

/// Which screen is open. The page's own state, like the preview's path: nothing outside reads it.
let settingsPane = SETTINGS_PANES[0][0];

function settingsOpen() {
  const dialog = document.getElementById("settings");
  return !!dialog && dialog.hidden === false;
}

/// The rail and the pages, built once when the dialog opens.
///
/// Built rather than written into the page, because what is *on* a page is the frame's answer: a page
/// holds whatever the process filed on it, so the two halves of every page are its, and this function
/// attaches the page's names for the places (`SETTINGS_PANES`) to containers with the ids the painters
/// look for.
///
/// Rebuilt only when the dialog opens, which is the one moment the order could have changed: a rail
/// redrawn on every state frame would take the focus off the place somebody is reading, and a rail does
/// not depend on the frame at all. The empty pages are filled by `paintSettings`, which the frame that
/// arrived while the dialog was closed has already been through.
function showSettingsPanes() {
  const rail = document.getElementById("settings-list");
  const panes = document.getElementById("settings-panes");
  if (!rail || !panes) return;
  while (rail.firstChild) rail.removeChild(rail.firstChild);
  while (panes.firstChild) panes.removeChild(panes.firstChild);
  const state = doc.state;
  for (const [key, label, note] of SETTINGS_PANES) {
    const button = el("button", "section", label);
    button.type = "button";
    button.setAttribute("aria-current", key === settingsPane ? "true" : "false");
    button.addEventListener("click", () => showSettingsPane(key));
    rail.appendChild(button);

    const pane = el("section", "pane");
    pane.id = "pane-" + key;
    // The page's own head, then what is on it: the settings a person came to change, and under them
    // the commands they can do it with. The two containers are what `paintSettings` fills, and both
    // are built even when the frame has nothing for them -- an empty container is cheaper than a
    // special case in the painter, and each hides itself when it is empty.
    pane.appendChild(el("h2", "pane-title", label));
    pane.appendChild(el("p", "pane-note", note));
    const fields = el("div", "fields");
    fields.id = "fields-" + key;
    // A page with no run behind it has no settings at all, and the door is hidden then anyway; this
    // is what keeps the pages from appearing as four hundred empty pixels if it ever is not.
    if (!state) fields.hidden = true;
    pane.appendChild(fields);
    const rows = el("div", "rows");
    rows.id = "row-list-" + key;
    pane.appendChild(rows);
    panes.appendChild(pane);
  }
}

/// Open one screen: the pane that matches it is shown and the others are not.
///
/// One at a time on purpose -- the alternative is a scrolling column of every setting a run has, which
/// is the shape this dialog replaced. A name the rail does not offer leaves the dialog as it is,
/// rather than showing nothing at all.
function showSettingsPane(name) {
  if (!SETTINGS_PANES.some(([known]) => known === name)) return;
  settingsPane = name;
  for (const [known] of SETTINGS_PANES) {
    const pane = document.getElementById("pane-" + known);
    if (pane) pane.hidden = known !== name;
  }
  // The rail's cells are the list's own children in `SETTINGS_PANES` order, which is what makes the
  // index do the matching here rather than a second lookup: the dialog's name is the rail's *first*
  // child, so this walks the list and not the nav.
  const rail = document.getElementById("settings-list");
  const buttons = rail ? Array.from(rail.children || []) : [];
  buttons.forEach((button, at) => {
    const known = SETTINGS_PANES[at] ? SETTINGS_PANES[at][0] : "";
    if (button.setAttribute) button.setAttribute("aria-current", known === name ? "true" : "false");
  });
}

/// Open the dialog, which is one thing: the mask, the dialog, and the focus.
///
/// **Focus moves to the close button**, and that is the whole reason this is a function rather than
/// two `hidden = false` lines: a modal that opens with the focus still in the transcript is a modal
/// whose first keystroke goes to the page underneath it. `role="dialog"`/`aria-modal` are on the
/// element itself; what a browser does with them plus a focused control is a dialog a keyboard can
/// actually leave.
function openSettings() {
  const dialog = document.getElementById("settings");
  const mask = document.getElementById("settings-mask");
  if (!dialog) return;
  showSettingsPanes();
  // Painted here as well as on every frame, because the sections are built *now*: a dialog opened
  // for the first time would otherwise show empty screens until the next frame arrived, which is the
  // one moment the page is certainly not going to get one.
  paintSettings(doc);
  showSettingsPane(settingsPane);
  dialog.hidden = false;
  if (mask) mask.hidden = false;
  const close = document.getElementById("settings-close");
  if (close && typeof close.focus === "function") close.focus();
}

/// Close it, and put the focus back where it came from.
///
/// The focus going back to the door is what makes this a dialog rather than a disappearing panel: a
/// keyboard that opens settings, closes it and then has to hunt for its place is a keyboard that has
/// been moved twice.
///
/// A **reading** is let go of here, and that is a decision rather than housekeeping. A report's answer
/// is a temporary listing shown *inside* the dialog, and the dialog is the only place it can be read;
/// keeping it past the close would mean the next open shows the answer to a question asked minutes ago
/// with no rows to press. Measured in a real browser rather than reasoned: the `/` menu's form claim
/// opened the dialog on the *previous* report's reading, so the row it wanted to point at was not on
/// screen at all.
function closeSettings() {
  const dialog = document.getElementById("settings");
  const mask = document.getElementById("settings-mask");
  if (dialog) dialog.hidden = true;
  if (mask) mask.hidden = true;
  if (doc.reading) {
    doc.reading = null;
    doc.readingGroup = "";
    paintSettings(doc);
  }
  const door = document.getElementById("settings-open");
  if (door && typeof door.focus === "function") door.focus();
}

/// One `Escape`, and what it puts away.
///
/// The topmost thing first: the settings dialog is over the preview panel, so while it is open
/// `Escape` closes it and leaves the panel alone -- one press for the thing in front of you. Written
/// as one function rather than two listeners so that "which one does Escape close?" has an answer
/// that can be read, and checked, in one place.
function dismissTopmost() {
  // The menu first, and before the dialog even: it is inside the composer, which is where the
  // keyboard already is, so it is the thing in front of everything. A press that closed the dialog
  // while a half-typed `/` was offering commands would be closing something nobody was looking at.
  if (menuOpen()) {
    hideMenu();
    return true;
  }
  if (settingsOpen()) {
    closeSettings();
    return true;
  }
  if (preview) {
    closePreview();
    return true;
  }
  const jobs = document.getElementById("jobs");
  if (jobs && jobs.open) {
    jobs.open = false;
    return true;
  }
  return false;
}

/// The run's configuration, as the frame named `state` describes it.
///
/// Applied where the frame arrives rather than inside `paint`. A `<select>` is a control with
/// state of its own -- an open dropdown, the focus, the option under the pointer -- and a paint
/// happens many times a second while an answer streams; rebuilding the options in it would close
/// the list under whoever is choosing from it. The frame is only sent when the state has actually
/// changed, which is the same guarantee one level down.
function applyState(doc, text) {
  let parsed = null;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    // Not worth a damage block, and not worth hiding the controls either: the state is re-sent
    // whenever it changes, so the next one is a fresh chance to draw it right.
    return;
  }
  if (!parsed || parsed.type !== "state") return;
  doc.state = parsed;
  showState(doc);
}

/// The body `POST /message` wants.
///
/// One place, so the request shape is stated once: a JSON object with the text under `text`,
/// which is what the route reads and all it reads.
function messageBody(text) {
  return JSON.stringify({ text: text });
}

/// What the sidebar should send to open a conversation.
///
/// By *number*, which is the vocabulary `/sessions` prints and `/resume` accepts -- so the page
/// does not have to know an id, a path, or anything about where sessions live.
function resumeLine(n) {
  return "/resume " + n;
}

/// Split an SSE buffer into the frames that are complete, and the tail still arriving.
///
/// Pure, and tested in Node, because this is where a stream is most easily lost: a network
/// read ends wherever it ends, not where a frame does. A parser that assumed otherwise would
/// drop every frame that straddles a chunk boundary -- silently, and only under load.
///
/// Per the SSE grammar: `field: value`, a leading `:` is a comment, and a blank line ends the
/// frame. The `id` is the cursor and `event` is the name; an unnamed frame is a run event.
function sseFrames(buffer) {
  const frames = [];
  let rest = buffer;
  for (;;) {
    const cut = rest.indexOf("\n\n");
    if (cut < 0) break;
    const block = rest.slice(0, cut);
    rest = rest.slice(cut + 2);
    const frame = { event: "message", id: null, data: "" };
    let sawData = false;
    for (const line of block.split("\n")) {
      if (line.startsWith(":")) continue;   // the heartbeat
      const colon = line.indexOf(":");
      const field = colon < 0 ? line : line.slice(0, colon);
      let value = colon < 0 ? "" : line.slice(colon + 1);
      if (value.startsWith(" ")) value = value.slice(1);
      if (field === "event") frame.event = value;
      else if (field === "id") frame.id = value;
      else if (field === "data") {
        frame.data += (sawData ? "\n" : "") + value;
        sawData = true;
      }
    }
    // A block with no `data:` field carries no event -- which is what a heartbeat comment
    // is, and what the SSE specification says about a dispatch with an empty data buffer.
    if (sawData) frames.push(frame);
  }
  return { frames, rest };
}

/// Whether this page was served by a running flint, rather than opened from disk.
///
/// The two levels differ in exactly this: a page from `file://` has no origin to fetch
/// from and no token, so it renders a file you hand it; a page served by `--web` renders
/// the conversation the process is writing. Nothing about the page changes -- same file,
/// same renderer -- only where the lines come from.
function servedByFlint(loc) {
  const here = loc || (typeof location !== "undefined" ? location : null);
  if (!here) return false;
  return here.protocol !== "file:" && tokenFromSearch(here.search) !== "";
}

/// The conversation an *exported* page carries: the session's own lines, in a JSON island beside the
/// page, and nothing else.
///
/// An export is one file -- this page with the conversation welded into it -- and it is opened from
/// `file:`, which `servedByFlint` is already false for. So this is the other half of that branch: the
/// same lines `applyText` reads for a dropped session file, which is why an export draws exactly like
/// a session somebody dropped on the page. There is no second renderer and no second vocabulary.
///
/// An island that cannot be read returns nothing rather than throwing: the boot says so where a
/// person can see it, because a page that looks like an empty conversation is worse than one that
/// says it is damaged.
function islandLines(island) {
  if (!island || !island.textContent) return "";
  try {
    const carried = JSON.parse(island.textContent);
    return Array.isArray(carried.lines) ? carried.lines.join("\n") : "";
  } catch (e) {
    return "";
  }
}

// ---------------------------------------------------------------------------
// The view: a document in, elements out. Every text goes in through textContent.
// ---------------------------------------------------------------------------

function el(tag, className, textContent) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (textContent !== undefined) node.textContent = textContent;
  return node;
}

/// One fact about the run's work, as the dot and the count the header draws.
///
/// A dot *and* a count rather than a colour alone: the hue says which kind of thing it is, and the
/// number is what a person actually reads ("2 running" beats a yellow pill). The `title` carries the
/// sentence the chip is short for, which is also where a screen reader gets it -- DSH's job badge is
/// a whole sentence for the same reason and this is the same fact in less room.
function chip(kind, text, sentence) {
  const node = el("span", "chip " + kind);
  if (sentence) node.title = sentence;
  node.appendChild(el("span", "dot"));
  node.appendChild(el("span", "", text));
  return node;
}

/// One line describing a tool call, without interpreting its arguments.
function toolSummary(block) {
  const parts = [];
  parts.push(el("span", "name", block.name || "(tool)"));
  if (block.args) {
    const one = clip(block.args.replace(/\s+/g, " "), 160);
    for (const node of linkNodes(one)) parts.push(node);
  }
  return parts;
}

/// A line of text with the addresses in it as things to press.
///
/// Two kinds, two doors, and the difference is which one has somewhere real to go:
///
///   * a **web address** is a link in a new tab. This document is the conversation -- the token,
///     the stream, the reader's place -- and following a link in it would throw all three away, so
///     the tab is what keeps it. It goes in as a *property* (`link.href = part.url`) rather than as
///     markup, which is what makes `asUrl`'s allowlist the only thing between a model's words and
///     script in this page: a scheme that is not the web never becomes a link at all.
///   * a **path** is a button that opens the preview panel, because a file has no address a browser
///     could open from here, and `GET /file` is the one route that can read one.
///
/// It stays inside the page's one rule either way: the splitter decides where the text is cut, and
/// every piece still goes in through `textContent`, so a file whose name is `<script>` is a
/// filename here like any other.
///
/// `absoluteOnly` is passed through to the splitter: prose is read with the narrow rule, tool
/// output with the wide one.
function linkNodes(text, absoluteOnly) {
  const nodes = [];
  for (const part of addressParts(text, absoluteOnly)) {
    if (part.url !== undefined) {
      const link = el("a", "link", clip(part.url, 120));
      link.href = part.url;
      // The visible text may be shortened; the address it goes to is not.
      link.title = part.url;
      link.target = "_blank";
      // `noopener` so the page that opens cannot reach back through `window.opener` and drive
      // this document with its token; `noreferrer` for the same reason a token never travels in a
      // query string.
      link.rel = "noopener noreferrer";
      nodes.push(link);
      continue;
    }
    if (part.path === undefined) {
      nodes.push(document.createTextNode(part.text));
      continue;
    }
    // What the reader met, not what the route is asked for: a `grep` hit reads `src/web.rs:412:7`
    // and a GitHub link reads `src/web.rs#L412`, and both of those say *where* in the file. The
    // button goes to `part.path` at `part.line`; it says `part.written`, which is the same fact in
    // the words the tool used -- and a `file://` prefix is dropped on the way (see `fileAddress`),
    // since the scheme is the one part of the token the panel does not need to repeat.
    const button = el("button", "path", part.written || part.path);
    button.type = "button";
    button.title = part.line ? part.path + ":" + part.line : part.path;
    button.addEventListener("click", (e) => {
      // Both, because this sits inside a `summary`: without them the press would also toggle the
      // block open or shut, and the file that was just opened would slide down the page.
      e.preventDefault();
      e.stopPropagation();
      openPreview(part.path, part.line);
    });
    nodes.push(button);
  }
  return nodes;
}

/// A `<pre>` whose text has its paths turned into buttons.
function linkifiedPre(text) {
  const node = el("pre");
  for (const child of linkNodes(text)) node.appendChild(child);
  return node;
}

function toolBlock(block) {
  const box = el("details", "tool");
  const summary = el("summary");
  summary.appendChild(el("span", block.ok ? "ok" : "bad", block.done ? (block.ok ? "✓ " : "✗ ") : "… "));
  for (const part of toolSummary(block)) summary.appendChild(part);
  box.appendChild(summary);
  if (block.args) box.appendChild(linkifiedPre(block.args));
  if (block.output) box.appendChild(linkifiedPre(block.output));
  return box;
}

/// Repaint at most once per animation frame.
///
/// `message.delta` arrives per fragment -- hundreds of them for one answer -- and repainting
/// per fragment would rebuild the whole transcript hundreds of times to show text that is
/// still arriving. Coalescing is safe because the paint is always a full render of the
/// document: it is slower to be wrong than to be late.
let repaintQueued = false;
function schedulePaint() {
  if (repaintQueued) return;
  repaintQueued = true;
  const soon = typeof requestAnimationFrame === "function" ? requestAnimationFrame : (fn) => fn();
  soon(() => {
    repaintQueued = false;
    paint(doc);
  });
}

/// Whether a turn the page drew is the question a value's label names.
///
/// The label is `util::preview` in the process: a question's first line, trimmed, clipped at 64
/// characters, with `" ..."` after it when the question had more than one line or a longer first line.
/// The page is handed the clipped string and does not clip again -- what is mirrored here is the
/// *comparison*, and the ellipsis is what tells the two cases apart. The page needs it because the
/// only thing linking a value to a turn is that the run and the page are looking at the same question:
/// the value is a number, and the number the terminal counts from is the run's own history, not this
/// page's scrollback (see `branchPoints`).
///
/// Everywhere the two rules disagree the answer is no. A question with no button is a missing
/// convenience; a button on the wrong answer would cut a branch somewhere the person did not point at,
/// and the branch is a new file they would have to read to find that out.
function isTheQuestion(text, label) {
  const body = String(text == null ? "" : text).replace(/\r\n/g, "\n");
  const first = (body.split("\n")[0] || "").trim();
  // A trailing newline is not a second line: `str::lines` in the process does not count it either, so
  // a question the person ended with a newline is still one line to the run.
  const lines = (body.slice(-1) === "\n" ? body.slice(0, -1) : body).split("\n").length;
  if (label.length > 4 && label.slice(-4) === " ...") {
