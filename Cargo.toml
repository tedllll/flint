[package]
name = "flint"
version = "0.1.0"
edition = "2021"
description = "A minimal cross-platform rescue agent. When everything else is broken, strike a spark."
license = "MIT"

[lib]
name = "flint"
path = "src/lib.rs"

[[bin]]
name = "flint"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "rustls-native-certs",
    "http2",
    "json",
    "stream",
    "system-proxy",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "io-util",
    "io-std",
    "sync",
    # For the loopback listener behind `--web`. A feature and not a dependency: `mio` is
    # already in the lock file via `process` on Unix, so this compiles nothing new.
    # `docs/web-mode.md` §7 is the argument for hand-rolling the HTTP instead of adding
    # `hyper`, which is also already in the tree.
    "net",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
futures-util = "0.3"
anyhow = "1"
async-trait = "0.1"
dirs = "7"
crossterm = "0.29"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Unix only, and not a new crate: `libc` was already a dev-dependency (it is also in the tree
# under tokio and rustls on Unix), and it is here for the two things `std` cannot do -- `poll`
# a descriptor for `POLLHUP`, so a terminal that goes away ends the run instead of spinning a
# core for ever (`watch_for_hangup` in `src/main.rs`), and `openpty`, which is how
# `tests/tty_hangup.rs` gives a child a terminal to lose.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
