[package]
name = "flint"
version = "0.1.0"
edition = "2021"
description = "A minimal cross-platform rescue agent. When everything else is broken, strike a spark."
license = "MIT"

[lib]
name = "flint"
path = "src/lib.rs"

[[bin]]
name = "flint"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "rustls-native-certs",
    "http2",
    "json",
    "stream",
    "system-proxy",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "io-util",
    "io-std",
    "sync",
    # For the loopback listener behind `--web`. A feature and not a dependency: `mio` is
    # already in the lock file via `process` on Unix, so this compiles nothing new.
    # `docs/web-mode.md` §7 is the argument for hand-rolling the HTTP instead of adding
    # `hyper`, which is also already in the tree.
    "net",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
futures-util = "0.3"
anyhow = "1"
async-trait = "0.1"
dirs = "7"
crossterm = "0.29"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Only for tests/tty_hangup.rs, which needs a pty: `openpty` to give a child a terminal, and
# `poll` to watch it. Nothing in `std` can make either call.
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
