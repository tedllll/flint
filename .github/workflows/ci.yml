name: ci

# `release.yml` already builds all four targets on every push, so a change that
# does not compile is caught by the push that broke it. What it does not do is
# run a single test: a binary that links and a program that works are different
# claims, and the second one is the claim this repository makes. This job is what
# turns "the tests pass" from a fact about the machine that pushed into a fact
# about the commit.
#
# Both platforms on purpose. The tests were written on Windows and the target that
# would be shipped is usually Linux, so the interesting failures are the ones that
# only one of the two sees -- a shell name from the config, a path separator in a
# session directory, a test asserting on `\r\n`.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms report, even when the first one to finish fails: half the
      # value of a matrix is knowing whether a failure is one platform or both.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The dependency tree is the slow part and it changes on almost no commits.
      # Without this the job costs minutes on a change to a comment, which is how
      # a check like this gets switched off again.
      - uses: Swatinem/rust-cache@v2

      # `pipefail` is the difference between a failing test run and a green step:
      # without it the pipeline's status is `tee`'s, and the output is only read by
      # the step below.
      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target
          cargo test 2>&1 | tee target/test-output.txt

      # A red build has to say *which* test failed somewhere a reader can see it. The
      # runner's own log needs a token with write access to download; an annotation does
      # not, and this repository is pushed to from a machine that has no token at all --
      # so without this step the only honest report available is "exit code 1".
      #
      # The test's name is not enough to act on: `thread ... panicked at tests/x.rs:711`
      # plus the assertion's own message is what says whether the test or the code is
      # wrong, so both are carried out. Annotations are kept per step, which is why this is
      # `head`ed rather than dumped -- and the heads are generous because the message is
      # what the limit used to eat: measured on a run whose failures were one panic with a
      # 13-line offender list and one panic whose *own* multi-line message (the child's
      # stderr, in `the_view_follows_the_conversation_through_a_switch`) fell past a
      # `head -20` that the first failure had already spent. The failing *names* are also
      # emitted before the context, so the two heads cannot starve each other.
      #
      # Both greps are `|| true` on purpose: a grep that matches nothing exits 1, which
      # would turn this step red and add a second, unexplainable failure to the report.
      # The thread line carries an id in parentheses on recent Rust (`thread 'x' (1234)
      # panicked at`), which is why the pattern does not try to be exact.
      - name: Name the failing tests
        if: failure() && steps.test.outcome == 'failure'
        shell: bash
        run: |
          [ -f target/test-output.txt ] || exit 0
          grep -E '^test .* FAILED$' target/test-output.txt | head -10 | sed 's/^/::error::/' || true
          grep -A 6 -E "^thread .* panicked at" target/test-output.txt | head -80 | sed 's/^/::error::/' || true

      # Silent is the standard this repository holds itself to, so a warning is
      # the failure. `cargo test` builds the targets; this is what actually reads
      # the lints in them.
      - run: cargo clippy --all-targets -- -D warnings

      # The two headless harnesses, which until now ran only on the machine that wrote
      # them -- and a claim checked only by hand is a claim that stops being checked.
      #
      # They are the same shape as the tests above and belong in the same job for the same
      # reason: `term-layout-test.js` models the viewport's own bytes and replays them
      # through `vtscreen.js`, and `web-view-test.js` runs the page's script in a Node `vm`
      # with a stub DOM. Neither needs a browser, a pty or a display, which is exactly why
      # they can be here; `browser-controls-test.js`, which does need a browser, stays the
      # one that is run by hand, and `ROADMAP.md` says so where it is named.
      #
      # Node is already on both runners, so nothing is installed for this. The version is
      # printed because a harness that failed on a runner's Node and passed on a
      # developer's is a difference worth being able to read off the log.
      - name: The terminal and page harnesses
        shell: bash
        run: |
          node --version
          node scripts/term-layout-test.js
          node scripts/web-view-test.js

      # And the two doors that are not Rust at all: the Python caller and the MCP server. They are
      # shipped surfaces -- `AGENTS.md` names both, and an editor or a parent agent is what uses them
      # -- and until this step none of the three checks above touched a line of either. `test_call.py`
      # drives `flint_call.py` end to end against a stub provider and reads the request bodies back
      # out of the stub; `test_mcp.py` speaks JSON-RPC at `flint_server.py`, which spawns a real flint
      # and would otherwise be checked only on the machine that wrote it.
      #
      # Both are stdlib-only and take their own free port, so nothing is installed for this and no
      # key is needed. The interpreter is probed rather than named -- see the comment in the step --
      # and its version is printed for the same reason as Node's above: a check that failed on a
      # runner's interpreter and passed on a developer's is a difference worth being able to read off
      # the log.
      #
      # The binary under test is `cargo test`'s own build, two steps up: `CARGO_BIN_EXE_flint` is what
      # `tests/` spawn, so it is there, and both scripts choose it themselves (`flint_call._binary`,
      # `test_mcp.flint_binary`), print which one they ran and refuse to pass on an installed `flint`
      # from `PATH` instead -- the wrong-reason pass those two files exist to catch, and one that a
      # bare `flint` in this step's environment would have walked straight into.
      #
      # Nothing is exported to them on purpose. `$PWD` in the windows job's bash is an MSYS path
      # (`/d/a/flint/flint`), and a native Windows Python cannot open one, so `FLINT_BIN="$PWD/..."`
      # would name a file the check cannot spawn. It would work anyway, because MSYS rewrites
      # environment variables that look like paths on the way out to a non-MSYS program -- which is
      # the reason not to do it: a guarantee that rides on a compatibility shim is worse than the
      # check resolving the path in its own language.
      #
      # Each check is `tee`d into a file and, when it fails, what it says is re-emitted as
      # annotations -- the same reason the `Name the failing tests` step above exists, learned the
      # same way: the first run of this step failed on ubuntu and the only report available was
      # "exit code 1", because a step that writes only to stdout is invisible to anyone without a
      # token. The check's own `FAIL <claim> -- <what it saw>` lines are carried first, because that
      # detail is where the reason is (an exit code and the child's stderr); the last lines are
      # carried after them, because a Python traceback puts the exception on its last line. Both
      # checks run even when the first one fails, so one push answers for both.
      - name: The Python caller and the MCP server
        shell: bash
        run: |
          set -o pipefail
          # `python` is not reliably the program. ubuntu has `python3` and the windows runner has
          # both, but on Windows `python3` can be the Store's *stub*: it exists, `command -v` finds
          # it, and running it prints "Python was not found; run without arguments to install from
          # the Microsoft Store" and exits 9009 -- measured on this machine, in this shell. So the
          # name is probed by running it and the one that answers is the one used.
          PY=""
          for candidate in python3 python; do
            if "$candidate" --version >/dev/null 2>&1; then
              PY="$candidate"
              break
            fi
          done
          if [ -z "$PY" ]; then
            echo "::error::no python on this runner, so neither example check can run"
            exit 1
          fi
          "$PY" --version
          run_check() {
            label="$1"
            shift
            log="target/$label.log"
            echo "== $label"
            if "$@" 2>&1 | tee "$log"; then
              return 0
            fi
            grep -E '^  FAIL' "$log" | head -10 | sed -e 's/%/%25/g' -e 's/\r$//' | sed 's/^/::error::/' || true
            tail -n 6 "$log" | sed -e 's/%/%25/g' -e 's/\r$//' | sed 's/^/::error::/'
            return 1
          }
          status=0
          run_check python-caller "$PY" examples/python/test_call.py || status=1
          run_check mcp-server "$PY" examples/mcp/test_mcp.py || status=1
          exit "$status"
